<style>
  /* Layout: one-screen portrait game — HUD on top, life feed in the middle, choices slide up from the bottom. Single light theme on purpose (matches the course site's meadow palette). */
  :root {
    --bg: #EEF7F2;
    --ink: #1E293B;
    --ink-soft: #475569;
    --muted: #64748B;
    --card: #FFFFFF;
    --green: #059669;
    --green-soft: #D1FAE5;
    --blue: #0284C7;
    --blue-soft: #E0F2FE;
    --gold: #D97706;
    --gold-soft: #FEF3C7;
    --teal: #0D9488;
    --rose: #E11D74;
    --line: #CFE3D8;
    --serif: 'jf-openhuninn-2.1', "Noto Serif TC", serif;
    --sans: 'jf-openhuninn-2.1', "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(56,189,248,.16), transparent 45%),
      radial-gradient(circle at 95% 100%, rgba(251,191,36,.14), transparent 50%);
    color: var(--ink);
    font-family: var(--sans);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  #app {
    position: relative;
    height: 100%;
    max-width: 520px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* 共用按鈕 */
  .btn {
    display: block; width: 100%;
    border: 0; border-radius: 16px;
    padding: 14px 18px;
    font-weight: 700; font-size: 1.05rem;
    background: var(--blue); color: #fff;
    box-shadow: 0 6px 16px rgba(2,132,199,.25);
    transition: transform .15s ease;
    text-decoration: none; text-align: center;
  }
  .btn:active { transform: scale(.97); }
  .btn.gold { background: var(--gold); box-shadow: 0 6px 16px rgba(217,119,6,.25); }
  .btn.green { background: var(--green); box-shadow: 0 6px 16px rgba(5,150,105,.25); }
  .btn.ghost { background: #fff; color: var(--ink-soft); border: 1.5px solid var(--line); box-shadow: none; }

  /* 開始畫面 */
  #title {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 32px 24px; text-align: center; gap: 14px;
  }
  .robe {
    font-size: 4.2rem; line-height: 1;
    filter: drop-shadow(0 0 18px rgba(251,191,36,.7));
    animation: float 3.2s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-8px); } }
  #title h1 { font-family: var(--serif); font-weight: 900; font-size: 2.3rem; margin: 6px 0 0; letter-spacing: .06em; }
  #title .sub { font-family: var(--serif); color: var(--blue); font-weight: 700; font-size: 1.15rem; letter-spacing: .3em; margin: 0; }
  #title .lede { color: var(--ink-soft); line-height: 1.8; margin: 8px 0 10px; }
  #title .meta { color: var(--muted); font-size: .85rem; margin: 0; }
  #title .collect { color: var(--muted); font-size: .85rem; margin: 0; }
  #title .home { color: var(--muted); font-size: .85rem; text-decoration: underline; }

  /* HUD */
  #hud {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px 8px;
    border-bottom: 2px dashed rgba(2,132,199,.15);
    background: rgba(238,247,242,.92);
  }
  .age-box { text-align: center; flex: none; min-width: 64px; }
  .age-box .n { font-family: var(--serif); font-size: 1.9rem; font-weight: 900; line-height: 1; }
  .age-box .u { font-size: .75rem; color: var(--muted); }
  .age-box .mood { font-size: 1.3rem; line-height: 1.2; transition: transform .3s ease; }
  .bars { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 8px; }
  .bar { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 4px; font-size: .74rem; }
  .bar span:first-child { white-space: nowrap; }
  .bar .track { grid-column: 1 / -1; grid-row: 2; height: 7px; border-radius: 99px; background: #E2E8F0; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 99px; transition: width .5s ease; }
  .bar .v { text-align: right; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .bar.gold .fill { background: var(--gold); }
  .bar.tian .fill { background: linear-gradient(90deg, #38BDF8, #A78BFA); }
  .bar.fam .fill { background: var(--rose); }
  .bar.hp .fill { background: var(--green); }
  .bar.work .fill { background: var(--blue); }
  .bar.pal .fill { background: var(--teal); }
  .hud-right { flex: none; display: grid; gap: 6px; justify-items: center; }
  #robeMini { font-size: 1.6rem; transition: filter .5s ease, opacity .5s ease; }
  #speedBtn {
    border: 1.5px solid var(--line); background: #fff; border-radius: 99px;
    padding: 2px 10px; font-size: .75rem; font-weight: 700; color: var(--ink-soft);
  }
  #speedBtn.on { background: var(--blue-soft); color: var(--blue); border-color: var(--blue); }

  /* 章節橫幅 */
  #chapter {
    padding: 6px 14px; font-size: .82rem; color: var(--teal); font-weight: 700;
    min-height: 1.9em;
  }

  /* 人生跑馬燈 */
  #feed {
    flex: 1; overflow-y: auto;
    padding: 4px 14px 24px;
    scroll-behavior: smooth;
  }
  .ln {
    display: flex; gap: 10px; align-items: flex-start;
    margin: 8px 0;
    animation: pop .35s ease;
    line-height: 1.65;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } }
  .ln .a {
    flex: none; min-width: 3.6em; text-align: center;
    font-size: .78rem; font-weight: 700; color: var(--blue);
    background: var(--blue-soft); border-radius: 99px; padding: 2px 8px; margin-top: 2px;
  }
  .ln .t { flex: 1; }
  .ln.sys .t { color: var(--muted); font-size: .9rem; }
  .ln.lyric .t {
    font-family: var(--serif); color: var(--gold); font-weight: 700;
    background: var(--gold-soft); border-radius: 12px; padding: 8px 12px;
  }
  .ln.big .t {
    font-family: var(--serif); font-weight: 900; font-size: 1.1rem; color: var(--teal);
    border-left: 4px solid var(--teal); padding-left: 10px;
  }
  .chip { display: inline-block; font-size: .78rem; font-weight: 700; border-radius: 99px; padding: 1px 8px; margin: 2px 4px 0 0; background: #F1F5F9; }
  .chip.up { color: var(--green); background: var(--green-soft); }
  .chip.down { color: #B91C1C; background: #FEE2E2; }
  .chip.badge { color: var(--gold); background: var(--gold-soft); }

  /* 底部抉擇面板與疊加視窗 */
  #sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: #fff;
    border-radius: 24px 24px 0 0;
    box-shadow: 0 -12px 30px rgba(15,23,42,.12);
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    transform: translateY(105%);
    transition: transform .3s ease;
    max-height: 82%; overflow-y: auto;
    z-index: 20;
  }
  #sheet.open { transform: none; }
  #sheet h3 { margin: 0 0 4px; font-family: var(--serif); font-size: 1.15rem; }
  #sheet .q { margin: 0 0 14px; color: var(--ink-soft); line-height: 1.7; }
  .opt {
    display: block; width: 100%; text-align: left;
    border: 1.5px solid var(--line); background: #F8FAFC;
    border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
    font-weight: 600; line-height: 1.5;
    transition: transform .12s ease, border-color .12s ease;
  }
  .opt:active { transform: scale(.98); }
  .opt:hover { border-color: var(--blue); }
  .opt.temple { background: var(--green-soft); border-color: var(--green); }
  .opt.excuse { background: #F1F5F9; border-style: dashed; }
  .opt small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; margin-top: 2px; }

  #overlay {
    position: absolute; inset: 0; z-index: 30;
    background: rgba(15,23,42,.45);
    display: flex; align-items: center; justify-content: center;
    padding: 18px;
  }
  .card {
    width: 100%; max-height: 100%; overflow-y: auto;
    background: #fff; border-radius: 24px;
    padding: 22px 18px;
    box-shadow: 0 20px 40px rgba(15,23,42,.25);
    text-align: center;
    animation: pop .3s ease;
  }
  .card h2 { font-family: var(--serif); margin: 4px 0 8px; font-size: 1.35rem; }
  .card p { color: var(--ink-soft); line-height: 1.75; margin: 8px 0; }
  .card .btn { margin-top: 12px; }
  .card .hint { font-size: .8rem; color: var(--muted); }

  /* 母娘對話 */
  .glow {
    width: 84px; height: 84px; margin: 4px auto 10px; border-radius: 50%;
    background: radial-gradient(circle, #FEF3C7 0%, #FDE68A 40%, rgba(251,191,36,0) 72%);
    animation: breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe { 50% { transform: scale(1.12); } }
  .say { font-family: var(--serif); font-size: 1.12rem; min-height: 3.4em; color: var(--ink); }

  /* 下凡抽籤 */
  .slot {
    font-family: var(--serif); font-weight: 900; font-size: 2.2rem;
    height: 1.6em; line-height: 1.6em; margin: 14px 0;
    border-radius: 16px; background: var(--blue-soft); color: var(--blue);
  }
  .slot.win { background: var(--gold-soft); color: var(--gold); animation: pop .3s ease; }

  /* 劇本卡 */
  .deck { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 4px; perspective: 600px; }
  .pc {
    aspect-ratio: 3/4; border-radius: 14px; border: 0;
    background: linear-gradient(135deg, #0284C7, #0D9488);
    color: #fff; font-size: 1.6rem;
    box-shadow: 0 6px 14px rgba(2,132,199,.25);
    transition: transform .45s ease;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    padding: 6px;
  }
  .pc.flip { transform: rotateY(180deg) scale(1.04); }
  .pc.face { background: #fff; color: var(--ink); border: 2px solid var(--gold); transform: none; }
  .pc.face b { font-size: .8rem; }
  .pc.dim { opacity: .35; }

  /* 佛堂充電一日 */
  .day { text-align: left; margin: 10px 0; display: grid; gap: 6px; }
  .day div { display: flex; gap: 8px; padding: 6px 10px; border-radius: 10px; background: #F8FAFC; opacity: .35; transition: all .25s ease; font-size: .92rem; }
  .day div.on { opacity: 1; background: var(--green-soft); }
  .day span:first-child { font-variant-numeric: tabular-nums; color: var(--muted); flex: none; }
  .quote { font-family: var(--serif); color: var(--gold); background: var(--gold-soft); border-radius: 12px; padding: 10px 12px; font-weight: 700; }

  /* 小遊戲 */
  .balloon { font-size: 3rem; display: inline-block; transition: transform .15s ease; margin: 18px 0; transform-origin: center bottom; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ingr { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
  .ingr button { border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 8px 2px; font-size: .78rem; }
  .ingr button.sel { border-color: var(--green); background: var(--green-soft); }
  .ingr button span { display: block; font-size: 1.5rem; }
  .likes { display: grid; gap: 8px; margin: 12px 0; text-align: left; }
  .likes button { border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 12px; text-align: left; line-height: 1.5; }
  .likes button.got { border-color: var(--rose); background: #FFF1F7; }
  input[type=date] { font: inherit; padding: 10px; border-radius: 12px; border: 1.5px solid var(--line); width: 100%; margin: 10px 0 0; }

  /* 結局頁 */
  #ending { position: absolute; inset: 0; overflow-y: auto; padding: 22px 16px 40px; background: var(--bg); z-index: 25; }
  .end-card {
    background: #fff; border-radius: 24px; padding: 24px 18px; text-align: center;
    border: 2px solid var(--gold); box-shadow: 0 10px 25px rgba(217,119,6,.15);
  }
  .end-card .em { font-size: 3.4rem; }
  .end-card .kicker { color: var(--muted); font-size: .85rem; margin: 6px 0 0; }
  .end-card h2 { font-family: var(--serif); font-size: 1.6rem; margin: 2px 0 10px; }
  .end-card .lyric { font-family: var(--serif); color: var(--gold); background: var(--gold-soft); border-radius: 12px; padding: 10px; font-weight: 700; line-height: 1.8; }
  .end-card .desc { color: var(--ink-soft); line-height: 1.8; }
  .sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 4px; }
  .sum div { background: #F8FAFC; border-radius: 12px; padding: 8px 4px; }
  .sum b { display: block; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .sum small { color: var(--muted); font-size: .72rem; }
  .sec { background: #fff; border-radius: 20px; padding: 18px 16px; margin-top: 14px; border: 1.5px solid rgba(2,132,199,.18); }
  .sec h3 { margin: 0 0 10px; font-family: var(--serif); font-size: 1.05rem; }
  .badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .badges div { border-radius: 12px; padding: 8px 2px; text-align: center; font-size: .8rem; font-weight: 700; background: #F1F5F9; color: #94A3B8; }
  .badges div.got { background: var(--gold-soft); color: var(--gold); }
  .themes { display: grid; gap: 6px; margin: 10px 0 12px; }
  .themes div { display: flex; gap: 10px; font-size: .9rem; align-items: baseline; }
  .themes b { color: var(--blue); flex: none; font-variant-numeric: tabular-nums; }
  .themes span { color: var(--ink-soft); }
  .stack { display: grid; gap: 10px; }
  .toast {
    position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 99px; font-size: .9rem;
    z-index: 50; animation: pop .25s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <section id="title">
    <div class="robe">🪷</div>
    <h1>褪下仙衣</h1>
    <p class="sub">八十億分之一</p>
    <p class="lede">每個人都是褪下仙衣、來到人間的原靈。<br>下凡抽籤，快速走完一生——<br>名利帶不走，這一生，你帶走了什麼？</p>
    <button class="btn gold" id="startBtn" type="button">下凡去 ▶</button>
    <p class="meta">約 6 分鐘・手機電腦點開就能玩</p>
    <p class="collect" id="collect"></p>
    <a class="home" href="../index.html">🍃 認識 2027 全真社青班</a>
  </section>

  <div id="game" hidden style="display:flex;flex-direction:column;height:100%">
    <header id="hud">
      <div class="age-box"><div class="n" id="ageN">0</div><div class="u">歲</div><div class="mood" id="mood" title="心情">🙂</div></div>
      <div class="bars">
        <div class="bar hp"><span>💪 健康</span><span class="v" id="v-hp"></span><div class="track"><div class="fill" id="b-hp"></div></div></div>
        <div class="bar work"><span>💼 工作</span><span class="v" id="v-work"></span><div class="track"><div class="fill" id="b-work"></div></div></div>
        <div class="bar gold"><span>🪙 金幣</span><span class="v" id="v-gold"></span><div class="track"><div class="fill" id="b-gold"></div></div></div>
        <div class="bar fam"><span>❤️ 家人</span><span class="v" id="v-fam"></span><div class="track"><div class="fill" id="b-fam"></div></div></div>
        <div class="bar pal"><span>🤝 夥伴</span><span class="v" id="v-pal"></span><div class="track"><div class="fill" id="b-pal"></div></div></div>
        <div class="bar tian"><span>✨ 天幣</span><span class="v" id="v-tian"></span><div class="track"><div class="fill" id="b-tian"></div></div></div>
      </div>
      <div class="hud-right">
        <div id="robeMini" title="仙衣的光">🪷</div>
        <button id="speedBtn" type="button">▶▶ ×2</button>
      </div>
    </header>
    <div id="chapter"></div>
    <main id="feed" aria-live="polite"></main>
  </div>

  <div id="sheet" role="dialog" aria-modal="true"></div>
  <div id="overlay" hidden></div>
  <section id="ending" hidden></section>
</div>

<script>
(() => {
  // ───────── 工具 ─────────
  const $ = id => document.getElementById(id);
  const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const clamp = v => Math.max(0, Math.min(100, v));
  const shuffle = arr => arr.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let fast = false;
  const wait = ms => new Promise(r => setTimeout(r, fast ? ms / 2.2 : ms));

  const SITE = 'https://steven4dev.github.io/yiguandao-2027-course/';
  const CAL = 'https://calendar.google.com/calendar/u/0?cid=NWMyYTEyNmIwYzFiOWIzMzQ4ZmM5MzM5NTFkZDNiNzQ5ZmY5ZjM5Zjc1MDkzMzE3N2Q5MDgzNDNiMTY4ZjRmY0Bncm91cC5jYWxlbmRhci5nb29nbGUuY29t';

  // 收集紀錄只存在這台裝置，讀不到也照常遊玩
  const STORE = 'xianyi-collect';
  const loadCollect = () => {
    try { return Object.assign({ endings: [], badges: [], personas: [], plays: 0 }, JSON.parse(localStorage.getItem(STORE) || '{}')); }
    catch (e) { return { endings: [], badges: [], personas: [], plays: 0 }; }
  };
  const saveCollect = c => { try { localStorage.setItem(STORE, JSON.stringify(c)); } catch (e) {} };

  // ───────── 資料 ─────────
  // 六張人生劇本卡（取自〈回來佛堂〉Verse 2、3）
  const PERSONAS = [
    { id: 'tech', em: '💻', name: '科技新貴派', lyric: '他進了科學園區　頗高的工作待遇', fx: { gold: 15, work: 20, hp: -5, fam: -5 }, excuse: '先拚個幾年，存夠再說' },
    { id: 'family', em: '🏠', name: '成家立業派', lyric: '有人說他先成家立業不得閒', fx: { fam: 15, work: 5 }, excuse: '等孩子大一點再說' },
    { id: 'social', em: '🥂', name: '人脈社交派', lyric: '有人說拓展人脈不易　假日要忙 Social', fx: { gold: 5, work: 5, pal: 10 }, excuse: '週末已經排滿了' },
    { id: 'drift', em: '🌊', name: '漂流派', lyric: '有人失去了自我　手足無措四處漂流', fx: { hp: 5, work: -5 }, excuse: '我現在不知道要幹嘛' },
    { id: 'forgot', em: '🕯️', name: '初衷遺忘派', lyric: '有人忘記了初衷　入道之後依舊漂泊', fx: { tian: 8 }, excuse: '求過道就好了吧' },
    { id: 'abroad', em: '✈️', name: '留學菁英派', lyric: '有人為了變強　力爭上游還留學出國', fx: { gold: 10, work: 15, fam: -8 }, excuse: '我在國外，回不去' },

      const end = () => { done(); apply({ fam: 5, tian: 3 }, '你更懂自己了，也更懂家人一點。'); };
      el.querySelector('#skip').onclick = end;
      el.querySelector('#calc').onclick = () => {
        const v = el.querySelector('#bd').value.replace(/\D/g, '');
        if (!v) return toast('先選一個日期喔');
        let n = [...v].reduce((s, c) => s + +c, 0);

  function cooking() {
    const ING = [['🍄', '香菇'], ['🥦', '花椰菜'], ['🍅', '番茄'], ['🥕', '紅蘿蔔'], ['🧈', '豆腐'], ['🌽', '玉米'], ['🍆', '茄子'], ['🥑', '酪梨']];

      desc: '你做到了三不離：不離佛堂、不離前賢、不離經典。佛堂是你一輩子的充電站，母娘看著你笑了。下一回，記得把家人也一起帶回來，一起回鄉。' },
    gate: { em: '🙏', title: '南天門外', lyric: '徒跪在南天門外落下淚<br>祈求老師啊　帶我回家',
      desc: '差一點點。你想起很多次「下次再說」。老師沒有放棄你——這一次，換真的你來選。' },
    drift: { em: '🌊', title: '漂流到底', lyric: '本有遠大的理想<br>但世事無常',
      desc: '你漂了一輩子，還沒想起家在哪裡。沒關係，回家的路一直都在。' },
  };

  async function showEnding() {
    $('sheet').classList.remove('open');
    const key = judge();
    if (key === 'true') S.badges.add('老母娘');
    const E = ENDINGS[key];
    const c = loadCollect();
    c.plays++;
    for (const [list, v] of [[c.endings, key], [c.personas, S.persona.id], ...[...S.badges].map(b => [c.badges, b])]) if (!list.includes(v)) list.push(v);
    saveCollect(c);

    const el = $('ending');
    el.innerHTML = `
      <div class="end-card">
        <div class="em">${E.em}</div>
        <p class="kicker">${moodOf()} ${S.persona.em} ${S.persona.name}・享年 ${S.age} 歲・回佛堂 ${S.visits} 次</p>
        <h2>${E.title}</h2>
        <div class="lyric">${E.lyric}</div>
        <p class="desc">${E.desc}</p>
        <div class="sum">
          <div><b>${S.hp}</b><small>💪 健康</small></div>
          <div><b>${S.work}</b><small>💼 工作</small></div>
          <div><b id="eGold">${S.gold}</b><small>🪙 金幣</small></div>
          <div><b>${S.fam}</b><small>❤️ 家人</small></div>
          <div><b>${S.pal}</b><small>🤝 夥伴</small></div>
          <div><b>${S.tian}</b><small>✨ 天幣</small></div>
        </div>
        <p class="hint" id="eNote" style="color:var(--muted);font-size:.85rem"></p>
      </div>
      <div class="sec">
        <h3>🏅 心法徽章 ${S.badges.size} / 8</h3>
        <div class="badges">${BADGES.map(b => `<div class="${S.badges.has(b.id) ? 'got' : ''}" title="${b.how}">${b.id}</div>`).join('')}</div>
        <p class="hint" style="color:var(--muted);font-size:.8rem;margin:10px 0 0">結局收集 ${c.endings.length} / 5・劇本卡 ${c.personas.length} / 6・這台裝置共下凡 ${c.plays} 次</p>
      </div>
      <div class="sec">
        <h3>🍃 這一次，換真的你來選</h3>
        <p style="color:var(--ink-soft);line-height:1.8;margin:0">遊戲裡的六個章節，就是 <b>2027 全真社青班</b> 的六場專題。<br>每月給自己一天，我們一起把日子過成修行，把修行過成日子。</p>
        <div class="themes">${THEMES.map(t => `<div><b>${t.date}</b><span>${t.name}｜${t.sub}</span></div>`).join('')}</div>
        <div class="stack">
          <a class="btn green" href="${CAL}" target="_blank" rel="noopener">📅 訂閱全真社青 2027 行事曆</a>
          <a class="btn" href="../index.html">🌿 認識社青班</a>
          <button class="btn gold" type="button" id="shareBtn">🤝 揪一位夥伴一起回鄉</button>
        </div>
      </div>
      <div class="sec stack">
        <button class="btn ghost" type="button" id="againBtn">🔁 再下凡一次</button>
        <a class="btn ghost" href="fahui-angel-25d.html">🎮 也玩玩看：法會小天使</a>
      </div>`;
    el.hidden = false;
    el.scrollTop = 0;

    // 金幣帶不走：數字慢慢歸零
    let g = S.gold;
    const gEl = el.querySelector('#eGold');
    setTimeout(function drain() {
      if (g <= 0) { gEl.textContent = '0'; el.querySelector('#eNote').textContent = '金幣歸零，帶不走；天幣留下，化成仙衣的光。'; return; }
      g = Math.max(0, g - Math.ceil(S.gold / 20)); gEl.textContent = g; setTimeout(drain, 60);
    }, 1200);

    el.querySelector('#againBtn').onclick = start;
    el.querySelector('#shareBtn').onclick = async () => {
      const text = `我在《褪下仙衣：八十億分之一》抽到「${S.persona.name}」，活成了「${E.title}」。你呢？夥伴們快跟上！`;
      const url = SITE + 'game/xianyi.html';
      try {
        if (navigator.share) return await navigator.share({ title: '褪下仙衣：八十億分之一', text, url });
      } catch (e) { if (e.name === 'AbortError') return; }
      try { await navigator.clipboard.writeText(text + '\n' + url); toast('已複製，貼到 LINE 揪夥伴吧！'); }
      catch (e) { window.open('https://social-plugins.line.me/lineit/share?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text), '_blank', 'noopener'); }
    };
  }

  // ───────── 主流程 ─────────
  async function start() {
    S = newState();
    $('ending').hidden = true;
    $('title').hidden = true;
    feed.innerHTML = '';
    chapter('');
    $('game').hidden = false;
    hud();
    await prologue();
    await gacha();
    await childhood();
    await drawPersona();
    await line(null, '下凡治理卻迷航　都變了個樣', 'lyric');
    await ch1(); await ch2(); await ch3(); await ch4(); await ch5();
    await finale();
    await showEnding();
  }

  $('speedBtn').onclick = () => { fast = !fast; $('speedBtn').classList.toggle('on', fast); };
  $('startBtn').onclick = start;
  const c = loadCollect();
  if (c.plays) $('collect').textContent = `結局收集 ${c.endings.length} / 5・心法徽章 ${c.badges.length} / 8・劇本卡 ${c.personas.length} / 6`;
})();
</script>
</body>
</html>
