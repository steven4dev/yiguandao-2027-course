<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="法會小天使 2.5D 試玩版：教室與入口。">
<title>法會小天使 2.5D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700&display=swap">
<style>
  /* 2.5D 試玩版：等角模型屋（教室＋入口）。單一亮色主題，與風格樣張同一套粉彩色。 */
  :root {
    --bg: #F4EFE6;
    --ink: #4A3B2F;
    --muted: #8A7868;
    --card: #FFFDF8;
    --green: #5FAF84;
    --green-soft: #DDF0E4;
    --gold: #E4A23B;
    --gold-soft: #FFF1D2;
    --line: #E6DCCB;
    --round: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--round);
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  .hud { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 14px 6px; }
  .hud h1 { margin: 0; font-size: 1.2rem; font-weight: 400; flex: 1; line-height: 1.25; }
  .hud h1 small { display: block; font-size: .75rem; color: var(--muted); }
  .chip {
    border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
    padding: 5px 12px; font: 1rem var(--round); white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  button.chip { cursor: pointer; }
  #wrap { flex: 1; position: relative; min-height: 0; overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .msg {
    margin: 0 12px calc(12px + env(safe-area-inset-bottom)); background: var(--card); border: 2px solid var(--line);
    border-radius: 16px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; min-height: 2.8em;
  }
  .msg p { margin: 0; flex: 1; font-size: .98rem; line-height: 1.5; }
  #hand { font-size: 1.4rem; width: 2.2rem; height: 2.2rem; flex: none; display: grid; place-items: center; border-radius: 12px; background: var(--gold-soft); border: 2px dashed var(--gold); }
  .overlay {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; z-index: 10;
    background: rgba(244,239,230,.82); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
  }
  .card {
    width: min(400px, 100%); box-sizing: border-box; background: var(--card); border-radius: 24px; padding: 22px 20px; text-align: center;
    border: 2px solid var(--line); box-shadow: 0 14px 40px rgba(120,90,60,.18);
  }
  .card h2 { font-weight: 400; font-size: 1.55rem; margin: 4px 0 8px; }
  .card p { line-height: 1.6; margin: 6px 0; }
  .card ul { text-align: left; padding-left: 1.3em; margin: 10px 0 14px; line-height: 1.75; }
  .tag { display: inline-block; background: var(--gold-soft); color: #B07419; border-radius: 999px; padding: 2px 12px; font-size: .85rem; }
  .big { font-size: 2.6rem; }
  .btn {
    display: block; width: 100%; box-sizing: border-box; margin-top: 10px; padding: 12px; border-radius: 16px; text-decoration: none;
    border: 2px solid var(--green); background: var(--green-soft); color: var(--ink); font: 1.05rem var(--round); cursor: pointer;
  }
  .btn.primary { background: var(--green); color: #fff; }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
  .note { color: var(--muted); font-size: .88rem; }
</style>
</head>
<body>

<header class="hud">
  <h1>法會小天使<small>2.5D 試玩版・教室＋入口</small></h1>
  <span class="chip" id="hearts">❤️ 0／4</span>
  <button class="chip" id="zoomBtn" aria-label="切換全景或近拍">🗺️</button>
</header>
<div id="wrap"><canvas id="cv" aria-label="等角視角的入口與教室"></canvas></div>
<div class="msg">
  <div id="hand" title="手上的東西">✋</div>
  <p id="say" aria-live="polite">按「開始」走進會場。</p>
</div>

<div class="overlay" id="intro">
  <div class="card">
    <span class="tag">2.5D 試玩版</span>
    <h2>走進法會的模型屋</h2>
    <p>新朋友頭上冒出需求泡泡，一起照顧好他們，收集 4 顆愛心 ❤️</p>
    <ul>
      <li>點地板走路，點人或櫃子互動</li>
      <li>電腦：方向鍵／WASD 走路，空白鍵互動</li>
      <li>不知道下一步？點「公關學長」問問看</li>
    </ul>
    <button class="btn primary" id="startBtn">開始</button>
    <a class="btn ghost" href="https://steven4dev.github.io/yiguandao-2027-course/game/fahui-angel.html">玩原版完整遊戲</a>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="card">
    <div class="big">😇</div>
    <h2>四顆愛心都收到了！</h2>
    <p id="winText"></p>
    <p class="note">這是 2.5D 試玩版，只有教室和入口。<br>其他區域會一區一區搬進來，一起期待吧！</p>
    <button class="btn primary" id="againBtn">再玩一次</button>
    <a class="btn" href="https://steven4dev.github.io/yiguandao-2027-course/game/fahui-angel.html">玩原版完整遊戲</a>
  </div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), wrap = document.getElementById('wrap');
const EMO = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const FONT = '"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
const INK = 'rgba(84,62,46,.55)';
const WH = 2.4, HU = .52, M = .5;

// ── 等角投影：x 往右下、y 往左下、h 往上
let W = 0, H = 0, TW = 40, OX = 0, OY = 0, dpr = 1;
let zoom = 1, zoomTo = 1, NEAR = 1.9, ISL = { x0: 0, x1: 0, y0: 0, y1: 0 };
const iso = (gx, gy, h = 0) => [OX + (gx - gy) * TW / 2, OY + (gx + gy) * TW / 4 - h * HU * TW];
function resize() {
  const r = wrap.getBoundingClientRect(); W = r.width; H = r.height;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  // 以 TW=1、原點 0 先量出整座小島的外框，再縮放置中
  const pts = [[M, 10 - M, -1.1], [11 - M, M, -1.1], [.6, .6, 3.6], [1, 1, WH], [11 - M, 10 - M, -1.1]];
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const [a, b, h] of pts) { const x = (a - b) / 2, y = (a + b) / 4 - h * HU; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  TW = Math.min((W - 20) / (x1 - x0), (H - 24) / (y1 - y0));
  OX = W / 2 - (x0 + x1) / 2 * TW; OY = H / 2 - (y0 + y1) / 2 * TW;
  ISL = { x0: OX + x0 * TW, x1: OX + x1 * TW, y0: OY + y0 * TW, y1: OY + y1 * TW };
}

// ── 顏色與基本形
function mix(hex, f) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const t = f > 0 ? 255 : 40, a = Math.abs(f);
  return `rgb(${Math.round(r + (t - r) * a)},${Math.round(g + (t - g) * a)},${Math.round(b + (t - b) * a)})`;
}
function poly(pts, fill, stroke, lw = 1) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.stroke(); }
}
// 方塊：頂面最亮、左前面（朝 +y）中間、右前面（朝 +x）最暗
function box(x0, x1, y0, y1, h0, h1, col, o = {}) {
  const top = o.top || mix(col, .28), left = o.left || col, right = o.right || mix(col, -.16), line = o.line === undefined ? INK : o.line, lw = Math.max(1, TW * .018);
  poly([iso(x0, y1, h0), iso(x1, y1, h0), iso(x1, y1, h1), iso(x0, y1, h1)], left, line, lw);
  poly([iso(x1, y0, h0), iso(x1, y1, h0), iso(x1, y1, h1), iso(x1, y0, h1)], right, line, lw);
  poly([iso(x0, y0, h1), iso(x1, y0, h1), iso(x1, y1, h1), iso(x0, y1, h1)], top, line, lw);
}
function softShadow(x, y, rx, ry, a = .22) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, rx);
  g.addColorStop(0, `rgba(70,50,35,${a})`); g.addColorStop(1, 'rgba(70,50,35,0)');
  ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx); ctx.translate(-x, -y);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rx, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else { ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
}
function ell(x, y, rx, ry, fill, stroke, lw) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
// 在牆面上寫字：plane 'y' 是平行 x 軸的牆（右後牆），'x' 是平行 y 軸的牆（左後牆，字從前往後寫）
function onWall(plane, at, fn) {
  const k = 40; ctx.save();
  if (plane === 'y') { const o = iso(0, at, 0); ctx.transform(TW / 2 / k, TW / 4 / k, 0, HU * TW / k, o[0], o[1]); }
  else { const o = iso(at, 10, 0); ctx.transform(TW / 2 / k, -TW / 4 / k, 0, HU * TW / k, o[0], o[1]); }
  fn(k); ctx.restore();
}
function wallText(text, u, h, size, color) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(text, u, -h);
}
function pill(text, x, y, size, bg, fg = '#fff') {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(text).width + size * 1.1, h = size * 1.55;
  ctx.fillStyle = 'rgba(84,62,46,.18)'; rr(x - w / 2, y - h / 2 + 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = bg; rr(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = fg; ctx.fillText(text, x, y + size * .05);
}

// ── 場景
const CHAIRS = [[2, 4], [5, 4], [8, 4], [2, 7], [5, 7], [8, 7]];
const CUSHION = ['#9FD3B5', '#F6B8C4', '#A9CBEA'];
function drawSky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#DCEFF5'); g.addColorStop(.6, '#F3EFE4'); g.addColorStop(1, '#F6E9DA');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (const [k, yy, s] of [[0, .14, 1], [.45, .3, .7], [.75, .1, .85]]) {
    const x = ((k + t * .006) % 1.3 - .15) * W, y = yy * H, r = Math.max(W, H) * .035 * s;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.arc(x + r * 1.1, y - r * .4, r * 1.25, 0, 7); ctx.arc(x + r * 2.3, y, r * .9, 0, 7); ctx.fill();
    ctx.fillRect(x, y, r * 2.3, r * .9);
  }
}
function drawIsland() {
  const [cx, cy] = iso(5.5, 5, -2.6);
  softShadow(cx, cy, TW * 5.2, TW * 1.6, .16);
  box(M, 11 - M, M, 10 - M, -1.1, -.18, '#C99B74', { top: '#C99B74', left: '#C99B74', right: '#B08360' });
  box(M, 11 - M, M, 10 - M, -.18, 0, '#9ACD8C', { top: '#A9D89A', left: '#8DC27F', right: '#7DB271' });
  // 土層裡的小石頭
  for (const [a, b, h] of [[3, 10 - M, -.6], [6.5, 10 - M, -.8], [11 - M, 3, -.5], [11 - M, 7, -.75]]) {
    const [x, y] = iso(a, b, h); ell(x, y, TW * .1, TW * .055, '#B08360');
  }
  // 草地上的小花
  const fl = [[10.2, 2.5, '#F6B8C4'], [10.25, 4.4, '#FFF1A8'], [10.15, 6.8, '#F6B8C4'], [10.3, 8.6, '#FFFFFF'], [2.4, 9.25, '#FFF1A8'], [4.3, 9.2, '#FFFFFF'], [7.6, 9.3, '#F6B8C4'], [9.4, 9.2, '#FFF1A8'], [4.6, .7, '#F6B8C4'], [6.4, .75, '#FFF1A8']];
  for (const [a, b, c] of fl) { const [x, y] = iso(a, b); for (let i = 0; i < 5; i++) ell(x + Math.cos(i * 1.26) * TW * .04, y + Math.sin(i * 1.26) * TW * .02, TW * .028, TW * .02, c); ell(x, y, TW * .02, TW * .015, '#F2C14E'); }
  // 門外的踏腳石
  for (const b of [.62, .86]) { const [x, y] = iso(5.5, b); ell(x, y, TW * .2, TW * .09, '#E8DCC8', INK, 1); }
}
function drawFloor() {
  // 大廳磁磚
  for (let x = 1; x < 10; x++) poly([iso(x, 1), iso(x + 1, 1), iso(x + 1, 2), iso(x, 2)], x % 2 ? '#F5EFE4' : '#ECE3D3', 'rgba(150,120,90,.25)');
  // 教室木地板
  poly([iso(1, 2), iso(10, 2), iso(10, 9), iso(1, 9)], '#EBCB9F');
  ctx.strokeStyle = 'rgba(160,110,60,.28)'; ctx.lineWidth = 1;
  for (let i = 0; i <= 21; i++) {
    const gy = 2 + i / 3; ctx.beginPath(); ctx.moveTo(...iso(1, gy)); ctx.lineTo(...iso(10, gy)); ctx.stroke();
    for (let gx = 1 + (i % 3) * .9; gx < 10; gx += 2.7) { if (gy >= 9) break; ctx.beginPath(); ctx.moveTo(...iso(gx, gy)); ctx.lineTo(...iso(gx, gy + 1 / 3)); ctx.stroke(); }
  }
  // 窗光
  for (const [a, b] of [[2, 3.8], [7.2, 9]]) {
    const g = ctx.createLinearGradient(...iso(a, 1), ...iso(a, 4));
    g.addColorStop(0, 'rgba(255,250,230,.6)'); g.addColorStop(1, 'rgba(255,250,230,0)');
    poly([iso(a, 1), iso(b, 1), iso(b + .9, 4), iso(a + .9, 4)], g);
  }
  // 迎賓地墊＋走道地毯
  box(5.1, 5.9, 1.12, 1.9, 0, .03, '#E98FA5', { top: '#F2A7B9' });
  box(3.15, 3.85, 2.3, 8.8, 0, .02, '#9FD3B5', { top: '#B5DEC6', line: 'rgba(84,62,46,.25)' });
  box(6.15, 6.85, 2.3, 8.8, 0, .02, '#9FD3B5', { top: '#B5DEC6', line: 'rgba(84,62,46,.25)' });
  // 牆角陰影
  aoStrip('x'); aoStrip('y');
}
function aoStrip(axis) {
  const g = axis === 'x' ? ctx.createLinearGradient(...iso(1, 5), ...iso(1.7, 5)) : ctx.createLinearGradient(...iso(5, 1), ...iso(5, 1.7));
  g.addColorStop(0, 'rgba(90,60,35,.2)'); g.addColorStop(1, 'rgba(90,60,35,0)');
  if (axis === 'x') poly([iso(1, 1), iso(1, 9), iso(1.7, 9), iso(1.7, 1)], g);
  else poly([iso(1, 1), iso(10, 1), iso(10, 1.7), iso(1, 1.7)], g);
}
function drawTree(gx, gy, s, t) {
  const [x, y] = iso(gx, gy); softShadow(x, y, TW * .6 * s, TW * .25 * s, .2);
  box(gx - .07 * s, gx + .07 * s, gy - .07 * s, gy + .07 * s, 0, 1.6 * s, '#A87A55');
  const sway = Math.sin(t * 1.2 + gx) * TW * .02;
  const [cx, cy] = iso(gx, gy, 2.5 * s);
  for (const [dx, dy, r, c] of [[-.32, .25, .42, '#7DB86F'], [.34, .22, .4, '#74AF67'], [0, -.2, .5, '#8CC77D'], [0, .3, .38, '#86C277']]) {
    ell(cx + dx * TW * s + sway, cy + dy * TW * s, r * TW * s, r * TW * s * .92, c, INK, Math.max(1, TW * .018));
  }
  ell(cx - .12 * TW * s + sway, cy - .3 * TW * s, .16 * TW * s, .1 * TW * s, 'rgba(255,255,255,.35)');
}
function drawWalls() {
  const wall = '#FFF7EA', side = '#F3E5CF', cap = '#E9D4B5';
  // 左後牆（字和白板在這面）
  box(.72, 1, .72, 9, 0, WH, wall, { left: side, right: wall, top: cap });
  // 右後牆分三段，中間是門
  const rw = { left: '#FBEFDC', right: side, top: cap };
  box(1, 5.1, .72, 1, 0, WH, wall, rw);
  box(5.9, 10, .72, 1, 0, WH, wall, rw);
  box(5.1, 5.9, .72, 1, 1.62, WH, wall, rw);
  // 門框
  for (const [a, b] of [[5.02, 5.12], [5.88, 5.98]]) box(a, b, .98, 1.05, 0, 1.66, '#C9935F');
  box(5.02, 5.98, .98, 1.05, 1.58, 1.68, '#C9935F');
  // 牆裙
  poly([iso(1, 9, 0), iso(1, 1, 0), iso(1, 1, .55), iso(1, 9, .55)], '#E7D2B2', INK, 1);
  for (const [a, b] of [[1, 5.02], [5.98, 10]]) poly([iso(a, 1, 0), iso(b, 1, 0), iso(b, 1, .55), iso(a, 1, .55)], '#EBD7B8', INK, 1);
  // 窗戶
  for (const [a, b] of [[2, 3.8], [7.2, 9]]) {
    const g = ctx.createLinearGradient(...iso(a, 1, 1.9), ...iso(a, 1, .85));
    g.addColorStop(0, '#BFE3F2'); g.addColorStop(1, '#E4F4EC');
    poly([iso(a, 1, .85), iso(b, 1, .85), iso(b, 1, 1.9), iso(a, 1, 1.9)], g, '#FFFFFF', Math.max(2, TW * .06));
    const m = (a + b) / 2;
    ctx.beginPath(); ctx.moveTo(...iso(m, 1, .85)); ctx.lineTo(...iso(m, 1, 1.9)); ctx.stroke();
    poly([iso(a + .3, 1, 1.0), iso(a + .55, 1, 1.0), iso(a + .95, 1, 1.75), iso(a + .7, 1, 1.75)], 'rgba(255,255,255,.55)');
    poly([iso(a - .05, 1, .78), iso(b + .05, 1, .78), iso(b + .05, 1, .85), iso(a - .05, 1, .85)], '#E9D4B5', INK, 1);
  }
  // 入口招牌
  onWall('y', 1, k => {
    ctx.fillStyle = '#5FAF84'; rr(4.65 * k, -2.28 * k, 1.7 * k, .5 * k, .25 * k); ctx.fill();
    ctx.strokeStyle = '#4A9670'; ctx.lineWidth = .04 * k; ctx.stroke();
    wallText('入口・歡迎', 5.5 * k, 2.03 * k, .3 * k, '#FFFFFF');
  });
  // 彩旗
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(84,62,46,.45)';
  const flags = ['#F6B8C4', '#FFE08A', '#9FD3B5', '#A9CBEA'];
  for (const [a, b] of [[1.15, 4.95], [6.05, 9.85]]) {
    const pt = u => { const gx = a + (b - a) * u; return iso(gx, 1, 2.15 - Math.sin(u * Math.PI) * .18); };
    ctx.beginPath(); for (let i = 0; i <= 20; i++) { const p = pt(i / 20); i ? ctx.lineTo(...p) : ctx.moveTo(...p); } ctx.stroke();
    for (let i = 1; i < 8; i++) {
      const p0 = pt((i - .3) / 8), p1 = pt((i + .3) / 8), [mx, my] = pt(i / 8);
      poly([p0, p1, [mx, my + HU * TW * .28]], flags[i % 4], 'rgba(84,62,46,.35)');
    }
  }
  // 左牆白板
  onWall('x', 1, k => {
