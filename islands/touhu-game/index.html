<style>
/* 版面以手機直式為主，電腦也能玩（空白鍵／滑鼠點三下） */
:root{
  --gb:40px;
  --ink:#2b1d14; --paper:#fff8ee; --cream:#f6ead8; --gold:#e3a72f; --red:#c23b2e; --green:#3f8a5a; --jade:#2f7f78;
  --muted:#8a7764; --line:rgba(43,29,20,.12); --shadow:0 10px 30px rgba(43,29,20,.2);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --serif:"Noto Serif TC","Songti TC",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe6f5;color:var(--ink);font:16px/1.55 var(--sans);overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button,a{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-decoration:none}
[hidden]{display:none!important}
.scr{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
.card{background:var(--paper);border-radius:22px;box-shadow:var(--shadow);padding:18px 18px;width:100%;max-width:420px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:10px 16px;border-radius:16px;font-weight:900;font-size:17px;background:var(--red);color:#fff;box-shadow:0 4px 0 #8f2a20}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f2a20}
.btn small{font-weight:500;font-size:12.5px;opacity:.9}
.btn.col{flex-direction:column;gap:0;line-height:1.3}
.btn.jade{background:var(--jade);box-shadow:0 4px 0 #1f5752}
.btn.jade:active{box-shadow:0 1px 0 #1f5752}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #dcc9b1;border:1.5px solid #ead9c2}
.btn.ghost:active{box-shadow:0 1px 0 #dcc9b1}
.btn.line{background:#06c755;box-shadow:0 4px 0 #04943f}
.btn[disabled]{opacity:.5;pointer-events:none}
.stack{display:flex;flex-direction:column;gap:10px;width:100%}
.iconbtn{position:fixed;z-index:20;top:max(12px,env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;background:rgba(255,248,238,.92);box-shadow:0 3px 10px rgba(0,0,0,.15);font-size:20px;display:flex;align-items:center;justify-content:center}
#btnSound{right:12px}
#btnHome{left:12px}
.ver{position:fixed;right:10px;bottom:max(4px,env(safe-area-inset-bottom));font-size:10px;color:rgba(43,29,20,.4);z-index:11;pointer-events:none}

/* —— 開場 —— */
#scrTitle{justify-content:flex-end;gap:12px;background:linear-gradient(to bottom,rgba(246,234,216,0) 0%,rgba(246,234,216,0) 28%,rgba(246,234,216,.93) 52%,#f6ead8 100%)}
.brand{text-align:center;margin-bottom:0}
.brand .eyebrow{font-size:13px;letter-spacing:.2em;color:var(--muted);font-weight:700}
.brand h1{margin:2px 0 0;font:900 44px/1.1 var(--serif);letter-spacing:.14em;text-indent:.14em}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14px;letter-spacing:.08em}
.how{margin:0 0 12px;padding:0;list-style:none;font-size:14.5px;display:grid;gap:6px}
.how li{display:flex;gap:10px;align-items:flex-start}
.how b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--jade);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.rec{margin:10px 0 0;text-align:center;font-size:12.5px;color:var(--muted)}
.note{margin:2px 0 0;text-align:center;font-size:12px;color:var(--muted)}

/* —— 遊戲 HUD —— */
#hud{position:fixed;z-index:6;left:0;right:0;top:max(12px,env(safe-area-inset-top));display:flex;justify-content:center;pointer-events:none}
.hudbox{display:flex;flex-direction:column;align-items:center;gap:6px}
.pill{background:rgba(255,248,238,.92);border-radius:99px;box-shadow:0 3px 10px rgba(0,0,0,.14);padding:5px 14px;font-weight:900;font-size:14px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.pill .rn{font-family:var(--serif);letter-spacing:.08em}
#hArrows{display:flex;gap:5px}
#hArrows i{width:11px;height:11px;border-radius:50%;background:#e2d3bd;border:2px solid #cdb996;display:block}
#hArrows i.cur{border-color:var(--red);background:#fff}
#hArrows i.in{background:var(--gold);border-color:#b8851a}
#hArrows i.ear{background:var(--red);border-color:#8f2a20}
#hArrows i.miss{background:#fff;border-color:#a89a86}
#hWind{font-size:13px;font-weight:700;color:#3a566b}
#hint{position:fixed;z-index:6;left:0;right:0;bottom:calc(max(14px,env(safe-area-inset-bottom)) + var(--gb) + 44px);text-align:center;pointer-events:none;padding:0 20px}
#hint span{display:inline-block;background:rgba(43,29,20,.78);color:#fff;border-radius:99px;padding:7px 16px;font-weight:700;font-size:15px;letter-spacing:.04em}
.gauge{position:fixed;z-index:6;background:rgba(255,248,238,.88);border-radius:99px;box-shadow:0 3px 10px rgba(0,0,0,.14);pointer-events:none}
.gauge .zone{position:absolute;background:rgba(63,138,90,.45);border-radius:99px;display:none}
.gauge .mk{position:absolute;background:var(--red);border-radius:99px}
.gauge .lk{position:absolute;background:var(--ink);border-radius:99px;display:none}
.gauge.dim{opacity:.5}
/* 慢動作時上下的電影黑邊 */
#bars i{position:fixed;left:0;right:0;height:0;background:#000;z-index:4;pointer-events:none;transition:height .35s ease}
#bars i:first-child{top:0}
#bars i:last-child{bottom:0}
body.slowmo #bars i{height:7vh}
#vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 52%,rgba(40,20,6,.30) 100%)}
#gH{left:50%;transform:translateX(-50%);width:min(78vw,360px);height:16px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + var(--gb))}
#gH .mk,#gH .lk{top:-4px;width:8px;height:24px;margin-left:-4px}
#gH .zone{top:0;height:100%}
#gE,#gP{top:50%;transform:translateY(-50%);width:16px;height:min(36vh,260px)}
#gE{right:14px}
#gP{left:14px}
#gE .mk,#gE .lk,#gP .mk,#gP .lk{left:-4px;height:8px;width:24px;margin-bottom:-4px}
#gE .zone,#gP .zone{left:0;width:100%}
.gt{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;color:#fff;background:rgba(43,29,20,.72);padding:0 9px;border-radius:99px;line-height:20px;white-space:nowrap}
.gl{position:absolute;font-size:11px;font-weight:700;color:#fff;background:rgba(43,29,20,.62);padding:0 7px;border-radius:99px;line-height:18px;white-space:nowrap}
#gH .gl{top:22px;transform:translateX(-50%)}
#gE .gl{right:26px;transform:translateY(50%)}
#gP .gl{left:26px;transform:translateY(50%)}
#calib{position:fixed;z-index:7;left:50%;top:calc(max(12px,env(safe-area-inset-top)) + 78px);transform:translateX(-50%);background:rgba(255,248,238,.94);border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.18);padding:9px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;max-width:92vw}
#calib .ring{flex:none;width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--jade) calc(var(--p,0)*1%), #e6d8c2 0)}
#calib .ring::after{content:"";display:block;width:20px;height:20px;border-radius:50%;background:#fff8ee;margin:5px}
#calib.ok .ring{background:var(--green)}
body.motion{--gb:82px}
#calTxt{white-space:nowrap}
#calib button{flex:none;font-size:13px;color:var(--jade);font-weight:900;padding:4px 6px}
#btnThrow{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(60vw,240px);min-height:50px;border-radius:16px;background:var(--red);color:#fff;font-weight:900;font-size:17px;box-shadow:0 4px 0 #8f2a20}
#btnThrow:active{transform:translateX(-50%) translateY(3px);box-shadow:0 1px 0 #8f2a20}
#cap{position:fixed;z-index:8;left:0;right:0;top:24%;text-align:center;pointer-events:none;opacity:0;padding:0 16px}
#cap b{display:inline-block;max-width:100%;text-wrap:balance;font:900 27px/1.35 var(--serif);letter-spacing:.08em;color:#fff;text-shadow:0 2px 0 rgba(43,29,20,.55),0 0 18px rgba(43,29,20,.5);padding:0 12px}
#cap small{display:block;font-weight:900;font-size:15px;letter-spacing:.2em;color:#ffe9b0;text-shadow:0 1px 6px rgba(43,29,20,.7);margin-bottom:2px}
#cap.show{animation:cap 2.1s ease both}
@keyframes cap{0%{opacity:0;transform:translateX(60px) scale(.96)}14%{opacity:1;transform:translateX(0) scale(1)}78%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(-60px)}}
#toast{position:fixed;z-index:40;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 200px);transform:translateX(-50%);background:rgba(43,29,20,.88);color:#fff;border-radius:99px;padding:8px 16px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}

/* —— 輪次說明、結算 —— */
#scrRound,#scrFinal{justify-content:flex-end;background:linear-gradient(to bottom,rgba(43,29,20,0) 38%,rgba(43,29,20,.42))}
.stepTag{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.14em;color:#fff;background:var(--jade);padding:3px 11px;border-radius:99px}
.card h2{margin:8px 0 2px;font:900 28px/1.2 var(--serif);letter-spacing:.1em}
.card .sub{margin:0 0 8px;color:var(--muted);font-size:14px}
.tip{background:#fff1de;border-radius:14px;padding:10px 12px;margin:8px 0 14px;font-size:14.5px}
.big{font:900 64px/1 var(--serif);text-align:center;margin:6px 0 0}
.big small{font-size:18px;color:var(--muted);margin-left:4px}
.ttl{text-align:center;font:900 24px/1.3 var(--serif);letter-spacing:.14em;color:var(--red);margin:4px 0 2px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;text-align:center}
.stat div{background:#fff1de;border-radius:12px;padding:8px 4px}
.stat b{display:block;font-size:22px;font-weight:900}
.stat span{font-size:12px;color:var(--muted)}
.rounds{display:flex;gap:8px;justify-content:center;margin:6px 0 0;font-size:13px;color:var(--muted)}
.quote{text-align:center;color:var(--muted);font-size:13.5px;margin:6px 0 12px}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<a class="iconbtn" id="btnHome" href="../" aria-label="回群島">🏠</a>

<div id="hud" hidden><div class="hudbox">
  <div class="pill"><span class="rn" id="hRound">第 1 輪・晨光</span><span id="hArrows"></span><span id="hScore">0 分</span></div>

<!-- 開場 -->
<section class="scr" id="scrTitle">
  <div class="brand"><div class="eyebrow">全真群島・禮樂小遊戲</div><h1>投壺島</h1><p>矢直在心・以禮會友</p></div>
  <div class="card">
    <ul class="how">
      <li><b>1</b><span>三輪、每輪四支矢：<b style="display:inline;background:none;color:inherit;width:auto;height:auto">晨光 → 風起 → 浮筏</b>，一輪比一輪遠、一輪比一輪難。</span></li>

<!-- 每輪開始 -->

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (s) => document.querySelector(s);
const VER = 'v261123.03';
$('#ver').textContent = VER;

/* =========================================================
   投壺島：小遊戲本體
   - 兩種操作，同一套物理：
     點三下：依序鎖定仰角（上下）、力道、左右（左右放最後，風的偏移才算得準）
     體感：手機背面對準壺，左右轉＝左右、上下抬＝仰角，靜止校準後按住「蓄力」、放開（或往前一送）放箭
     投出去是拋物線慢動作：飛行放慢、快到壺口更慢，身後留一串白點畫出弧線
   - 彈幕與稱號是示範文案（TH_DEMO），換成審定過的文字後把它改成 false
   ========================================================= */
const TH_DEMO = true;
const SHARE_URL = 'https://steven4dev.github.io/yiguandao-2027-course/islands/touhu-game/?openExternalBrowser=1';

/* ——— 手感與尺寸：想調難易度改這裡 ——— */
const TU = {
  g: 9.81, handY: 1.05, arrowL: 0.55,
  thMin: 36, thMax: 70,  // 仰角範圍（度）：低平快 ～ 高拋
  vMin: 3.9, vMax: 7.1,  // 出手速度範圍（m/s）＝力道 0%～100%
  mouthY: 0.55,          // 壺口離壺底的高度
  inR: 0.138,            // 穿過壺口平面時，離壺心不超過這個才算入壺
  rimR: 0.19,            // 超過 inR、不超過這個＝擦到壺口彈開
  earX: 0.27, earR: 0.062, // 壺耳中心離壺心的距離、壺耳口半徑
  lat: 0.6,              // 瞄準線在壺的位置，左右最遠偏離幾公尺
  tol: 0.13,             // 第一輪的綠色提示區：落點離壺心多少公尺內
  yawRange: 18, pitchRange: 14, // 體感：左右轉幾度＝瞄準線到頭、上下抬幾度＝仰角到頭
  chargeT: 1.6,                 // 體感：按住蓄力時，力道條來回一趟的秒數
  slow: 0.38, slowNear: 0.2,    // 慢動作：飛行中的時間倍率、快到壺口時的倍率
  steadyDeg: 2.4, steadyMs: 900,  // 體感：多穩、穩多久才算「心定」
  flick: 11, aimLag: 160,         // 體感：往前一送的加速度門檻（m/s²）、取放箭前幾毫秒的瞄準
  arrows: 4,
};
const ROUNDS = [

/* ——— 發射：仰角 e、力道 p、左右 a（都是 0～1，左右是 -1～1）算出初速 ——— */
const HAND_X = 0.16;   // 右手拿矢，不擋住壺
const handPos = () => new THREE.Vector3(HAND_X, TU.handY, R().D);
const thetaOf = (e) => (TU.thMin + (TU.thMax - TU.thMin) * e) * Math.PI / 180;
const speedOf = (p) => TU.vMin + (TU.vMax - TU.vMin) * p;
const mouthW = () => (R().sway ? 0.14 : 0.12) + TU.mouthY;                 // 壺口平面離地高度（壺放在底座上）
const psiOf = (a) => Math.atan2(a * TU.lat - HAND_X, R().D);              // 左右＝瞄準線在壺的位置偏幾公尺
function landing(th, v) {   // 矢飛回壺口平面時：水平飛了多遠 X、花了多久 t（不含風）
  const dy = TU.handY - mouthW(), vy = v * Math.sin(th), t = (vy + Math.sqrt(vy * vy + 2 * TU.g * dy)) / TU.g;

  return (v - TU.vMin) / (TU.vMax - TU.vMin);
}
const windDrift = (t) => R().windAssist ? 0.5 * S.wind * t * t : 0;   // 第二輪：把風造成的偏移畫進瞄準線與落點圈

/* ——— 結果判定 ——— */

  else {

/* =========================================================

   點三下版：依序鎖定 仰角 → 力道 → 左右（左右放最後，風的偏移才算得準），最後一下放箭
   體感版：轉手機＝左右、上下抬＝仰角（隨時調整）；按住「蓄力」讓力道來回，落點圈對準壺就放開

addEventListener('keydown', (e) => {

/* —— 體感：按住蓄力、放開（或往前一送）放箭 —— */

}

/* —— 每幀更新瞄準物件 —— */
function updateAim(now) {
  const ph = S.phase; if (ph !== 'aimE' && ph !== 'aimP' && ph !== 'aimH' && ph !== 'aim') return;
  const T = R().T, motion = S.mode === 'motion';
  if (!motion) {
    if (ph === 'aimE') S.aE = tri((now - S.t0) / 1000 / T + S.ph);
    if (ph === 'aimP') S.aP = tri((now - S.t0) / 1000 / (T * 1.4) + S.ph2);   // 力道條掃得比較慢，剛好區比較好點
    if (ph === 'aimH') S.aH = tri((now - S.t0) / 1000 / T + S.ph3) * 2 - 1;
  } else { S.aH += (SENS.a - S.aH) * 0.5; S.aE += (SENS.e - S.aE) * 0.5; if (S.charging) S.aP = tri((performance.now() - S.cT0) / 1000 / TU.chargeT); }
  const aH = ph === 'aimE' || ph === 'aimP' ? 0 : S.aH, aE = ph === 'aimP' || ph === 'aimH' ? S.lockE : S.aE;
  const pKnown = ph === 'aimP' || ph === 'aimH' || (motion && S.charging), aP = ph === 'aimH' ? S.lockP : S.aP;
  const D = R().D, hand = handPos(), pc = potState(now), py = pc.y + TU.mouthY, th = thetaOf(aE), psi = psiOf(aH), xT = aH * TU.lat;
  const pUse = pKnown ? aP : clamp(pFor(th, D / Math.cos(psi)), 0, 1);   // 還沒定力道：先用「剛好到壺」的力道估
  const v = speedOf(pUse), L = landing(th, v), dr = windDrift(L.t);
  const rx = hand.x + L.X * Math.sin(psi) + dr, rz = hand.z - L.X * Math.cos(psi);
  const green = 0x7dff9c, yellow = 0xffd45a;
  // 瞄準線：壺的位置（z=0 平面）
  const showLine = ph === 'aimH' || motion, lineX = xT + dr;
  aimLine.visible = showLine; aimLine.position.set(lineX, 0.62, 0); aimLine.material.opacity = 0.85;
  const okH = S.round === 0 && Math.abs(lineX - pc.x) <= TU.tol;   // 綠色提示只有第一輪
  aimLine.material.color.set(okH ? green : yellow); aimGlow.material.color.set(okH ? green : yellow);
  // 力道階段：橫條＝這個力道落在哪個遠近；左右定了之後：落點圈
  const rz0 = hand.z - L.X * Math.cos(psiOf(0));
  depthBar.visible = !motion && ph === 'aimP'; depthBar.position.set(pc.x, py + 0.004, rz0);
  depthBar.material.color.set(S.round === 0 && Math.abs(rz0) <= TU.tol ? green : yellow);
  ring.visible = pKnown && (ph === 'aimH' || motion); ring.position.set(rx, py + 0.004, rz);
  ring.material.color.set(S.round === 0 && Math.hypot(rx - pc.x, rz) <= TU.tol ? green : yellow);
  // 預測拋物線（虛線）：從手到落點，風影響已算進去（只有第二輪）
  dash.visible = ph === 'aimH' || motion;
  if (dash.visible) {
    const pos = dash.geometry.attributes.position, c = Math.cos(th), sn = Math.sin(th), sw = R().windAssist ? S.wind : 0;
    for (let i = 0; i <= DASH_N; i++) { const t = L.t * i / DASH_N; pos.setXYZ(i, hand.x + v * c * Math.sin(psi) * t + 0.5 * sw * t * t, hand.y + v * sn * t - 0.5 * TU.g * t * t, hand.z - v * c * Math.cos(psi) * t); }
    pos.needsUpdate = true; dash.computeLineDistances();
  }
  // 手上的矢：矢尖朝著瞄準方向
  const a = S.cur; if (a && a.state === 'hand') { _d.set(Math.sin(psi) * Math.cos(th), Math.sin(th), -Math.cos(psi) * Math.cos(th)); a.dir = a.dir || new THREE.Vector3(); a.dir.copy(_d); poseArrow(a.mesh, hand, _d); }
  // 量表標記
  if (ph === 'aimE' || motion) gMark(gE, aE);
  if (ph === 'aimP' || (motion && S.charging)) gMark(gP, aP);
  if (ph === 'aimH' || motion) gMark(gH, aH);
}

/* =========================================================
   體感：背面對準壺，左右轉＝左右，上下抬＝仰角，按住蓄力、放開放箭
   ========================================================= */
const SENS = { on: false, listening: false, got: false, a: 0, e: 0.5, buf: [], base: null, anchor: null, since: 0, calibOK: false, lastThrow: 0, last: null };
const wrap = (d) => ((d + 540) % 360) - 180;
function onOrient(e) {
  if (e.beta == null || e.gamma == null) return;
  SENS.got = true;
  const d = Math.PI / 180, al = (e.alpha || 0) * d, be = e.beta * d, ga = e.gamma * d;
  // 手機「背面」朝向在世界座標的方向（避開上下抬到 90° 時 alpha／gamma 搶同一個軸的問題）
  const wx = Math.sin(ga) * Math.cos(al) + Math.cos(ga) * Math.sin(be) * Math.sin(al);
  const wy = Math.sin(ga) * Math.sin(al) - Math.cos(ga) * Math.sin(be) * Math.cos(al);
  const wz = Math.cos(ga) * Math.cos(be);
  const yaw = Math.atan2(-wx, -wy) / d, pitch = Math.asin(clamp(-wz, -1, 1)) / d;
  const t = performance.now(), s = { t, yaw, pitch }; SENS.last = s; SENS.buf.push(s); while (SENS.buf.length > 50) SENS.buf.shift();
  if (!SENS.on) return;
  // 心定：連續穩住一段時間，就把此刻當作「對準壺」
  if (!SENS.calibOK && S.phase === 'aim') {
    const an = SENS.anchor;
    if (!an || Math.abs(wrap(yaw - an.yaw)) > TU.steadyDeg || Math.abs(pitch - an.pitch) > TU.steadyDeg) { SENS.anchor = s; SENS.since = t; }
    else if (t - SENS.since >= TU.steadyMs) { SENS.base = { yaw: an.yaw, pitch: an.pitch }; SENS.calibOK = true; SFX.ready(); toast('心定了，瞄準吧'); if (S.phase === 'aim') setHint(CHARGE_HINT); }
    if (S.phase === 'aim') updateCalibUI();
  }
  if (SENS.calibOK) { SENS.a = clamp(wrap(yaw - SENS.base.yaw) / TU.yawRange, -1, 1); SENS.e = clamp(0.5 + (pitch - SENS.base.pitch) / (2 * TU.pitchRange), 0, 1); }
}
function onMotion(e) {
  if (!SENS.on || S.phase !== 'aim' || !S.charging) return;   // 要先按住蓄力，往前一送才算放箭
  const ac = e.acceleration; let m = 0;
  if (ac && ac.x != null) m = Math.hypot(ac.x, ac.y, ac.z);
  else { const g = e.accelerationIncludingGravity; if (g && g.x != null) m = Math.abs(Math.hypot(g.x, g.y, g.z) - 9.81); }
  const t = performance.now();
  if (m > TU.flick && t - S.cT0 > 350) releaseCharge();
}
function aimAt(t) {   // 放箭「之前」那一刻的瞄準（往前一送本身會晃到手機）
  let best = null; for (const s of SENS.buf) if (!best || Math.abs(s.t - t) < Math.abs(best.t - t)) best = s;
  if (!best || !SENS.base) return { a: SENS.a, e: SENS.e };
  return { a: clamp(wrap(best.yaw - SENS.base.yaw) / TU.yawRange, -1, 1), e: clamp(0.5 + (best.pitch - SENS.base.pitch) / (2 * TU.pitchRange), 0, 1) };
}
$('#btnCal').addEventListener('click', (e) => { e.stopPropagation(); SENS.calibOK = false; SENS.anchor = null; updateCalibUI(); setHint(''); });
function updateCalibUI() {
  const el = $('#calib'); el.classList.toggle('ok', SENS.calibOK);
  const p = SENS.calibOK ? 100 : clamp((performance.now() - SENS.since) / TU.steadyMs * 100, 0, 100); $('#calRing').style.setProperty('--p', SENS.anchor ? p : 0);
  $('#calTxt').textContent = SENS.calibOK ? '心定了・左右轉＝左右，上下抬＝仰角' : '舉起手機，背面對準壺，靜止一下';
}
async function sensEnable() {
  try { if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') { if ((await DeviceMotionEvent.requestPermission()) !== 'granted') return 'denied'; } } catch (e) { return 'denied'; }
  try { if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') { if ((await DeviceOrientationEvent.requestPermission()) !== 'granted') return 'denied'; } } catch (e) {}
  if (!SENS.listening) { SENS.listening = true; addEventListener('deviceorientation', onOrient); addEventListener('devicemotion', onMotion); }
  SENS.got = false; for (let i = 0; i < 15 && !SENS.got; i++) await new Promise((r) => setTimeout(r, 100));
  return SENS.got ? 'ok' : 'none';
}

/* =========================================================
   說明字卡、輪次、結算
   ========================================================= */
let capT = 0;
function showCap(small, text) {
  const c = $('#cap'); $('#capTxt').innerHTML = `<small>${small}</small>${text}`; c.classList.remove('show'); void c.offsetWidth; c.classList.add('show');
}
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(capT); capT = setTimeout(() => el.classList.remove('show'), 1800); }

function showRoundIntro() {
  const r = R(); S.phase = 'intro'; S.camMode = 'title';
  $('#rTag').textContent = `第 ${S.round + 1} 輪・共 ${ROUNDS.length} 輪`; $('#rName').textContent = r.name; $('#rSub').textContent = r.sub;
  $('#rTip').innerHTML = r.tip + (S.mode === 'motion' && S.round === 0 ? '<br>📱 體感：手機背面對準壺、靜止一下就「心定」，轉動瞄準，<b>往前一送</b>放箭（也可以按「放箭」鈕）。' : '');
  $('#scrRound').hidden = false; $('#hud').hidden = false; hideAimUI(); setHint('');
}
function roundEnd() {
  S.phase = 'roundEnd'; SFX.chime(); S.camMode = 'title';
  const last = S.round >= ROUNDS.length - 1;
  if (last) return showFinal();
  showCap(`第 ${S.round + 1} 輪完成`, `本輪 ${S.rScore} 分`);
  setTimeout(() => { S.round++; setupRound(); showRoundIntro(); }, 2300);
}
function showFinal() {
  S.phase = 'final'; hideAimUI(); setHint('');
  SAVE.plays++; SAVE.best = Math.max(SAVE.best, S.score); save();
  const T = TITLES.find((x) => S.score >= x.min);
  $('#fScore').textContent = S.score; $('#fTitle').textContent = T.t; $('#fQuote').textContent = T.q;
  $('#fIn').textContent = S.ins; $('#fEar').textContent = S.ears; $('#fBest').textContent = SAVE.best;
  $('#fRounds').innerHTML = ROUNDS.map((r, i) => `<span>${r.name} ${(S.hist[i] || []).reduce((a, b) => a + b.pts, 0)} 分</span>`).join('<span>・</span>');
  const text = `我在全真群島的投壺島投了 ${S.score} 分，得到稱號「${T.t}」！矢直在心，你也來試試 👉 ${SHARE_URL}`;
  $('#btnShare').href = 'https://line.me/R/msg/text/?' + encodeURIComponent(text);
  $('#scrFinal').hidden = false; $('#hud').hidden = true;
}
function newGame() {
  S.score = 0; S.ins = 0; S.ears = 0; S.hist = []; S.round = Math.max(0, Math.min(ROUNDS.length - 1, S.startRound || 0));
  $('#scrFinal').hidden = true; $('#scrTitle').hidden = true; setupRound(); showRoundIntro();
}
$('#btnRoundGo').addEventListener('click', () => { audioInit(); $('#scrRound').hidden = true; S.camMode = 'aim'; startAim(); });
$('#btnAgain').addEventListener('click', () => { audioInit(); newGame(); });
$('#btnTap').addEventListener('click', () => { audioInit(); S.mode = 'tap'; document.body.classList.remove('motion'); SAVE.mode = 'tap'; save(); newGame(); });
const motionCapable = !!window.DeviceOrientationEvent && (navigator.maxTouchPoints > 0 || 'ontouchstart' in window);
if (!motionCapable) { $('#btnMotion').disabled = true; $('#motionNote').hidden = false; }
$('#btnMotion').addEventListener('click', async () => {
  audioInit(); const b = $('#btnMotion'); b.disabled = true;
  const r = await sensEnable(); b.disabled = false;
  if (r === 'ok') { S.mode = 'motion'; document.body.classList.add('motion'); SENS.on = true; SENS.calibOK = false; SENS.anchor = null; SAVE.mode = 'motion'; save(); newGame(); }
  else toast(r === 'denied' ? '沒有取得動作感測授權，改用「點三下玩」吧' : '這個瀏覽器讀不到感測器，改用「點三下玩」吧（LINE 內可改用手機瀏覽器開啟）');
});
function paintRec() { $('#rec').textContent = SAVE.plays ? `你玩過 ${SAVE.plays} 場・最高 ${SAVE.best} 分・累計入壺 ${SAVE.ins}、貫耳 ${SAVE.ears}（只記在這支手機）` : ''; }
paintRec();

/* =========================================================
   畫面：相機、尺寸、主迴圈
   ========================================================= */
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h;
  cam.fov = cam.aspect < 1 ? clamp(2 * Math.atan(Math.tan(19 * Math.PI / 180) / cam.aspect) * 180 / Math.PI, 40, 88) : 46; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
const camPos = new THREE.Vector3(0, 3, 8), camLook = new THREE.Vector3(0, 0.5, 0);
const tPos = new THREE.Vector3(), tLook = new THREE.Vector3();
function updateCam(now, dt) {
  const r = R(), D = r.D, pc = potState(now), k = 1 - Math.exp(-dt * 3.2);
  if (S.camMode === 'aim') { tPos.set(0, 1.78, D + 1.35); tLook.set(0, 0.28, 0.2); }
  else if (S.camMode === 'fly') {   // 飛行中：鏡頭留在投擲者身後，視線追著矢，慢慢往壺靠
    const A = S.cur, ap = A && A.pos ? A.pos : _t.set(0, 0.5, 0), f = clamp(1 - Math.abs(ap.z) / D, 0, 1);
    tPos.set(0, 1.78 - 0.45 * f, D + 1.35 - 0.9 * f); tLook.set(ap.x * 0.5 + pc.x * 0.5, 0.25 + ap.y * 0.38 + 0.15 * f, ap.z * 0.5);
  } else if (S.camMode === 'close') {   // 結果：拉近看壺
    tPos.set(pc.x * 0.6 - 0.4, 1.1, 2.55); tLook.set(pc.x - 0.4, 0.42, 0);
  } else { const a = Math.sin(now / 5200) * 0.5; tPos.set(Math.sin(a) * 3.1, 0.95, Math.cos(a) * 3.1 + 0.2); tLook.set(0, -1.25, 0); }
  camPos.lerp(tPos, k); camLook.lerp(tLook, k); cam.position.copy(camPos); cam.lookAt(camLook);
}
let last = performance.now();
function tick(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t; NOW = t;
  const pc = potState(t); potGroup.position.set(pc.x, pc.y, 0);
  if (R().sway) { raftG.rotation.z = Math.sin(t / 1000 * 1.5 + 0.3) * 0.03; raftG.rotation.x = Math.sin(t / 1000 * 1.9) * 0.02; } else { raftG.rotation.set(0, 0, 0); }
  updateSky(1 - Math.exp(-dt * 2.2)); fineTick(t, dt);
  // 風旗
  const w = S.phase === 'title' || S.phase === 'intro' ? (R().wind ? S.windSign * R().wind : 0) : S.wind, aw = Math.abs(w);
  flagG.rotation.y = w < 0 ? Math.PI : 0; flag.rotation.z = -(1 - clamp(aw * 3.2, 0, 1)) * 1.15;
  const fp = flagGeo.attributes.position, amp = 0.012 + aw * 0.1;
  for (let i = 0; i < fp.count; i++) { const x0 = flagBase[i * 3]; fp.setZ(i, Math.sin(x0 * 13 - t / 1000 * (4 + aw * 14)) * amp * (x0 / 0.5) * 1.6); fp.setY(i, flagBase[i * 3 + 1] - (x0 / 0.5) * Math.sin(t / 1000 * 3) * 0.01); }
  fp.needsUpdate = true;
  clouds.forEach((g, i) => { g.position.x += dt * (0.25 + i * 0.03); if (g.position.x > 60) g.position.x = -60; });
  // 特效
  for (const f of FX) if (f.life > 0) { f.life -= dt; f.v.y -= 2.4 * dt; f.m.position.addScaledVector(f.v, dt); f.m.material.opacity = clamp(f.life / f.max, 0, 1); if (f.life <= 0) f.m.visible = false; }
  for (const r of ripples) if (r.life > 0) { r.life -= dt; const u = 1 - r.life / 0.7; r.m.scale.setScalar(1 + u * 4); r.m.material.opacity = clamp(1 - u, 0, 1) * 0.9; if (r.life <= 0) r.m.visible = false; }
  if (S.mode === 'motion' && S.phase === 'aim' && !SENS.calibOK) updateCalibUI();
  updateAim(t);
  // 慢動作：飛行中放慢，快到壺口時更慢；入壺、落地後慢慢恢復
  let tsT = 1; const A0 = S.cur;
  if (S.phase === 'fly' && A0 && A0.pos) {
    if (A0.state === 'fly' && !A0.touch) { tsT = TU.slow; if (A0.vel.y < 0 && Math.hypot(A0.pos.x - pc.x, A0.pos.z, A0.pos.y - (pc.y + TU.mouthY)) < 0.9) tsT = TU.slowNear; }
    else tsT = A0.state === 'sink' ? 0.6 : 0.7;
  }
  S.ts += (tsT - S.ts) * Math.min(1, dt * 8);
  document.body.classList.toggle('slowmo', S.phase === 'fly' && S.ts < 0.85);
  trailTick(dt);
  for (const a of S.arrows) if (a.state === 'fly' || a.state === 'sink') updateArrow(a, dt * S.ts);
  updateCam(t, dt);
  renderer.render(scene, cam);
  requestAnimationFrame(tick);
}

// 網址 ?round=2、?round=3 可以直接從那一輪開始（預覽用）
try { const q = new URLSearchParams(location.search); const r = parseInt(q.get('round'), 10); if (r >= 1 && r <= ROUNDS.length) S.startRound = r - 1; S.debug = q.has('debug'); } catch (e) {}
setupRound(); skySet(0, true); S.phase = 'title';
if (location.search.includes('debug')) window.__TH = { S, TU, SENS, R, throwArrow, startAim, newGame, potState, info: renderer.info, guest, onOrient, onMotion, lockE, lockP, lockH, pFor, thetaOf, speedOf, landing, windDrift, psiOf, startCharge, releaseCharge };
requestAnimationFrame(tick);
</script>
