<style>
/* 版面以 iPhone 直式為主（402×720～874），電腦也能玩（滑鼠代替手指與體感） */
:root{
  --sat:env(safe-area-inset-top);
  --ink:#2b1d14; --paper:#fff8ee; --cream:#f6ead8; --orange:#e8802a; --orange2:#f4a64a; --green:#4f8a4b; --gold:#e3a72f;
  --muted:#8a7764; --line:rgba(43,29,20,.12); --shadow:0 10px 30px rgba(43,29,20,.18);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --serif:"Noto Serif TC","Songti TC",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f6ead8;color:var(--ink);font:16px/1.55 var(--sans);overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.scr{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
.scr[hidden]{display:none!important}
.card{background:var(--paper);border-radius:22px;box-shadow:var(--shadow);padding:20px 18px;width:100%;max-width:420px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:10px 16px;border-radius:16px;font-weight:900;font-size:17px;background:var(--orange);color:#fff;box-shadow:0 4px 0 #b85f17;transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b85f17}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #dcc9b1;border:1.5px solid #ead9c2}
.btn.ghost:active{box-shadow:0 1px 0 #dcc9b1}
.btn.green{background:var(--green);box-shadow:0 4px 0 #346131}
.btn.line{background:#06c755;box-shadow:0 4px 0 #04943f}
.btn.sm{min-height:44px;font-size:15px;border-radius:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.iconbtn{position:fixed;z-index:20;top:max(12px,env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;background:rgba(255,248,238,.92);box-shadow:0 3px 10px rgba(0,0,0,.15);font-size:20px;display:flex;align-items:center;justify-content:center}
#btnSound{right:12px}
#btnHome{left:12px}

/* —— 開場 —— */
#scrTitle{justify-content:flex-end;gap:12px;background:linear-gradient(to bottom,rgba(246,234,216,0) 0%,rgba(246,234,216,0) 34%,rgba(246,234,216,.94) 55%,#f6ead8 100%)}
.brand{text-align:center;margin-bottom:2px}
.brand .eyebrow{font-size:13px;letter-spacing:.2em;color:var(--muted);font-weight:700}
.brand h1{margin:2px 0 0;font:900 34px/1.15 var(--serif);letter-spacing:.06em}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14px}
.dishes{display:flex;flex-direction:column;gap:9px;width:100%;max-width:420px}
.dish{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:18px;padding:11px 14px;box-shadow:0 3px 0 #e6d3b9;border:1.5px solid #efe0cb;text-align:left;width:100%}
.dish .em{font-size:34px;width:46px;text-align:center}
.dish b{display:block;font-size:17px}
.dish small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
.dish .lv{margin-left:auto;font-size:12px;color:var(--gold);white-space:nowrap;text-align:right}
.dish.on{border-color:var(--orange);box-shadow:0 3px 0 #d47622}
.dish.lock{opacity:.55}
.dish.lock .lv{color:var(--muted)}
.ver{position:fixed;right:10px;bottom:max(4px,env(safe-area-inset-bottom));font-size:10px;color:rgba(43,29,20,.35);z-index:11}

/* —— 步驟說明卡、遊戲 HUD —— */
#scrIntro{justify-content:flex-end;background:linear-gradient(to bottom,rgba(43,29,20,0) 40%,rgba(43,29,20,.35))}
.stepTag{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.12em;color:#fff;background:var(--orange);padding:3px 10px;border-radius:99px}
#scrIntro h2{margin:8px 0 4px;font:900 26px/1.2 var(--serif)}
#scrIntro .how{display:flex;gap:12px;align-items:center;margin:10px 0 14px;background:#fff1de;border-radius:14px;padding:10px 12px}
#scrIntro .how .big{font-size:38px}
#scrIntro .how p{margin:0;font-size:15px}
#scrIntro .alt{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
#scrIntro .btns{display:flex;flex-direction:column;gap:9px}
#hud{position:fixed;left:0;right:0;top:0;z-index:9;padding:max(12px,env(safe-area-inset-top)) 64px 0;pointer-events:none;text-align:center}
#hud[hidden]{display:none}
#hud .t{font:900 19px/1.3 var(--serif);text-shadow:0 1px 0 #fff}
#hud .tip{font-size:13.5px;font-weight:700;color:#5d4532;text-shadow:0 1px 0 #fff;min-height:21px}
.bar{height:14px;border-radius:99px;background:rgba(255,255,255,.75);box-shadow:inset 0 1px 3px rgba(0,0,0,.15);overflow:hidden;margin:8px auto 0;max-width:300px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f4a64a,#e8802a);border-radius:99px;transition:width .12s}
#hud .timer{position:fixed;top:max(14px,env(safe-area-inset-top));right:62px;font:900 15px var(--sans);background:rgba(255,248,238,.92);padding:7px 11px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#hud .timer.low{color:#c2361d}
#ctl{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:0 16px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
#ctl>*{pointer-events:auto}
#ctl[hidden]{display:none}
.hold{width:100%;max-width:340px;min-height:66px;border-radius:20px;font-size:19px;font-weight:900;background:var(--orange);color:#fff;box-shadow:0 5px 0 #b85f17;touch-action:none}
.hold.on{transform:translateY(4px);box-shadow:0 1px 0 #b85f17;background:#d96a17}
/* 火候表：直立的溫度計，綠色區會慢慢上下移動 */
#gauge{position:fixed;z-index:9;right:18px;top:50%;transform:translateY(-50%);width:34px;height:min(46vh,330px);border-radius:99px;background:linear-gradient(to top,#7fb2e5,#f6d36a 55%,#e6562f);box-shadow:0 3px 10px rgba(0,0,0,.25),inset 0 0 0 3px #fff}
#gauge[hidden]{display:none}
#gauge .zone{position:absolute;left:-6px;right:-6px;border-radius:10px;border:3px solid #2e8b3a;background:rgba(80,190,90,.35);box-shadow:0 0 0 2px #fff}
#gauge .needle{position:absolute;left:-14px;right:-14px;height:6px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 2px #fff;margin-top:-3px}
#gauge .lab{position:absolute;right:44px;font-size:12px;font-weight:900;white-space:nowrap;color:#5d4532;text-shadow:0 1px 0 #fff}
#gauge.ok{box-shadow:0 0 0 4px rgba(80,190,90,.7),0 3px 10px rgba(0,0,0,.25),inset 0 0 0 3px #fff}
#therm{position:fixed;z-index:9;left:18px;top:50%;transform:translateY(-50%);font:900 15px var(--sans);background:rgba(255,248,238,.92);border-radius:16px;padding:10px 8px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.15);width:64px}
#therm[hidden]{display:none}
#therm .deg{font-size:22px;color:#c2361d}
#therm.cool .deg{color:#2e8b3a}
#ring{position:fixed;z-index:4;left:50%;top:53%;width:min(64vw,270px);height:min(64vw,270px);transform:translate(-50%,-50%);border-radius:50%;border:3px dashed rgba(255,255,255,.75);pointer-events:none}
#ring[hidden]{display:none}
#ring::after{content:"↻";position:absolute;right:-6px;top:6%;font-size:30px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.pop{position:fixed;z-index:30;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;text-align:center;pointer-events:none;transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .25s}
.pop.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.pop .w{font:900 40px/1.1 var(--serif);color:#fff;text-shadow:0 3px 0 #b85f17,0 6px 18px rgba(0,0,0,.35)}
.pop .s{font-size:30px;letter-spacing:4px;margin-top:6px}
.pop .m{font-size:15px;font-weight:900;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);margin-top:4px}

/* —— 擺盤 —— */
#scrPlate{justify-content:flex-end;pointer-events:none}
#scrPlate .card{pointer-events:auto;padding:14px 14px 16px}
#scrPlate h2{margin:0 0 6px;font:900 21px var(--serif);text-align:center}
.opt{margin:8px 0 0}
.opt h3{margin:0 0 5px;font-size:13px;color:var(--muted);letter-spacing:.1em}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.chip{border-radius:12px;background:#fff;border:2px solid #ead9c2;padding:7px 4px;font-size:13.5px;font-weight:700;line-height:1.25}
.chip .e{display:block;font-size:20px}
.chip.on{border-color:var(--orange);background:#fff1de}

/* —— 拍照 —— */
#scrShoot{pointer-events:none;justify-content:flex-end}
#scrShoot>*{pointer-events:auto}
#vf{position:fixed;z-index:8;pointer-events:none;border-radius:6px;box-shadow:0 0 0 2000px rgba(30,20,12,.88)}
#vf[hidden]{display:none}
#vf .g{position:absolute;inset:0;background:
  linear-gradient(to right,transparent calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% + .5px),transparent calc(66.66% + .5px)),
  linear-gradient(to bottom,transparent calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
#vf .g[hidden]{display:none}
#vf .corner{position:absolute;width:22px;height:22px;border:3px solid #fff}
#vf .c1{left:-3px;top:-3px;border-right:0;border-bottom:0}#vf .c2{right:-3px;top:-3px;border-left:0;border-bottom:0}
#vf .c3{left:-3px;bottom:-3px;border-right:0;border-top:0}#vf .c4{right:-3px;bottom:-3px;border-left:0;border-top:0}
#vf .mast{position:absolute;left:0;right:0;top:3%;text-align:center;color:rgba(255,255,255,.55);font:900 italic clamp(30px,13vw,60px)/1 "Playfair Display",serif;letter-spacing:.04em}
#vf .mast[hidden]{display:none}
.shootPanel{width:100%;max-width:440px;display:flex;flex-direction:column;gap:8px;color:#fff}
.shootPanel .tip{text-align:center;font-size:12.5px;color:#e9d9c5}
.seg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.seg button{flex:1;min-width:0;border-radius:11px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:700;padding:7px 2px;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink)}
.shutterRow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:2px}
.shutter{width:74px;height:74px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.35);position:relative}
.shutter::after{content:"";position:absolute;inset:7px;border-radius:50%;border:3px solid var(--ink)}
.shutter:active{transform:scale(.94)}
.sideBtn{font-size:13px;font-weight:700;color:#fff;background:rgba(255,255,255,.12);border-radius:12px;padding:9px 6px}
#flash{position:fixed;inset:0;background:#fff;z-index:40;opacity:0;pointer-events:none;transition:opacity .35s}
#flash.on{opacity:1;transition:none}

/* —— 封面 —— */
#scrCover{background:#2b1d14;overflow-y:auto;touch-action:pan-y;justify-content:flex-start;gap:12px}
#coverImg{width:auto;max-width:100%;max-height:calc(100vh - 290px);max-height:calc(100dvh - 290px);aspect-ratio:4/5;border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.5);display:block;margin-top:46px;background:#3a2a1e}
#coverBox{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:10px}
.nameRow{display:flex;gap:8px;width:100%;align-items:center;color:#f3e3cf;font-size:13px}
.nameRow input{flex:1;min-width:0;font:700 16px var(--sans);padding:10px 12px;border-radius:12px;border:0;background:#fff8ee;color:var(--ink);-webkit-user-select:text;user-select:text}
.coverBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%}
.coverBtns .full{grid-column:1/-1}
#scrCover .note{color:#cdb79c;font-size:12px;text-align:center;margin:0}

/* —— 雜誌架、分享預覽 —— */
#scrShelf{background:#f6ead8;overflow-y:auto;touch-action:pan-y;justify-content:flex-start}
#scrShelf h2{margin:44px 0 2px;font:900 24px var(--serif)}
#scrShelf .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:440px}
.shelf figure{margin:0;text-align:center;font-size:11.5px;color:var(--muted)}
.shelf img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:4px;box-shadow:0 5px 12px rgba(0,0,0,.2);display:block;background:#e9dccb}
.shelf .empty{grid-column:1/-1;text-align:center;padding:30px 0;color:var(--muted)}
#scrShare{background:rgba(20,13,8,.94);justify-content:center;gap:12px;overflow-y:auto;touch-action:pan-y}
#scrShare img{max-width:100%;max-height:68vh;border-radius:6px}
#scrShare p{color:#f3e3cf;text-align:center;margin:0;font-size:14px}
#scrBig{background:rgba(20,13,8,.94);justify-content:center;gap:12px}
#scrBig img{max-width:100%;max-height:78vh;border-radius:6px}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(43,29,20,.92);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){ .pop{transition:opacity .2s} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<button class="iconbtn" id="btnHome" type="button" aria-label="回到廚神養成島">🏝️</button>
<button class="iconbtn" id="btnSound" type="button" aria-label="音效開關">🔊</button>

<!-- 開場：選菜 -->
<section class="scr" id="scrTitle">
  <div class="brand">
    <div class="eyebrow">全真群島・廚神養成島</div>
    <h1>🍳 廚神養成島</h1>
    <p>動手做一道素食料理，再拍成雜誌封面</p>
  </div>
  <div class="dishes" id="dishList"></div>
  <div class="row" style="max-width:420px">
    <button class="btn ghost sm" id="btnShelf" type="button">📚 我的雜誌架</button>
    <button class="btn ghost sm" id="btnIsle" type="button">🏝️ 返回島嶼</button>
  </div>
  <p id="titleMsg" style="margin:0;font-size:12.5px;color:#c2361d;text-align:center;max-width:420px"></p>
</section>

<!-- 每一步開始前的說明卡 -->
<section class="scr" id="scrIntro" hidden>
  <div class="card">
    <span class="stepTag" id="inStep">STEP 1／4</span>
    <h2 id="inTitle"></h2>
    <div class="how"><div class="big" id="inIcon"></div><p id="inHow"></p></div>
    <p class="alt" id="inAlt"></p>
    <div class="btns" id="inBtns"></div>
  </div>
</section>

<div id="hud" hidden><div class="t" id="hudT"></div><div class="tip" id="hudTip"></div><div class="bar"><i id="hudBar"></i></div><div class="timer" id="hudTime">15</div></div>
<div id="gauge" hidden><div class="zone" id="gZone"></div><div class="needle" id="gNeedle"></div><div class="lab" style="top:-2px">大火</div><div class="lab" style="bottom:-2px">小火</div></div>
<div id="therm" hidden>🌡️<div class="deg" id="thDeg">92°</div><small>目標 60°</small></div>
<div id="ring" hidden></div>
<div id="ctl" hidden></div>
<div class="pop" id="pop"><div class="w" id="popW"></div><div class="s" id="popS"></div><div class="m" id="popM"></div></div>

<!-- 擺盤 -->
<section class="scr" id="scrPlate" hidden>
  <div class="card">
    <h2>🍽️ 擺盤時間</h2>
    <div class="opt"><h3>碗</h3><div class="chips" data-k="bowl"></div></div>
    <div class="opt"><h3>點綴</h3><div class="chips" data-k="top"></div></div>
    <div class="opt"><h3>桌面</h3><div class="chips" data-k="table"></div></div>
    <div style="margin-top:12px"><button class="btn" id="btnToShoot" type="button">📸 擺好了，去拍照</button></div>
  </div>
</section>

<!-- 拍照：觀景窗 4:5 -->
<div id="vf" hidden><div class="g" id="vfGrid"></div><div class="mast" id="vfMast">VEGGIE</div><i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i></div>
<section class="scr" id="scrShoot" hidden>
  <div class="shootPanel">
    <div class="tip" id="shootTip">拖曳轉角度・兩指縮放・點鏡位快速切換</div>
    <div class="seg" id="segAngle"><button data-a="top" type="button">⬇️ 俯拍</button><button data-a="45" type="button">↘️ 45°</button><button data-a="close" type="button">🔍 特寫</button><button data-a="hand" type="button">📱 手持</button></div>
    <div class="seg" id="segFilter"></div>
    <div class="shutterRow">
      <button class="sideBtn" id="btnRePlate" type="button">↩︎ 改擺盤</button>
      <button class="shutter" id="btnShutter" type="button" aria-label="按快門"></button>
      <button class="sideBtn" id="btnGrid" type="button">＃ 格線</button>
    </div>
  </div>
</section>
<div id="flash"></div>

<!-- 封面 -->
<section class="scr" id="scrCover" hidden>
  <img id="coverImg" alt="《全真蔬食 VEGGIE》封面">
  <div id="coverBox">
    <label class="nameRow">封面主廚<input id="chefName" maxlength="10" placeholder="輸入你的名字或暱稱" autocomplete="nickname"></label>

  else if (sid === 'cool') finishStep(30 + (92 - temp) / 32 * 40, '時間到，湯也溫了');

// 測試用（唯讀）
window.__chef = () => ({ phase: G.phase, step: G.step, scores: G.scores.slice(), prog: +G.prog.toFixed(2), heat: +heat.toFixed(2), mash: +mash.toFixed(2), temp: Math.round(temp), cutN, motionOK });
window.__chefCut = () => doCut(1, 0);   // 測試用：直接切一刀
window.__chefDemo = (arr) => { G.scores = arr.slice(0, STEP_N); };   // 測試用：做宣傳圖時指定四步的分數

resize(); goTitle(); requestAnimationFrame(frame);
</script>
</body>
