#scrTitle{justify-content:flex-end;gap:12px;background:linear-gradient(to bottom,rgba(246,234,216,0) 0%,rgba(246,234,216,0) 34%,rgba(246,234,216,.94) 55%,#f6ead8 100%)}

/* —— 步驟說明卡、遊戲 HUD —— */

#hud{position:fixed;left:0;right:0;top:0;z-index:9;padding:max(12px,env(safe-area-inset-top)) 64px 0;pointer-events:none;text-align:center}

.bar{height:14px;border-radius:99px;background:rgba(255,255,255,.75);box-shadow:inset 0 1px 3px rgba(0,0,0,.15);overflow:hidden;margin:8px auto 0;max-width:300px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f4a64a,#e8802a);border-radius:99px;transition:width .12s}
#hud .timer{position:fixed;top:max(14px,env(safe-area-inset-top));right:62px;font:900 15px var(--sans);background:rgba(255,248,238,.92);padding:7px 11px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.12)}

#ctl{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:0 16px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}

.hold{width:100%;max-width:340px;min-height:66px;border-radius:20px;font-size:19px;font-weight:900;background:var(--orange);color:#fff;box-shadow:0 5px 0 #b85f17;touch-action:none}
.hold.on{transform:translateY(4px);box-shadow:0 1px 0 #b85f17;background:#d96a17}
/* 火候表：直立的溫度計，綠色區會慢慢上下移動 */
#gauge{position:fixed;z-index:9;right:18px;top:50%;transform:translateY(-50%);width:34px;height:min(46vh,330px);border-radius:99px;background:linear-gradient(to top,#7fb2e5,#f6d36a 55%,#e6562f);box-shadow:0 3px 10px rgba(0,0,0,.25),inset 0 0 0 3px #fff}
#gauge[hidden]{display:none}
#gauge .zone{position:absolute;left:-6px;right:-6px;border-radius:10px;border:3px solid #2e8b3a;background:rgba(80,190,90,.35);box-shadow:0 0 0 2px #fff}
#gauge .needle{position:absolute;left:-14px;right:-14px;height:6px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 2px #fff;margin-top:-3px}
#gauge .lab{position:absolute;right:44px;font-size:12px;font-weight:900;white-space:nowrap;color:#5d4532;text-shadow:0 1px 0 #fff}
#gauge.ok{box-shadow:0 0 0 4px rgba(80,190,90,.7),0 3px 10px rgba(0,0,0,.25),inset 0 0 0 3px #fff}

#therm[hidden]{display:none}
#therm .deg{font-size:22px;color:#c2361d}
#therm.cool .deg{color:#2e8b3a}
#ring{position:fixed;z-index:4;left:50%;top:53%;width:min(64vw,270px);height:min(64vw,270px);transform:translate(-50%,-50%);border-radius:50%;border:3px dashed rgba(255,255,255,.75);pointer-events:none}
#ring[hidden]{display:none}
#ring::after{content:"↻";position:absolute;right:-6px;top:6%;font-size:30px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.pop{position:fixed;z-index:30;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;text-align:center;pointer-events:none;transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .25s}
.pop.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.pop .w{font:900 40px/1.1 var(--serif);color:#fff;text-shadow:0 3px 0 #b85f17,0 6px 18px rgba(0,0,0,.35)}
.pop .s{font-size:30px;letter-spacing:4px;margin-top:6px}
.pop .m{font-size:15px;font-weight:900;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);margin-top:4px}

/* —— 擺盤 —— */

.opt{margin:8px 0 0}

.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.chip{border-radius:12px;background:#fff;border:2px solid #ead9c2;padding:7px 4px;font-size:13.5px;font-weight:700;line-height:1.25}
.chip .e{display:block;font-size:20px}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#f3e6d3;border-radius:12px;padding:4px}
.tabs button{border-radius:9px;padding:6px 0;font-size:14px;font-weight:900;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.opt h3 .hint{font-weight:500;letter-spacing:0;font-size:12px}
.way[hidden]{display:none}
.chip{position:relative}

.opt h3{display:flex;align-items:center;gap:6px}
.opt .rec{font-weight:500;font-size:11.5px;letter-spacing:0;color:var(--gold)}
.way{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--ink);background:#fff;border:1.5px solid #ead9c2;border-radius:99px;padding:3px 10px;letter-spacing:0}

/* —— 拍照 —— */
#scrShoot{pointer-events:none;justify-content:flex-end}

#vf{position:fixed;z-index:8;pointer-events:none;border-radius:6px;box-shadow:0 0 0 2000px rgba(30,20,12,.88)}
#vf[hidden]{display:none}
#vf .g{position:absolute;inset:0;background:
  linear-gradient(to right,transparent calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% + .5px),transparent calc(66.66% + .5px)),
  linear-gradient(to bottom,transparent calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
#vf .g[hidden]{display:none}
#vf .corner{position:absolute;width:22px;height:22px;border:3px solid #fff}
#vf .c1{left:-3px;top:-3px;border-right:0;border-bottom:0}#vf .c2{right:-3px;top:-3px;border-left:0;border-bottom:0}
#vf .c3{left:-3px;bottom:-3px;border-right:0;border-top:0}#vf .c4{right:-3px;bottom:-3px;border-left:0;border-top:0}
#vf .mast{position:absolute;left:0;right:0;top:3%;text-align:center;color:rgba(255,255,255,.55);font:900 italic clamp(30px,13vw,60px)/1 "Playfair Display",serif;letter-spacing:.04em}

.shootPanel{width:100%;max-width:440px;display:flex;flex-direction:column;gap:8px;color:#fff}

.shutterRow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:2px}
.shutter{width:74px;height:74px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.35);position:relative}

#flash{position:fixed;inset:0;background:#fff;z-index:40;opacity:0;pointer-events:none;transition:opacity .35s}
#flash.on{opacity:1;transition:none}

/* —— 封面 —— */
#scrCover{background:#2b1d14;overflow-y:auto;touch-action:pan-y;justify-content:flex-start;gap:12px}
#coverImg{width:auto;max-width:100%;max-height:calc(100vh - 290px);max-height:calc(100dvh - 290px);aspect-ratio:4/5;border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.5);display:block;margin-top:46px;background:#3a2a1e}

#scrShelf{background:#f6ead8;overflow-y:auto;touch-action:pan-y;justify-content:flex-start}

.shelf .empty{grid-column:1/-1;text-align:center;padding:30px 0;color:var(--muted)}
#scrShare{background:rgba(20,13,8,.94);justify-content:center;gap:12px;overflow-y:auto;touch-action:pan-y}
#scrShare img{max-width:100%;max-height:68vh;border-radius:6px}

.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(43,29,20,.92);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}

@media (prefers-reduced-motion: reduce){ .pop{transition:opacity .2s} }

  c.textAlign = 'left'; c.font = `700 22px ${SANS}`; c.fillStyle = 'rgba(255,255,255,.75)'; c.fillText('全真群島・廚神養成島　2027 全真社青', 62, H - 40);
  G.cover = cv; const url = cv.toDataURL('image/jpeg', 0.9); $('#coverImg').src = url;
  G.coverBlob = null; cv.toBlob((b) => { G.coverBlob = b; }, 'image/jpeg', 0.92);
}
function fitFont(c, t, fam, w, maxW, start) { let s = start; for (; s > 20; s -= 4) { c.font = `${w} ${s}px ${fam}`; if (c.measureText(t).width <= maxW) break; } return s; }
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
// 雜誌架只存小縮圖（360×450），最多 12 本
function storeCover(replace) {
  const t = document.createElement('canvas'); t.width = 360; t.height = 450; t.getContext('2d').drawImage(G.cover, 0, 0, 360, 450);
  const item = { id: G.issue, dish: DISHES[0].id, score: total(), date: G.coverDate.toISOString().slice(0, 10), img: t.toDataURL('image/jpeg', 0.78) };
  if (replace && SAVE.covers[0] && SAVE.covers[0].id === item.id) SAVE.covers[0] = item; else SAVE.covers.unshift(item);
  SAVE.covers = SAVE.covers.slice(0, 12);
}
function shareText() { const sc = total(), rank = RANKS.find(([m]) => sc >= m)[1]; return `🍳 廚神養成島・全真蔬食 VEGGIE\n我做了一碗南瓜濃湯，拿到 ${sc} 分（${rank}）！\n登上雜誌封面了 📸\n你也來當封面主廚 👇\n${SHARE_URL}`; }
$('#btnShare').addEventListener('click', async () => {
  sfx.click(); const blob = G.coverBlob || await new Promise((r) => G.cover.toBlob(r, 'image/jpeg', 0.92)); let file = null;
  try { file = new File([blob], `veggie-cover-${G.issue}.jpg`, { type: 'image/jpeg' }); } catch (e) {}
  try { if (file && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: shareText() }); return; } } catch (err) { if (err && err.name === 'AbortError') return; }
  // 不能直接分享圖片：顯示大圖讓玩家長按儲存，電腦就直接下載
  $('#shareImg').src = $('#coverImg').src; $('#btnShareText').href = 'https://line.me/R/msg/text/?' + encodeURIComponent(shareText());
  if (!isTouch) { const a = document.createElement('a'); a.href = $('#coverImg').src; a.download = `veggie-cover-${G.issue}.jpg`; a.click(); }
  only('#scrShare');
});
$('#btnShareBack').addEventListener('click', () => only('#scrCover'));
$('#btnReshoot').addEventListener('click', () => { sfx.click(); goShoot(); });
$('#btnAgain').addEventListener('click', () => { sfx.click(); goTitle(); });
function openShelf(from) {
  G.shelfFrom = from; only('#scrShelf'); show('#vf', false);
  $('#shelfSub').textContent = SAVE.covers.length ? `一共 ${SAVE.covers.length} 本（最多保留最近 12 本，存在這支手機上）` : '';
  $('#shelf').innerHTML = SAVE.covers.length ? SAVE.covers.map((c, i) => `<figure><img src="${c.img}" data-i="${i}" alt="第 ${c.id} 期封面"><figcaption>No.${String(c.id).padStart(3, '0')}・${c.score} 分<br>${c.date.slice(5).replace('-', '/')}</figcaption></figure>`).join('') : '<div class="empty">還沒有封面喔！<br>做一道菜、拍一張照，就能登上《全真蔬食 VEGGIE》。</div>';
}
$('#btnShelf').addEventListener('click', () => { sfx.click(); openShelf('title'); });
$('#btnShelf2').addEventListener('click', () => { sfx.click(); openShelf('cover'); });
$('#btnShelfBack').addEventListener('click', () => { sfx.click(); G.shelfFrom === 'cover' ? only('#scrCover') : goTitle(); });
$('#shelf').addEventListener('click', (e) => { const im = e.target.closest('img'); if (!im) return; $('#bigImg').src = im.src; only('#scrBig'); });
$('#btnBigBack').addEventListener('click', () => only('#scrShelf'));
// 回島、登島報名
const leave = () => { if (EMBED) { try { window.parent.postMessage({ chef: 'leave' }, location.origin); return; } catch (e) {} } location.href = '../#chef'; };
['#btnIsle', '#btnIsle2'].forEach((q) => $(q).addEventListener('click', leave));
$('#btnHome').addEventListener('click', () => { if (G.phase === 'title') leave(); else if (confirm('要離開這道菜，回到選單嗎？')) goTitle(); });
$('#btnSignup').addEventListener('click', (e) => { if (EMBED) { try { window.parent.postMessage({ chef: 'join' }, location.origin); e.preventDefault(); } catch (err) {} } });

/* =========================================================
   每一幀
   ========================================================= */
let last = performance.now(), shake = 0, tAll = 0;
const fxc = $('#fx').getContext('2d'); const FX = { on: true };
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; tAll += dt;
  // 鏡頭補間
  if (cam.to) { const k = Math.min(1, (now - cam.t0) / 1000 / cam.dur), e = ease(k); camera.position.lerpVectors(cam.from.p, cam.to.p, e); cam.tgt.lerpVectors(cam.from.t, cam.to.t, e); if (k >= 1) cam.to = null; }
  if (G.phase === 'shoot') {
    if (orbit.hand && ori && orbit.base) { orbit.az = orbit.base.az - (ori.g - orbit.base.g) * 0.03; orbit.pol = clamp(orbit.base.pol - (ori.b - orbit.base.b) * 0.022, 0.05, 1.32); }
    const want = { az: orbit.az, pol: orbit.pol, dist: orbit.dist }; if (!orbit.cur) orbit.cur = { ...want };
    for (const k of ['az', 'pol', 'dist']) orbit.cur[k] = lerp(orbit.cur[k], want[k], 1 - Math.pow(0.0001, dt));
    const { az, pol, dist } = orbit.cur; camera.position.set(orbit.tgt.x + Math.sin(az) * Math.sin(pol) * dist, orbit.tgt.y + Math.cos(pol) * dist, orbit.tgt.z + Math.cos(az) * Math.sin(pol) * dist); cam.tgt.copy(orbit.tgt);
  }
  camera.lookAt(cam.tgt);
  if (shake > 0) { shake = Math.max(0, shake - dt); const s = shake * 0.12; camera.position.x += (Math.random() - 0.5) * s; camera.position.y += (Math.random() - 0.5) * s; }

  // 補間動畫；切段的裁切平面跟著那一段移動
  for (let i = TW.length - 1; i >= 0; i--) { const w = TW[i], k = Math.min(1, (now - w.t0) / w.dur); w.fn(k); if (k >= 1) { TW.splice(i, 1); w.done && w.done(); } }
  for (const q of CUT.segs) { q.planes[0].constant = -(q.lo + q.g.position.z); q.planes[1].constant = q.hi + q.g.position.z; }
  if (G.phase === 'title' && CUT.whole) CUT.whole.rotation.y += dt * 0.35;

  const sid = G.step >= 0 && STEPS[G.step] ? STEPS[G.step].id : '';
  const playing = G.phase === 'play' && !G.done;
  if (playing) { const left = tickTimer(); if (left <= 0) timeUp(sid); }

  // 第 2 步：火候
  if (sid === 'boil' && playing) {
    const acc = holdOn ? 2.4 : -1.9; heatV = clamp(heatV + acc * dt, -1.1, 1.1); heat += heatV * dt; if (heat < 0) { heat = 0; heatV = 0; } if (heat > 1) { heat = 1; heatV *= -0.3; }
    const z = zoneAt(elapsed()), ok = Math.abs(heat - z) < ZW / 2;
    if (ok) { inZone += dt; cooked += dt / 5.2; } else { outZone += dt; cooked += (heat > z ? 0.25 : 0.08) * dt / 5.2; }
    setProg(cooked); const gz = $('#gZone'), gh = $('#gauge').clientHeight; gz.style.top = ((1 - z - ZW / 2) * gh) + 'px'; gz.style.height = (ZW * gh) + 'px'; $('#gNeedle').style.top = ((1 - heat) * gh) + 'px';
    $('#gauge').classList.toggle('ok', ok); $('#hudTip').textContent = ok ? '火候剛好！保持住～' : heat > z ? '太大火了，放開一下！' : '火太小，按住加火！';
    loopVol('fire', 0.05 + heat * 0.25); loopVol('boil', 0.03 + cooked * 0.12);
    if (Math.random() < heat * dt * 8) sfx.bubble();
    if (cooked >= 1) { const r = inZone / Math.max(0.1, inZone + outZone); finishStep(40 + r * 70, `綠區命中率 ${Math.round(r * 100)}%`); }
  }
  // 火焰大小
  const fh = sid === 'boil' ? (playing ? heat : 0.25) : sid === 'blend' ? 0.15 : 0.25;
  flames.children.forEach((f) => { const s = 0.4 + fh * 1.6 + Math.sin(tAll * 14 + f.userData.ph) * 0.12; f.scale.set(1, s, 1); f.position.y = 0.12 + s * 0.22; });
  // 鍋裡的南瓜塊：煮的時候上下浮動，打泥的時候慢慢變小、湯變濃
  if (potSet.visible) {
    const boilK = sid === 'boil' ? heat : 0.3;
    potChunks.children.forEach((c, i) => { const b = c.userData.base; c.position.y = b.y + Math.sin(tAll * (3 + boilK * 6) + i) * 0.05 * (0.4 + boilK); const shrink = sid === 'blend' ? Math.max(0, 1 - mash * 1.25) : 1; c.scale.setScalar(Math.max(0.001, shrink)); c.visible = shrink > 0.02; if (sid === 'blend') { const a = Math.atan2(b.z, b.x) + tAll * spinV * 3, r = Math.hypot(b.x, b.z); c.position.x = Math.cos(a) * r; c.position.z = Math.sin(a) * r; } });
    if (sid === 'boil') { potSoup.position.y = 1.0 + cooked * 0.1; }
    if (sid === 'blend') { spinV = Math.max(0, spinV - dt * 0.9); blender.rotation.y += spinV * dt * 30; bHead.rotation.y += spinV * dt * 40; blender.position.x = Math.cos(tAll * 2) * 0.3 * spinV; blender.position.z = Math.sin(tAll * 2) * 0.3 * spinV;
      if (playing || mash > 0) { drawSoup(Math.min(1, mash * 1.1), tAll * spinV * 2 + mash * 6); soupTex.needsUpdate = true; potSoup.position.y = 1.1 + mash * 0.15; } loopVol('blender', 0.02 + spinV * 0.25); if (SND.blender) SND.blender.o.frequency.value = 80 + spinV * 80; }
    potSteam.forEach((s) => { const u = s.userData; u.t += dt * u.sp * 0.5; if (u.t > 1) u.t = 0; s.position.set(u.x * (1 + u.t), u.y0 + u.t * 2.2, u.z * (1 + u.t)); const k = sid === 'boil' ? 0.25 + heat * 0.6 : 0.45; s.material.opacity = Math.sin(u.t * Math.PI) * k; s.scale.setScalar(0.7 + u.t * 1.4); });
  }
  // 第 4 步：吹涼
  if (sid === 'cool' && playing) {
    blowing = G.mode === 'mic' ? micBlow(dt) : holdOn;
    if (blowing) { temp = Math.max(60, temp - dt * (G.mode === 'mic' ? 11.5 : 9.5)); }
    $('#thDeg').textContent = Math.round(temp) + '°'; setProg((92 - temp) / 32); $('#therm').classList.toggle('cool', temp <= 66);
    loopVol('blow', blowing && G.mode === 'touch' ? 0.18 : 0);
    if (G.mode === 'mic' && !MIC.calib.length && MIC.an) $('#hudTip').textContent = blowing ? '呼～繼續吹！' : '對麥克風長長吹氣～';
    if (temp <= 60) { const t = elapsed(); finishStep(100 - Math.max(0, t - 4.5) * 5, `${t.toFixed(1)} 秒吹到 60°`); }
  }
  if (tableSet.visible) {
    const k = sid === 'cool' && G.phase !== 'plate' && G.phase !== 'shoot' && G.phase !== 'cover' ? clamp((temp - 58) / 34, 0, 1) : G.phase === 'shoot' || G.phase === 'plate' ? 0.06 : 0;   // 擺盤、拍照時只留淡淡一縷蒸氣，不要像一層霧罩在湯上
    bowlSteam.forEach((s) => { const u = s.userData; u.push = lerp(u.push || 0, blowing && playing ? 1 : 0, dt * 4); u.t += dt * u.sp * 0.45 * (1 + u.push); if (u.t > 1) u.t = 0;
      s.position.set(u.x * (1 + u.t) - u.push * u.t * 2.5, u.y0 + u.t * 1.8, u.z * (1 + u.t) - u.push * u.t * 1.2); s.material.opacity = Math.sin(u.t * Math.PI) * k * 0.85; s.scale.setScalar(0.6 + u.t * 1.2); });
  }

  // 畫面：拍照模式走後製濾鏡，其他直接畫
  if (G.phase === 'shoot' && shootRect) { DOF.slow = dt > 0.045 ? DOF.slow + dt : Math.max(0, DOF.slow - dt * 0.5); if (DOF.slow > 1.2 && post.mat.uniforms.uTaps.value > 12) { post.mat.uniforms.uTaps.value = 12; DOF.slow = 0; }   // 舊手機跑太慢：預覽改輕一點的景深
    const w = Math.round(shootRect.w * renderer.getPixelRatio()), h = Math.round(shootRect.h * renderer.getPixelRatio()); post.mat.uniforms.uAspect.value = 0.8; renderShoot(null, w, h); }
  else renderer.render(scene, camera);

  // 刀光、畫圈的軌跡
  // 這層 2D 畫布只在做菜的步驟用（虛線、刀光、畫圈）；其他畫面直接藏起來，避免瀏覽器還顯示上一步殘留的虛線
  const fxOn = G.phase === 'play'; if (fxOn !== FX.on) { FX.on = fxOn; $('#fx').style.visibility = fxOn ? 'visible' : 'hidden'; }
  const dpr = $('#fx').width / VW; fxc.setTransform(dpr, 0, 0, dpr, 0, 0); fxc.clearRect(0, 0, VW, VH);
  drawGuide(fxc, now);
  while (trail.length && now - trail[0].t > 220) trail.shift();
  if (trail.length > 1) { fxc.lineCap = 'round'; fxc.lineJoin = 'round';
    for (let i = 1; i < trail.length; i++) { const a = trail[i - 1], b = trail[i]; if (b.t - a.t > 80) continue; const k = 1 - (now - b.t) / 220; fxc.strokeStyle = b.soft ? `rgba(255,255,255,${k * 0.6})` : `rgba(255,255,255,${k * 0.95})`; fxc.lineWidth = (b.soft ? 6 : 10) * k + 1; fxc.beginPath(); fxc.moveTo(a.x, a.y); fxc.lineTo(b.x, b.y); fxc.stroke(); } }
}
function timeUp(sid) {
  if (sid === 'cut') { const a = CUT.acc.length ? CUT.acc.reduce((x, y) => x + y, 0) / CUT.acc.length : 50; finishStep(CUT.stage / STAGES.length * 60 + a * 0.1, `時間到！切到第 ${CUT.stage} 步`); }
  else if (sid === 'boil') { const r = inZone / Math.max(0.1, inZone + outZone); finishStep(Math.min(70, cooked * 50 + r * 30), '時間到，南瓜也差不多軟了'); }
  else if (sid === 'blend') finishStep(mash * 70, '時間到，留一點口感也不錯');
  else if (sid === 'cool') finishStep(30 + (92 - temp) / 32 * 40, '時間到，湯也溫了');
}

// 測試用（唯讀）
window.__chef = () => ({ phase: G.phase, step: G.step, scores: G.scores.slice(), prog: +G.prog.toFixed(2), heat: +heat.toFixed(2), mash: +mash.toFixed(2), temp: Math.round(temp), cutStage: CUT.stage, segs: CUT.segs.length, cubes: CUT.cubes.length, motionOK, audio: SND.ctx ? SND.ctx.state : 'none', left: Math.round(G.limit - elapsed()) });
window.__chefCut = () => { if (G.phase !== 'play' || STEPS[G.step].id !== 'cut' || !STAGES[CUT.stage]) return; STAGES[CUT.stage].kind === 'scoop' ? finishScoop() : doCut(100); };   // 測試用：直接完成目前這一刀
window.__chefGuide = () => { const g = curGuide(); return g ? g.map((v) => toScreen(v)) : CUT.halves.map((h) => toScreen(h.position)); };   // 測試用：目前虛線（挖籽時是兩個半顆）的螢幕座標
window.__chefDemo = (arr) => { G.scores = arr.slice(0, STEP_N); };   // 測試用：做宣傳圖時指定四步的分數

resize(); goTitle(); requestAnimationFrame(frame);
</script>
