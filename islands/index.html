<style>
  /* 版面：全螢幕 3D 群島，左上品牌、右側（手機為底部）資訊卡、底部時光捲軸 */
  :root {
    --bg: #efe6d2;
    --sea: #b9d6d6;
    --card: rgba(255, 251, 243, 0.9);
    --ink: #3f2c22;
    --muted: #846a58;
    --line: rgba(63, 44, 34, 0.14);
    --brick: #a9473b;
    --jade: #3f8a6a;
    --gold: #d99a2b;
    --chip: rgba(63, 44, 34, 0.06);
    --font-display: "LXGW WenKai TC", "Kaiti TC", "STKaiti", "BiauKai", serif;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #172034; --sea: #1f2d45; --card: rgba(28, 37, 58, 0.88); --ink: #f2e5d0; --muted: #b3a18b;
      --line: rgba(242, 229, 208, 0.16); --brick: #e07a63; --jade: #6cc39a; --gold: #f0b54d; --chip: rgba(242, 229, 208, 0.08);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #172034; --sea: #1f2d45; --card: rgba(28, 37, 58, 0.88); --ink: #f2e5d0; --muted: #b3a18b;
    --line: rgba(242, 229, 208, 0.16); --brick: #e07a63; --jade: #6cc39a; --gold: #f0b54d; --chip: rgba(242, 229, 208, 0.08);
    color-scheme: dark;
  }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; transition: background 0.6s linear, color 0.6s linear; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 8px 28px rgba(50, 30, 15, 0.14);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: background 0.6s linear, border-color 0.6s linear; }

  .brand { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
    padding: 10px 16px 12px; max-width: min(360px, calc(100vw - 32px)); display: grid; gap: 4px; }
  .brand h1 { margin: 0; font-family: var(--font-display); font-size: 26px; letter-spacing: 0.12em; line-height: 1.1; text-wrap: balance; }
  .brand h1 small { font-size: 13px; letter-spacing: 0.08em; color: var(--muted); margin-left: 6px; font-family: var(--font-body); font-weight: 500; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .status > span { min-width: 0; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex: none; }
  .status[data-state="live"] i { background: var(--jade); box-shadow: 0 0 0 3px color-mix(in srgb, var(--jade) 25%, transparent); }

  /* 介面原則：資訊卡和時光捲軸一次只展開一個，收起來時都只剩一行 */
  .card { z-index: 2; }
  .brand .count { margin: 2px 0 0; font-size: 13px; color: var(--ink); line-height: 1.5; }
  /* 瓶中信數量：跟登島人數同一種寫法，整行可以點，點了飛到漂流瓶島 */
  .bottle-count, .party-count { cursor: pointer; }
  /* 凝聚晚會：跟瓶中信同一種寫法，數字用燈籠紅；整行可以點，點了飛到中一島 */
  .brand .count.party-count b { color: #d0392b; }
  :root[data-theme="dark"] .brand .count.party-count b { color: #ff8a7a; }
  .party-count .go { color: var(--brick); font-weight: 700; margin-left: 2px; white-space: nowrap; }
  .party-count:hover .go { text-decoration: underline; }
  .party-count:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; border-radius: 6px; }
  .brand .count.bottle-count b { color: #2f80c9; }
  .brand .count .n-gold { color: #d9770a; }
  .brand .count .n-green { color: #1d8a5f; font-size: 16px; }
  .brand .count .visit-n { font-size: 12px; color: var(--muted); }
  :root[data-theme="dark"] .brand .count .n-gold { color: #f0b54d; }
  .brand .count + .count { margin-top: -6px; }
  :root[data-theme="dark"] .brand .count.bottle-count b { color: #7cc4ff; }
  .bottle-count .go { color: var(--brick); font-weight: 700; margin-left: 2px; white-space: nowrap; }
  .bottle-count:hover .go { text-decoration: underline; }
  .bottle-count:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; border-radius: 6px; }
  .bottle-count.new b { animation: bump 0.5s ease-in-out 2; display: inline-block; }
  @keyframes bump { 50% { transform: scale(1.3); } }
  /* 歡迎今天登島的夥伴：名字可以點，點了飛到他的小人偶 */
  .brand .count.welcome { font-size: 12.5px; }
  .welcome button { border: 0; padding: 0 1px; background: none; color: var(--brick); font: inherit; font-weight: 700; cursor: pointer; }
  .welcome button:hover { text-decoration: underline; }
  .welcome button:focus-visible { outline: 2px solid var(--jade); outline-offset: 1px; border-radius: 4px; }
  .welcome .more { color: var(--muted); white-space: nowrap; }
  .board { justify-self: start; display: inline-flex; align-items: baseline; gap: 6px; margin: 2px 0; padding: 6px 14px; border-radius: 999px;
    background: var(--brick); color: #fff; font-weight: 700; font-size: 14px; text-decoration: none; box-shadow: 0 4px 12px color-mix(in srgb, var(--brick) 35%, transparent);
    transition: transform 0.2s; }
  .board small { font-size: 11px; font-weight: 500; opacity: 0.85; }
  .board:hover { transform: translateY(-1px); }
  .board:focus-visible, .cta a:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
  .cta { display: grid; gap: 8px; padding: 12px; border-radius: 14px; background: color-mix(in srgb, var(--brick) 10%, var(--chip)); border: 1px solid color-mix(in srgb, var(--brick) 30%, transparent); }
  .cta p { margin: 0; font-size: 13px; line-height: 1.6; }
  /* 寫成 .panel .cta a，才不會被後面「資訊卡連結一律綠色」的 .panel a 蓋掉，跟品牌卡的「我要登島」一樣紅底白字 */
  .panel .cta a { justify-self: start; display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 14px; border-radius: 999px; background: var(--brick); color: #fff;
    font-weight: 700; font-size: 13px; text-decoration: none; box-shadow: 0 4px 12px color-mix(in srgb, var(--brick) 30%, transparent); transition: transform 0.2s; }
  .panel .cta a:hover { transform: translateY(-1px); }
  .cta-link { font-size: 13px; color: var(--brick) !important; font-weight: 700; text-decoration: none; }
  .navpop a.board-item { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px;
    font-size: 14px; font-weight: 700; color: var(--brick); text-decoration: none; }
  .navpop a.board-item:hover { background: var(--chip); }
  /* 點開島時，品牌卡自動收成左上角一顆小膠囊；點膠囊可以暫時展開 */
  /* 收合／展開都用同一段 0.32 秒的線性轉場：卡片縮放、文字淡出、底下幾行往上收 */
  .brand { --bt: 0.32s linear; transition: background 0.6s linear, border-color 0.6s linear, padding var(--bt), max-width var(--bt); }
  .brand { overflow: hidden; }
  .brand h1 { white-space: nowrap; transition: font-size var(--bt); }
  .brand h1 small { display: inline-block; max-width: 22em; max-height: 2em; overflow: hidden; white-space: nowrap; vertical-align: -0.2em;
    transition: max-width var(--bt), max-height var(--bt), margin var(--bt), opacity var(--bt); }
  .brand-more { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--bt), opacity var(--bt), margin var(--bt), visibility 0s; }
  .brand-more > div { display: grid; gap: 4px; min-height: 0; overflow: hidden; padding: 0 8px 8px; margin: 0 -8px -8px; }
  /* 收合鈕跟資訊卡、時光捲軸用同一顆：小圓鈕＋箭頭；展開時 ⌄（收合），收起來時轉成 ⌃（展開） */
  .brand-toggle { position: absolute; top: 8px; right: 8px;
    transition: opacity var(--bt), top var(--bt), transform var(--bt), visibility 0s linear 0.32s; }
  .brand-toggle svg { transition: transform 0.2s; }
  .brand.brand-mini .brand-toggle svg { transform: rotate(180deg); }
  /* 收合鈕一直都在（初始狀態也可以自己收起來） */
  .brand { padding-right: 46px; }
  .brand.brand-mini { padding: 6px 42px 6px 14px; max-width: 84px; cursor: pointer; }
  .brand.brand-mini .brand-more > div { white-space: nowrap; }
  .brand.brand-mini h1 { font-size: 17px; }
  .brand.brand-mini h1 small { max-width: 0; max-height: 0; margin: 0; opacity: 0; }
  .brand.brand-mini .brand-more { grid-template-rows: 0fr; opacity: 0; margin-top: -4px; visibility: hidden;
    transition: grid-template-rows var(--bt), opacity var(--bt), margin var(--bt), visibility 0s linear 0.32s; }
  .brand.brand-mini .brand-toggle { top: 50%; right: 5px; transform: translateY(-50%); }
  .brand .count b { font-family: var(--font-display); font-size: 18px; color: var(--brick); font-variant-numeric: tabular-nums; margin-right: 2px; }

  #sound .on, #sound[aria-pressed="true"] .off { display: none; }
  #sound[aria-pressed="true"] .on { display: block; }
  .soundpop { position: fixed; z-index: 4; top: calc(64px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    width: 250px; padding: 12px 14px; display: grid; gap: 10px; }
  .soundpop > b { font-family: var(--font-display); font-size: 16px; letter-spacing: 0.06em; }
  .sw { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; cursor: pointer; }
  .sw input { margin: 3px 0 0; width: 18px; height: 18px; accent-color: var(--jade); }
  .sw span { display: grid; gap: 2px; font-size: 14px; }
  .sw small { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .mapctl { position: fixed; z-index: 3; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
  .icon { display: inline-grid; place-items: center; width: 40px; height: 40px; padding: 0; border-radius: 50%; background: var(--card);
    box-shadow: 0 4px 14px rgba(50, 30, 15, 0.14); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .icon svg { width: 20px; height: 20px; }
  .icon.sm { width: 30px; height: 30px; box-shadow: none; background: var(--chip); backdrop-filter: none; -webkit-backdrop-filter: none; }
  .icon.sm svg { width: 16px; height: 16px; }
  /* 日夜按鈕顯示目前的模式：自動（半日半月）、固定白天（太陽）、固定夜晚（月亮） */
  #night svg { display: none; }
  #night[data-mode="auto"] .auto, #night[data-mode="day"] .sun, #night[data-mode="night"] .moon { display: block; }
  .skytip { position: fixed; z-index: 5; left: 50%; bottom: calc(var(--dock-h, 52px) + 28px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 6px); padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity 0.32s linear, transform 0.32s linear; }
  .skytip.on { opacity: 1; transform: translate(-50%, 0); }
  /* 第一次進來的操作提示：畫面正中間一張小卡，三個手勢＋開始按鈕 */
  .howto { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(20, 30, 40, 0.28);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); opacity: 0; transition: opacity 0.32s linear; }
  .howto.on { opacity: 1; }
  .howto-card { width: min(340px, 100%); padding: 22px 22px 18px; text-align: center; transform: translateY(8px) scale(0.97); transition: transform 0.32s ease-out; }
  .howto.on .howto-card { transform: none; }
  .howto h2 { margin: 0; font-family: var(--font-display); font-size: 22px; letter-spacing: 0.06em; }
  .howto-sub { margin: 4px 0 14px; font-size: 13px; color: var(--muted); }
  .howto-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; text-align: left; }
  .howto-list li { display: grid; grid-template-columns: 46px 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--chip); }
  .howto-list b { font-size: 15px; }
  .howto-list small { grid-column: 2; font-size: 13px; color: var(--muted); }
  .hi { grid-row: span 2; width: 46px; height: 46px; border-radius: 12px; background: var(--card); position: relative; overflow: hidden; }
  .hi::before, .hi::after { content: ""; position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--brick); top: 17px; left: 17px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--brick) 22%, transparent); }
  .hi::after { display: none; }
  .hi-rotate::before { animation: hiRotate 2.4s ease-in-out infinite; }
  .hi-pan::before, .hi-pan::after { display: block; animation: hiPan 2.4s ease-in-out infinite; }
  .hi-pan::before { left: 11px; } .hi-pan::after { left: 23px; }
  .hi-zoom::before, .hi-zoom::after { display: block; }
  .hi-zoom::before { animation: hiZoomA 2.4s ease-in-out infinite; }
  .hi-zoom::after { animation: hiZoomB 2.4s ease-in-out infinite; }
  @keyframes hiRotate { 0%, 100% { transform: translate(-11px, 0); } 50% { transform: translate(11px, 0); } }
  @keyframes hiPan { 0%, 100% { transform: translate(0, -10px); } 50% { transform: translate(0, 10px); } }
  @keyframes hiZoomA { 0%, 100% { transform: translate(-3px, 3px); } 50% { transform: translate(-12px, 12px); } }
  @keyframes hiZoomB { 0%, 100% { transform: translate(3px, -3px); } 50% { transform: translate(12px, -12px); } }
  .howto-tip { margin: 14px 0 16px; font-size: 13px; line-height: 1.6; }
  .howto-go { padding: 10px 26px; border-radius: 999px; border: 0; background: var(--brick); color: #fff; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 16px color-mix(in srgb, var(--brick) 35%, transparent); }
  .howto-go:focus-visible { outline: 2px solid var(--jade); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .hi::before, .hi::after { animation: none !important; } }
  /* 寫瓶中信：網頁裡的信紙卡，不用跳到 Google 表單 */
  .write { position: fixed; inset: 0; z-index: 21; display: grid; place-items: center; padding: 16px; background: rgba(20, 30, 40, 0.32);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); opacity: 0; transition: opacity 0.28s linear; }
  .write.on { opacity: 1; }
  .write-card { width: min(380px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; padding: 18px 18px 16px; display: grid; gap: 12px;
    transform: translateY(10px) scale(0.97); transition: transform 0.28s ease-out; }
  .write.on .write-card { transform: none; }
  .write.toss .write-card { transform: translateY(-40px) scale(0.6) rotate(-12deg); opacity: 0; transition: transform 0.5s ease-in, opacity 0.5s ease-in; }
  .write h2 { margin: 0; font-family: var(--font-display); font-size: 20px; letter-spacing: 0.05em; }
  .write .wsub { margin: -6px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .write fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 6px; min-width: 0; }
  .write legend, .write label.wl { display: block; padding: 0; margin-bottom: 6px; font-size: 13px; font-weight: 700; }
  .write legend i, .write label.wl i { color: var(--brick); font-style: normal; }
  .write textarea, .write input[type="text"] { width: 100%; box-sizing: border-box; border: 1px solid rgba(160, 120, 60, 0.35); border-radius: 12px; padding: 10px 12px;
    font: inherit; font-size: 16px; background: #fff8e6; color: #3f2c22; }
  .write textarea { min-height: 110px; resize: vertical; line-height: 1.7; }
  .write textarea:focus, .write input[type="text"]:focus { outline: 2px solid var(--jade); outline-offset: 1px; }
  .write .wcount { justify-self: end; margin-top: -8px; font-size: 11.5px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips label { position: relative; }
  .chips input { position: absolute; opacity: 0; pointer-events: none; }
  .chips span { display: inline-block; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); font-size: 13px; cursor: pointer; transition: background 0.15s, transform 0.15s; }
  .chips input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chips input:focus-visible + span { outline: 2px solid var(--jade); outline-offset: 2px; }
  .chips.moods span { font-size: 22px; padding: 3px 7px; line-height: 1.2; }
  .chips.moods input:checked + span { background: color-mix(in srgb, var(--mc) 45%, var(--card)); border-color: var(--mc); color: inherit; transform: scale(1.12); }
  .write .werr { margin: 0; font-size: 13px; color: var(--brick); font-weight: 700; }
  .write .wbtns { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .write .wgo { padding: 10px 22px; border-radius: 999px; border: 0; background: var(--brick); color: #fff; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 16px color-mix(in srgb, var(--brick) 35%, transparent); }
  .write .wgo[disabled] { opacity: 0.6; cursor: wait; }
  .write .wcancel { border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; }
  .write .wform { margin-left: auto; font-size: 12px; color: var(--muted); }
  .panel .cta button.cta-write { justify-self: start; display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 14px; border-radius: 999px; border: 0; background: var(--brick); color: #fff;
    font: inherit; font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: 0 4px 12px color-mix(in srgb, var(--brick) 30%, transparent); }
  .letter .mine { display: inline-block; margin-bottom: 6px; padding: 2px 9px; border-radius: 999px; background: #ffe9a8; font-size: 12px; font-style: normal; font-weight: 700; color: #7a5a10; }

// 備份資料（signup/data.json）裡的姓名是遮蔽過的：「林詩涵」→「林○涵」、「王明」→「王○」，比對幹部時要用同樣的規則
function mask(name) {
  const s = Array.from(name);
  if (s.length <= 1) return name;
  if (s.length === 2) return s[0] + '○';
  return s[0] + '○'.repeat(s.length - 2) + s[s.length - 1];
}
const CADRE_LOOK = {

  輔導組: ['lighthouse', '#e0a03a', '燈塔'], 總務組: ['barn', '#8f5f3c', '倉庫和大工具箱'], 影音組: ['tower', '#7a5aa6', '三腳架單眼相機'], 活動組: ['bigtop', '#d2566a', '大帳篷'],
};
// 同一人身兼多組時，每一組都算；uid 是這個人在名單裡的序號，報名資料只記序號、不記姓名
const CADRE_OF = new Map();

// 每個幹部島上的一個小人偶＝一個職位
const SLOTS = [];
const CADRE = CADRE_GROUPS.map(({ group, members, duties }, i) => {
  const [mark, color, what] = CADRE_LOOK[group];
  const key = 'g' + (i + 1);
  const slots = members.map(([name, role]) => {
    const slot = { id: SLOTS.length, key, group, role, uid: CADRE_NAMES.indexOf(name), name,
      title: group === '班務團隊' ? role : group + role, duties: ROLE_DUTIES[role] || duties || [] };
    SLOTS.push(slot);
    return slot;
  });
  return { key, group, isle: group.replace(/(組|團隊)$/, '') + '島', size: members.length, mark, color, what, slots };
});
// 備份資料只有遮蔽過的姓名，用「遮蔽姓名＋組別」對回名單序號
function cadreUidsOf(masked, groups) {
  return CADRE_NAMES.map((n, u) => [n, u]).filter(([n]) => mask(n) === masked && CADRE_OF.get(n).some((g) => groups.includes(g))).map(([, u]) => u);
}

const lam = (color, extra = {}) => new THREE.MeshLambertMaterial({ color, ...extra });

function canvasTex(w, h, draw, repeat = false) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);

  t.colorSpace = THREE.SRGBColorSpace;

}
function scaleUV(geo, su, sv = 1) {

}

const COS30 = Math.cos(Math.PI / 6);

function makeIsland(key, R, x, z, kind) {

  const h1 = 2.2 + R * 0.06, h2 = 1.3 + R * 0.04;

  s2.rotation.y = Math.PI / 6;

}

const nightFacades = [];
function facade(widthU, floors, { round = false, door = false, floorH = 1 } = {}) {
  const PX = 56, W = Math.round(widthU * PX), H = Math.round(floors * floorH * PX), wins = [];
  for (let f = 0; f < floors; f++) {
    const top = (floors - f - 1) * floorH * PX, step = 1.3, n = Math.max(1, Math.floor((widthU - 0.6) / step));
    const start = (widthU - n * step) / 2 + (step - 0.9) / 2;
    for (let i = 0; i < n; i++) {
      const x = (start + i * step) * PX, isEdge = i === 0 || i === n - 1;
      if (door && f === 0 && Math.abs(x / PX + 0.45 - widthU / 2) < 1.4) continue;
      const pair = Math.min(i, n - 1 - i);   // 左右對稱的同一對窗戶
      if (round && isEdge && f > 0) wins.push({ kind: 'round', f, pair, cx: x + 0.45 * PX, cy: top + floorH * PX * 0.45, r: 0.28 * PX });
      else wins.push({ kind: 'rect', f, pair, x, y: top + floorH * PX * 0.2, w: 0.9 * PX, h: floorH * PX * 0.52 });
    }
  }
  if (door) wins.push({ kind: 'door', x: (widthU / 2 - 1.2) * PX, y: (floors - 1) * floorH * PX + floorH * PX * 0.18, w: 2.4 * PX, h: floorH * PX * 0.82 });
  const map = canvasTex(W, H, (g) => {
    g.fillStyle = C.wall; g.fillRect(0, 0, W, H);
    g.globalAlpha = 0.08;
    for (let i = 0; i < 700; i++) { g.fillStyle = i % 2 ? '#000' : '#fff'; g.fillRect(Math.random() * W, Math.random() * H, 3, 2); }
    g.globalAlpha = 1;
    for (let f = 0; f < floors; f++) { g.fillStyle = C.wallDark; g.fillRect(0, (floors - f) * floorH * PX - 5, W, 5); }
    for (const w of wins) {
      if (w.kind === 'round') {
        g.fillStyle = C.frame; g.beginPath(); g.arc(w.cx, w.cy, w.r + 5, 0, 7); g.fill();
        g.fillStyle = C.glass; g.beginPath(); g.arc(w.cx, w.cy, w.r, 0, 7); g.fill();
        g.strokeStyle = C.frame; g.lineWidth = 3; g.beginPath();
        g.moveTo(w.cx - w.r, w.cy); g.lineTo(w.cx + w.r, w.cy); g.moveTo(w.cx, w.cy - w.r); g.lineTo(w.cx, w.cy + w.r); g.stroke();
      } else {
        g.fillStyle = C.frame; g.fillRect(w.x - 4, w.y - 4, w.w + 8, w.h + 8);
        g.fillStyle = w.kind === 'door' ? '#2c2622' : C.glass; g.fillRect(w.x, w.y, w.w, w.h);
        g.strokeStyle = C.frame; g.lineWidth = 3;
        const cols = w.kind === 'door' ? 4 : 3;
        for (let c = 1; c < cols; c++) { g.beginPath(); g.moveTo(w.x + (w.w * c) / cols, w.y); g.lineTo(w.x + (w.w * c) / cols, w.y + w.h); g.stroke(); }
        g.beginPath(); g.moveTo(w.x, w.y + w.h * 0.35); g.lineTo(w.x + w.w, w.y + w.h * 0.35); g.stroke();
      }
    }
  });
  const emissiveMap = canvasTex(W, H, (g) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    for (const w of wins) {
      // 有幾對窗戶沒開燈比較自然；左右成對地暗，立面才會對稱
      if (w.kind !== 'door' && (w.f * 5 + w.pair * 3 + Math.round(widthU)) % 6 === 0) continue;
      g.fillStyle = w.kind === 'door' ? '#ffd38a' : '#ffc874';
      if (w.kind === 'round') { g.beginPath(); g.arc(w.cx, w.cy, w.r, 0, 7); g.fill(); } else g.fillRect(w.x, w.y, w.w, w.h);
    }
  });
  const m = new THREE.MeshLambertMaterial({ map, emissiveMap, emissive: '#ffffff', emissiveIntensity: 0 });
  nightFacades.push(m);
  return m;
}

const balusterTex = canvasTex(64, 64, (g) => {
  g.fillStyle = C.slab; g.fillRect(0, 0, 64, 64);
  g.fillStyle = C.railGreen;
  for (const x of [10, 38]) { g.beginPath(); g.ellipse(x + 8, 32, 8, 26, 0, 0, 7); g.fill(); }
}, true);
const railPanelMat = new THREE.MeshLambertMaterial({ map: balusterTex });
function railSide(x1, z1, x2, z2, y, parent, h = 0.36) {
  const len = Math.hypot(x2 - x1, z2 - z1), g = new THREE.Group();
  g.position.set((x1 + x2) / 2, y, (z1 + z2) / 2);
  g.rotation.y = -Math.atan2(z2 - z1, x2 - x1);
  mesh(new THREE.BoxGeometry(len + 0.08, 0.07, 0.12), whiteMat, 0, h, 0, g);
  mesh(scaleUV(new THREE.BoxGeometry(len, h - 0.07, 0.05), len / 0.55), railPanelMat, 0, (h - 0.07) / 2, 0, g);
  parent.add(g);
}
function railRect(cx, cz, w, d, y, parent, frontGap = 0) {
  const x0 = cx - w / 2, x1 = cx + w / 2, z0 = cz - d / 2, z1 = cz + d / 2;
  railSide(x0, z0, x1, z0, y, parent); railSide(x1, z0, x1, z1, y, parent);
  railSide(x0, z0, x0, z1, y, parent);
  // frontGap：前面留一個缺口給樓梯
  if (frontGap) { railSide(x0, z1, cx - frontGap / 2, z1, y, parent); railSide(cx + frontGap / 2, z1, x1, z1, y, parent); }
  else railSide(x0, z1, x1, z1, y, parent);
}
// 斜的欄杆（樓梯用）：沿著 x 方向從 (x1, y1) 爬到 (x2, y2)
function railSlope(x1, y1, x2, y2, z, parent, h = 0.36) {
  const len = Math.hypot(x2 - x1, y2 - y1), g = new THREE.Group();
  g.position.set((x1 + x2) / 2, (y1 + y2) / 2, z);
  g.rotation.z = Math.atan2(y2 - y1, x2 - x1);
  mesh(new THREE.BoxGeometry(len + 0.08, 0.07, 0.12), whiteMat, 0, h, 0, g);
  mesh(scaleUV(new THREE.BoxGeometry(len, h - 0.07, 0.05), len / 0.55), railPanelMat, 0, (h - 0.07) / 2, 0, g);
  parent.add(g);
}

// 曲面屋頂：簷口平緩、屋脊陡、四角起翹
const tileTex = canvasTex(64, 64, (g) => {
  g.fillStyle = C.tile; g.fillRect(0, 0, 64, 64);
  g.fillStyle = C.tileDark; g.fillRect(0, 0, 10, 64);
  g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(30, 0, 6, 64);
}, true);
const tileMat = new THREE.MeshLambertMaterial({ map: tileTex, side: THREE.DoubleSide });
function curvedRoof(w, d, h, ridgeHalf, lift) {
  const M = 10, R = 8, per = 4 * M, pos = [], uv = [], idx = [];
  for (let r = 0; r <= R; r++) {
    const t = r / R, hx = w / 2 + (ridgeHalf - w / 2) * t, hz = (d / 2) * (1 - t), y = h * Math.pow(t, 1.7);
    const corners = [[-hx, hz], [hx, hz], [hx, -hz], [-hx, -hz]];
    for (let k = 0; k <= per; k++) {
      const kk = k % per, s = Math.floor(kk / M), u = (kk % M) / M, a = corners[s], b = corners[(s + 1) % 4];
      const lt = lift * Math.pow(1 - t, 2) * Math.pow(Math.abs(2 * u - 1), 4);
      pos.push(a[0] + (b[0] - a[0]) * u, y + lt, a[1] + (b[1] - a[1]) * u);
      uv.push((k / per) * ((2 * (w + d)) / 0.45), t * 3);
    }
  }
  const row = per + 1;
  for (let r = 0; r < R; r++) for (let k = 0; k < per; k++) { const a = r * row + k, b = a + 1, c = a + row, e = c + 1; idx.push(a, b, c, b, e, c); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}
const ridgeMat = lam(C.ridge), gourdMat = lam(C.gourd);
function gourd(x, y, z, s, parent) {
  mesh(new THREE.SphereGeometry(0.16 * s, 12, 10), gourdMat, x, y + 0.14 * s, z, parent);
  mesh(new THREE.SphereGeometry(0.11 * s, 12, 10), gourdMat, x, y + 0.38 * s, z, parent);
  mesh(new THREE.ConeGeometry(0.04 * s, 0.18 * s, 8), gourdMat, x, y + 0.55 * s, z, parent);
}
function roof(w, d, h, ridgeHalf, lift, x, y, z, parent, mat = tileMat) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  mesh(curvedRoof(w, d, h, ridgeHalf, lift), mat, 0, 0, 0, g);
  for (const [sx, sz] of [[-1, 1], [1, 1], [1, -1], [-1, -1]]) {
    const tip = mesh(new THREE.ConeGeometry(0.06, 0.45, 6), ridgeMat, (sx * w) / 2 * 1.01, lift + 0.12, (sz * d) / 2 * 1.01, g);
    tip.rotation.set(sz * 0.7, 0, -sx * 0.7);
  }
  if (ridgeHalf > 0) {
    mesh(new THREE.BoxGeometry(ridgeHalf * 2 + 0.3, 0.18, 0.18), ridgeMat, 0, h + 0.05, 0, g);
    for (const sx of [-1, 1]) {
      const curl = mesh(new THREE.TorusGeometry(0.24, 0.07, 6, 12, Math.PI * 1.3), ridgeMat, sx * (ridgeHalf + 0.1), h + 0.32, 0, g);
      curl.rotation.y = sx > 0 ? Math.PI : 0;
    }
    gourd(0, h + 0.12, 0, 1.6, g);
  } else gourd(0, h - 0.05, 0, 1, g);
  parent.add(g);
  return g;
}

// 障礙物：樹、樹叢、路燈、圍籬、柱子、地標、講師…，人偶走路時要繞開（座標是島上的區域座標）
// 圓形 { x, z, r }，長方形 { x0, x1, z0, z1 }；每個人偶走動的範圍也登記成長方形，彼此就不會重疊
const OBST = new Map();
const obstOf = (parent) => { if (!OBST.has(parent)) OBST.set(parent, []); return OBST.get(parent); };
const addObst = (parent, o) => { obstOf(parent).push(o); return o; };
const BODY_R = 0.45;   // 人偶身體的半徑（含一點空隙）
// 人偶在 z 這條線上、從 x-roam 走到 x+roam，會不會碰到任何障礙物
function pathClear(parent, x, z, roam) {
  const a = x - roam - BODY_R, b = x + roam + BODY_R;
  return obstOf(parent).every((o) => {
    if (o.r != null) {
      const cx = Math.min(Math.max(o.x, x - roam), x + roam);
      return Math.hypot(o.x - cx, o.z - z) > o.r + BODY_R;
    }
    return b < o.x0 || a > o.x1 || z + BODY_R < o.z0 || z - BODY_R > o.z1;
  });
}
// 原本的位置被擋住，就在附近繞圈找一個空位（不能超出島的邊緣）
function freeSpot(parent, x, z, roam, maxR) {
  if (pathClear(parent, x, z, roam)) return [x, z];
  for (let d = 0.4; d < 6; d += 0.4) {
    for (let k = 0; k < 12; k++) {
      const a = (k / 12) * Math.PI * 2, nx = x + Math.sin(a) * d, nz = z + Math.cos(a) * d;
      if (maxR && Math.hypot(nx, nz) + roam > maxR) continue;
      if (pathClear(parent, nx, nz, roam)) return [nx, nz];
    }
  }
  return [x, z];
}
function pine(x, z, h, parent) {
  addObst(parent, { x, z, r: 0.75 });
  mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.5, 6), trunkMat, x, 0.25, z, parent);
  for (let i = 0; i < 3; i++) {
    const r = 0.75 - i * 0.18, hh = h * 0.45;
    mesh(new THREE.ConeGeometry(r, hh, 8), lam(i % 2 ? C.pineLight : C.pine), x, 0.4 + i * h * 0.24 + hh / 2, z, parent);
  }
}
function bush(x, z, s, parent, mat = hillMat2) {
  addObst(parent, { x, z, r: 0.8 * s });
  mesh(new THREE.CylinderGeometry(0.1, 0.14, 0.8 * s, 6), trunkMat, x, 0.4 * s, z, parent);
  mesh(new THREE.IcosahedronGeometry(0.8 * s, 1), mat, x, 0.8 * s + 0.6 * s, z, parent);
}

const TEMPLE = makeIsland('temple', 18, 0, 0, 'temple');
const FRONT_Z = 18 * COS30;
const plaza = { x0: -9.5, x1: 9.5, z0: 4.6, z1: FRONT_Z - 1.5 };
const lampLights = [];
(function buildTemple() {
  const T = TEMPLE.group;
  const paveMat = lam(C.pave);
  mesh(new THREE.BoxGeometry(17, 0.06, 5), paveMat, 0, 0.03, 5.6, T, false);
  mesh(new THREE.BoxGeometry(6, 0.06, FRONT_Z - 8), paveMat, 0, 0.03, (FRONT_Z + 8) / 2, T, false);

  const BW = 14, BD = 7, BZ = -1, FLOORS = 3, FH = 1.35, TOP = FLOORS * FH;
  const frontMat = facade(BW, FLOORS, { round: true, door: true, floorH: FH });
  const backMat = facade(BW, FLOORS, { floorH: FH }), sideMat = facade(BD, FLOORS, { floorH: FH });
  mesh(new THREE.BoxGeometry(BW, TOP, BD), [sideMat, sideMat, whiteMat, lam(C.wall), frontMat, backMat], 0, TOP / 2, BZ, T);

// 佛堂廣場上的報名者：學員乾道藍、坤道橘；幹部穿該組顏色並帶職位配件，點了可以看是誰
const plazaPeople = [], plazaHit = [];

const ROLE_RANK = { 班長: 0, 坤道副班長: 1, 乾道副班長: 1, 組長: 2, 成員: 3 };
const mainSlotOf = (d) => SLOTS.filter((sl) => (d.uids || []).includes(sl.uid)).sort((a, b) => ROLE_RANK[a.role] - ROLE_RANK[b.role])[0];
function syncPlaza(list) {
  // 人數、乾坤或幹部組成有變才重新擺人偶
  const sig = list.map((p) => p.g + (p.uids || []).join(',') + (p.isCadre ? '*' : '') + (p.m || '')).join('|');
  if (sig === plazaSig) return;
  plazaSig = sig;
  clearWalkers(plazaPeople);
  plazaHit.length = 0;
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  list.forEach((d) => {
    const slot = mainSlotOf(d);
    const p = slot ? figure(d.g === '坤道' ? kunMat : qianMat, slot.role, d.g === '坤道', { juggle: slot.group === '活動組' && slot.role === '組長', popper: slot.group === '公關禮節組', trick: TRICK_OF(slot), scarf: islands[slot.key].info.color }) : figure(d.g === '坤道' ? kunMat : qianMat, d.isCadre, d.g === '坤道');
    if (slot) Object.assign(p.userData, { slot: slot.id, at: 'temple' });
    else p.userData.person = realPeople.indexOf(d);
    p.traverse((m) => { if (m.isMesh) plazaHit.push(m); });
    // 在廣場上隨機找位置，走動的路線不能碰到樹、路燈、圍籬，也不跟別人重疊
    let x = 0, z = plaza.z0;
    for (let tries = 0; tries < 80; tries++) {
      x = plaza.x0 + rnd() * (plaza.x1 - plaza.x0); z = plaza.z0 + rnd() * (plaza.z1 - plaza.z0);
      if (pathClear(TEMPLE.group, x, z, 0.6)) break;
    }
    placeWalker(p, TEMPLE.group, x, z, 0.6, TEMPLE.R * COS30 - 1);
    p.userData.grow = 1.35;
    if (AURA_NAMES.some((n) => d.m === n || d.m === mask(n))) addAura(p);
    plazaPeople.push(p);
  });
}

const R_PM = 5, PM_GAP = 7;
const angGap = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));
function pmSpot(parent) {
  const out = Math.atan2(parent.x, parent.z), dist = parent.R * COS30 + PM_GAP + R_PM * COS30;
  // 六條邊的方向是 0°、60°…；先試最朝外的邊，會撞到高架橋或其他島就換下一條
  const edges = [0, 1, 2, 3, 4, 5].map((k) => (k * Math.PI) / 3).sort((a, b) => angGap(a, out) - angGap(b, out));
  for (const a of edges) {
    const x = parent.x + Math.sin(a) * dist, z = parent.z + Math.cos(a) * dist;
    if (Math.hypot(x, z) < Math.hypot(parent.x, parent.z) + 4) continue;
    if (Math.abs(x * VNORMAL.x + z * VNORMAL.z - 22) < R_PM + 4) continue;
    if (Object.values(islands).some((o) => Math.hypot(o.x - x, o.z - z) < o.R + R_PM + 4)) continue;
    return [x, z];
  }
  return [parent.x + Math.sin(out) * dist, parent.z + Math.cos(out) * dist];
}

    addObst(isl.group, { x: g.position.x, z: g.position.z, r: 1.1 });
    // 身後的小黑板，看得出是老師
    const board = new THREE.Group(); board.position.set(0.55, 0, -0.45); board.rotation.y = -0.35; g.add(board);
    mesh(new THREE.BoxGeometry(0.9, 0.6, 0.05), boardMat, 0, 1.05, 0, board);
    mesh(new THREE.BoxGeometry(0.98, 0.07, 0.07), easelMat, 0, 0.72, 0.03, board, false);
    for (const sx of [-0.38, 0.38]) mesh(new THREE.CylinderGeometry(0.035, 0.035, 1.4, 5), easelMat, sx, 0.65, -0.06, board, false).rotation.x = 0.12;
    // 講師本身也是班務幹部（例如坤道副班長何珈貞）：用跟她幹部人偶一樣的樣子（乾坤顏色、職位配件、組別圍巾），身後一樣立著小黑板
    const slot = SLOTS.find((sl) => sl.name === t.name && /坤道|乾道/.test(sl.role));
    const kun = slot && slot.role.includes('坤道');
    const fig = slot ? figure(kun ? kunMat : qianMat, slot.role, kun, { scarf: CADRE_LOOK[slot.group][1] })
      : figure(teacherMat, '', false, TEACHER_LOOK[t.name] || { scarf: '#2f6f73', glasses: true, book: true });
    fig.scale.setScalar(1.45);
    g.add(fig);
    const rec = { id: TEACHERS.length, key: isl.key, fig, slot, ...t };
    fig.userData.teacher = g.userData.teacher = rec.id;
    g.traverse((m) => { if (m.isMesh) teacherHit.push(m); });
    TEACHERS.push(rec);
  });
}
// 古典瑜伽是每堂課早上的第一堂，集中在瑜伽島，課程島上只留觀點分享的講師
COURSES.forEach((c) => {
  addTeachers(islands[c.key], (c.prog || []).filter(([label]) => label !== '下午活動' && label !== '古典瑜伽').map(([topic, text]) => ({ topic, text })), 5.2, 2.3);
  if (c.pm) addTeachers(islands[c.pm.key], [{ topic: c.pm.name, text: c.pm.who || '' }], 3.2, 2);
});

/* ---------- 何珈貞（重啟島講師）：平常繞著重啟島慢跑，偶爾跌倒再爬起來；被點到時像超級瑪莉一樣起跳，
   拳頭朝天、背後長出小天使翅膀飛一圈，落地後再揮手 ---------- */
{
  const rec = TEACHERS.find((x) => x.name === '何珈貞' && x.key === 'c6');
  if (rec) {
    const isl = islands[rec.key], f = rec.fig, u = f.userData, inner = f.children[0];
    // 從講台（小黑板那一組）拿出來，直接放在島上跑；小黑板留在原地，從講台前面起跑
    const start = f.parent.position;
    let th = Math.atan2(start.x, start.z);
    f.parent.remove(f); isl.group.add(f);
    f.scale.setScalar(1.45 * 1.3);
    // 副班長原本的拍手換成跑步，手臂交給下面的動畫
    for (let i = TRICKS.length - 1; i >= 0; i--) if (TRICKS[i].f === f) TRICKS.splice(i, 1);
    TRICKS.push({ f, kind: 'runner' });   // 留著冒泡泡（💫）的功能
    const RUN_R = 5.9, SPEED = 0.6;
    let nextFall = 18 + Math.random() * 10, fallT = -9, lastT = null;
    // 小天使翅膀：左右各三片白色羽毛疊成一片，掛在背後的樞紐上拍動
    const wingMat = new THREE.MeshLambertMaterial({ color: '#ffffff', emissive: '#fff6d8', emissiveIntensity: 0.35 });
    const wings = [-1, 1].map((sx) => {
      const w = new THREE.Group(); w.position.set(sx * 0.14, 0.78, -0.36); inner.add(w);
      [[0.32, 0.12, 0.3], [0.5, 0.0, 0.24], [0.62, -0.12, 0.18]].forEach(([x, y, r], k) => {
        const fe = mesh(dotGeo, wingMat, sx * x, y + 0.1, -0.06, w, false);
        fe.scale.set(r, r * 0.55, 0.05); fe.rotation.z = sx * (0.5 - k * 0.25);
      });
      w.visible = false;
      return w;
    });
    const feathers = [];
    for (let i = 0; i < 6; i++) { const fe = mesh(dotGeo, wingMat, 0, 0, 0, isl.group, false); fe.scale.set(0.1, 0.05, 0.02); fe.visible = false; feathers.push(fe); }
    const FLY = 2.4, H = 2.3;
    // 跌倒揚起的灰：一團團淡米色的煙，往外、往上散開，越飄越大、越淡
    const dustGeo = new THREE.SphereGeometry(1, 14, 10), dust = [];
    for (let i = 0; i < 48; i++) {
      const c = i % 3 ? '#fbf4e4' : '#efe2c6';
      const m = new THREE.Mesh(dustGeo, new THREE.MeshLambertMaterial({ color: c, emissive: c, emissiveIntensity: 0.45, transparent: true, opacity: 0, depthWrite: false }));
      m.visible = false; m.userData.noMerge = true; isl.group.add(m);
      dust.push({ m, life: 0, age: 9, v: new THREE.Vector3(), size: 1 });
    }
    let dustNext = 0;
    const puff = (n, spread, size, up, fwd = 0, h = 0.15) => {
      const fx = Math.sin(f.rotation.y), fz = Math.cos(f.rotation.y);
      for (let i = 0; i < n; i++) {
        const d = dust[dustNext++ % dust.length], a = Math.random() * Math.PI * 2, sp = spread * (0.6 + Math.random() * 0.6);
        d.m.position.set(f.position.x + fx * fwd + Math.cos(a) * 0.3, h + Math.random() * 0.2, f.position.z + fz * fwd + Math.sin(a) * 0.3);
        d.v.set(Math.cos(a) * sp + fx * spread * 0.5, up * (0.5 + Math.random()), Math.sin(a) * sp + fz * spread * 0.5);
        d.age = 0; d.life = 0.9 + Math.random() * 0.7; d.size = size * (0.7 + Math.random() * 0.6);
        d.m.visible = true;
      }
    };
    animators.push((t) => {
      const dt = Math.min(0.1, t - (dust.t ?? t)); dust.t = t;
      for (const d of dust) {
        if (d.age >= d.life) { if (d.m.visible) d.m.visible = false; continue; }
        d.age += dt;
        const k = d.age / d.life;
        d.m.position.addScaledVector(d.v, dt);
        d.v.multiplyScalar(1 - dt * 2.2);   // 空氣阻力：衝出去之後慢慢停
        d.m.scale.setScalar(d.size * (0.25 + k * 0.75));
        d.m.material.opacity = 0.85 * (1 - k) * Math.min(1, k * 10);
      }
    });
    const [L, R] = u.arms;
    const setRun = () => { inner.rotation.set(0.18, 0, 0); inner.scale.set(1, 1, 1); wings.forEach((w) => { w.visible = false; }); };
    animators.push((t) => {
      const dt = lastT == null ? 0 : Math.min(0.1, t - lastT); lastT = t;
      if (u.focusT != null || offscreen(f)) return;   // 被點到時交給 onFocus；不在畫面裡就先不跑
      const fe = t - fallT;
      if (fe < 2.4) {
        // 跌倒：往前撲 → 「砰」一聲揚起一大團灰、往前滑一小段 → 趴著 💫 → 撐起來 → 拍拍身體，拍一下冒一小團灰
        const k = fe < 0.3 ? fe / 0.3 : fe < 1.3 ? 1 : fe < 2 ? 1 - (fe - 1.3) / 0.7 : 0;
        if (fe >= 0.3 && !u.landed) { u.landed = true; puff(26, 2.2, 0.5, 1.4, 0.5); trickSound('thud', f); }
        if (fe > 0.3 && fe < 0.7) {   // 往前滑一小段，滑過的地方一路冒灰
          th += SPEED * 1.6 * dt;
          f.position.set(Math.sin(th) * RUN_R, 0, Math.cos(th) * RUN_R);
          if (Math.random() < 0.5) puff(1, 0.6, 0.3, 0.5, 0.2);
        }
        if (fe > 1.3 && fe < 2 && !u.upPuff) { u.upPuff = true; puff(6, 0.8, 0.3, 0.8, 0.3); }
        if (fe >= 2) {
          const pk = Math.floor((fe - 2) * 16 / Math.PI);
          if (pk !== u.patK) { u.patK = pk; puff(3, 0.5, 0.2, 1.4, 0, 0.6); }
        }
        inner.rotation.x = 0.18 + k * 1.35;
        f.position.y = 0;
        L.rotation.set(-1.4 * k, 0, -ARM_REST * (1 - k * 0.5)); R.rotation.set(-1.4 * k, 0, ARM_REST * (1 - k * 0.5));
        if (fe >= 2) { const pat = Math.abs(Math.sin((fe - 2) * 16)); L.rotation.set(-0.6, 0, -0.3 - pat * 0.3); R.rotation.set(-0.6, 0, 0.3 + pat * 0.3); }
        return;
      }
      if (t > nextFall) { fallT = t; nextFall = t + 20 + Math.random() * 10; bubble(f, '💫'); u.landed = u.upPuff = false; u.patK = -1; return; }
      setRun();
      th += SPEED * dt;
      f.position.set(Math.sin(th) * RUN_R, Math.abs(Math.sin(t * 9)) * 0.12, Math.cos(th) * RUN_R);
      f.rotation.y = Math.atan2(Math.cos(th), -Math.sin(th));
      u.restRotY = f.rotation.y;
      const sw = Math.sin(t * 9);
      L.rotation.set(sw * 0.9, 0, -ARM_REST * 0.6); R.rotation.set(-sw * 0.9, 0, ARM_REST * 0.6);
    });
    // 被點到：蹲 → 起跳 → 拳頭朝天、翅膀拍動飛一下 → 落地；回傳 null 代表還在飛，回傳數字就接著揮手
    u.onFocus = (fig, e, t) => {
      // 鏡頭還在飛過來的路上就先站著等，等鏡頭到了才起跳，才不會錯過
      if (tween) { fig.userData.focusT = t; inner.rotation.set(0, 0, 0); inner.scale.set(1, 1, 1); fig.position.y = 0; L.rotation.set(0, 0, -ARM_REST); R.rotation.set(0, 0, ARM_REST); return null; }
      if (e >= FLY) { wings.forEach((w) => { w.visible = false; }); feathers.forEach((x) => { x.visible = false; }); inner.rotation.set(0, 0, 0); inner.scale.set(1, 1, 1); return e - FLY; }
      fallT = -9;
      if (e < 0.22) {   // 蹲下蓄力
        const k = e / 0.22;
        inner.scale.set(1 + k * 0.12, 1 - k * 0.22, 1 + k * 0.12); inner.rotation.set(0, 0, 0);
        fig.position.y = 0; L.rotation.set(0, 0, -ARM_REST); R.rotation.set(0, 0, ARM_REST);
        return null;
      }
      if (e - 0.22 < 0.05) { bubble(fig, '✨'); trickSound('wand', fig); }
      inner.scale.set(1, 1, 1);
      const k = (e - 0.22) / (FLY - 0.22);
      const hgt = k < 0.3 ? H * (1 - (1 - k / 0.3) ** 2) : k < 0.75 ? H + Math.sin((k - 0.3) * 14) * 0.15 : H * (1 - ((k - 0.75) / 0.25) ** 2);
      fig.position.y = hgt;
      // 超人姿勢：右手拳頭斜斜朝天（往外一點才不會被大頭擋住），左手貼在身側，身體微微往前傾
      R.rotation.set(-0.35, 0, 2.35); L.rotation.set(0.2, 0, -0.25);
      inner.rotation.set(k < 0.75 ? 0.15 : 0, 0, 0);
      // 翅膀：起跳後展開、快速拍動；落地前收起
      const on = k > 0.05 && k < 0.92;
      wings.forEach((w, i) => { w.visible = on; w.rotation.y = (i ? -1 : 1) * (0.35 + Math.sin(t * 28) * 0.45); });
      // 幾根羽毛從身邊飄落
      fig.getWorldPosition(waveTmp); isl.group.worldToLocal(waveTmp);
      feathers.forEach((x, i) => {
        const fk = (k * 3 + i / 6) % 1;
        x.visible = on;
        x.position.set(waveTmp.x + Math.sin(i * 2.1) * (0.6 + fk), waveTmp.y + 1.6 - fk * 2.2, waveTmp.z + Math.cos(i * 2.1) * (0.6 + fk));
        x.rotation.set(t * 3 + i, t * 2, Math.sin(t * 4 + i));
      });
      return null;
    };
  }
}

/* ---------- 瑜伽島：在全真島、走走島、歡樂島之間；每堂課早上大家先來這裡做古典瑜伽 ---------- */
const YOGA_COURSES = COURSES.filter((c) => (c.prog || []).some(([k]) => k === '古典瑜伽'));
const YOGA_WHO = ((YOGA_COURSES[0] || {}).prog || []).find(([k]) => k === '古典瑜伽')?.[1] || '';
const yogaIsl = makeIsland('yoga', 6, 26, 14, 'yoga');
const YOGA_POSES = [];   // 墊子上跟著講師做動作的人偶（講師也在裡面）
{
  const g = yogaIsl.group;
  bridge(TEMPLE, yogaIsl);
  const mark = new THREE.Group(); mark.rotation.y = faceCam(yogaIsl.x, yogaIsl.z); g.add(mark);
  yogaIsl.mark = mark;
  // 講台後面左邊一顆太陽、右邊一彎月亮：拜日式、拜月式，一陽一陰
  // 做成有厚度的立體（太陽是球、光芒是小圓錐、月亮和星星是擠出來的厚片），從島的哪一面看都看得到
  const glow = (c, k = 0.55) => lam(c, { emissive: c, emissiveIntensity: k });
  const sunG = new THREE.Group(); sunG.position.set(-2.4, 3.3, -3.9); mark.add(sunG);
  mesh(new THREE.SphereGeometry(0.9, 24, 16), glow('#ffb54d'), 0, 0, 0, sunG, false);
  const rays = new THREE.Group(); sunG.add(rays);
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2, ray = mesh(new THREE.ConeGeometry(0.12, 0.42, 8), glow('#ffd27a'), Math.cos(a) * 1.25, Math.sin(a) * 1.25, 0, rays, false);
    ray.rotation.z = a - Math.PI / 2;
  }
  // 彎月：大圓減掉往右偏的同樣大小的圓，留下開口朝右的月牙，再擠出厚度、磨圓邊
  const MR = 1.0, MD = 0.75, phi = Math.atan2(Math.sqrt(MR * MR - (MD * MD) / 4), MD / 2);
  const crescent = new THREE.Shape();
  crescent.absarc(0, 0, MR, phi, Math.PI * 2 - phi, false);
  crescent.absarc(MD, 0, MR, Math.PI + phi, Math.PI - phi, true);
  const thick = (shape, depth, bevel) => {
    const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 24 });
    geo.translate(0, 0, -depth / 2);
    return geo;
  };
  const moonG = new THREE.Group(); moonG.position.set(2.4, 3.3, -3.9); mark.add(moonG);
  const moon = mesh(thick(crescent, 0.3, 0.08), glow('#ffe48a'), -0.3, 0, 0, moonG, false);
  moon.rotation.z = -0.35;
  const starShape = new THREE.Shape();
  for (let k = 0; k < 10; k++) {
    const a = Math.PI / 2 + (k * Math.PI) / 5, r = k % 2 ? 0.42 : 1;
    starShape[k ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r);
  }
  const starGeo = thick(starShape, 0.25, 0.08);
  const stars = [[0.75, 0.85, 0.15], [1.05, -0.35, 0.12], [0.45, -1.0, 0.1]].map(([x, y, r]) => {
    const st = new THREE.Group(); st.position.set(x, y, 0); st.userData.r = r; moonG.add(st);
    mesh(starGeo, glow('#fff7d6', 0.7), 0, 0, 0, st, false);
    return st;
  });
  animators.push((t) => {
    sunG.scale.setScalar(1 + Math.sin(t * 0.8) * 0.04);
    rays.rotation.z = t * 0.12;
    moonG.rotation.z = Math.sin(t * 0.5) * 0.06;
    stars.forEach((st, i) => { st.scale.setScalar(st.userData.r * (0.7 + 0.3 * Math.abs(Math.sin(t * 1.3 + i * 1.7)))); st.rotation.y = t * 0.6 + i; });
  });
  // 木頭講台
  mesh(new THREE.BoxGeometry(3.2, 0.35, 1.8), lam(C.wood), 0, 0.18, -2.7, mark);
  mesh(new THREE.BoxGeometry(3.3, 0.06, 1.9), lam('#a77b4f'), 0, 0.38, -2.7, mark);
  addObst(g, { x: 0, z: 0, r: 0.1 });
  // 彩色瑜伽墊：三排、每排三張
  const MAT = ['#8fd3c1', '#f7b6c2', '#b9a7e8', '#ffd58a', '#9ec9f5', '#c3e59a'];
  const spots = [];
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    const x = (c - 1) * 1.55, z = -0.7 + r * 1.35;
    mesh(new THREE.BoxGeometry(0.85, 0.03, 1.2), lam(MAT[(r * 3 + c) % MAT.length]), x, 0.02, z, mark, false);
    spots.push([x, z]);
  }
  // 講師鄔明清站在講台上帶動作
  const m = String(YOGA_WHO).match(TEACHER_RE);
  const teacher = figure(teacherMat, '', false, { scarf: '#2f6f73', glasses: true });
  teacher.scale.setScalar(1.45); teacher.position.set(0, 0.41, -2.7); teacher.userData.baseY = 0.41; mark.add(teacher);
  if (m) {
    const rec = { id: TEACHERS.length, key: 'yoga', fig: teacher, name: m[2], unit: m[1], title: m[3], topics: ['古典瑜伽（每堂課早上的第一堂）'] };
    teacher.userData.teacher = rec.id;
    teacher.traverse((o) => { if (o.isMesh) teacherHit.push(o); });
    TEACHERS.push(rec);
  }
  YOGA_POSES.push(teacher);
  // 墊子上示範的夥伴（乾道淡藍、坤道淡粉）
  spots.forEach(([x, z], i) => {
    if (i === 4) return;
    const kun = i % 2 === 1, f = figure(kun ? kunMat : qianMat, '', kun);
    f.scale.setScalar(1.25); f.position.set(x, 0.03, z + 0.1); f.userData.baseY = 0.03; mark.add(f);
    YOGA_POSES.push(f);
  });
}
/* ---------- 忠恕島：從全真島往好愛島的方向看過去的外海，比全真島大一點；參考忠恕道院的空拍與正面照 ----------
   前面是八層樓的忠恕道院大樓（米色磁磚、拱形藍綠玻璃窗、中間一整面玻璃帷幕、橘色琉璃瓦門廊與「忠恕道院」匾額、一對石獅），
   後面墊高的平台上是三層的宮殿式大殿（咖啡色廡殿頂、金色列柱），左邊是一座橘紅磚色的高塔（塔頂紅色小屋頂），前面有花園 */
const NEW_DIR = new THREE.Vector2(islands.c4.x, islands.c4.z).normalize();
const newIsl = makeIsland('newisle', 21, NEW_DIR.x * 118, NEW_DIR.y * 118, 'zhongshu');
{
  const g = newIsl.group;
  // 建築的正面跟六邊形的一條邊平行：把朝向鏡頭的角度對齊到最近的 60° 倍數（六邊形每條邊的法線方向）
  const mark = new THREE.Group(); mark.rotation.y = Math.round(faceCam(newIsl.x, newIsl.z) / (Math.PI / 3)) * (Math.PI / 3); g.add(mark);
  newIsl.mark = mark;
  const beige = lam('#d9cbb3'), white = lam('#f2efe8'), silver = lam('#c9ccd1'), maroon = lam('#7a3b34'), gold = lam('#d9a43a', { emissive: '#3a2500' });
  const tealGlass = lam('#4fa8a0', { emissive: '#0c2a28' });
  // 山坡：後面墊高一塊綠色平台給大殿，前面是廣場和花園
  // 山坡平台的平面形狀：原本的長方形在後面兩個角切掉，收在施工圍籬裡面（建築正面跟一條邊平行，所以後方兩側沿著斜邊切）
  const hillShape = new THREE.Shape([[-13, 4], [13, 4], [13, 11.1], [10.1, 16], [-10.1, 16], [-13, 11.1]].map(([x, y]) => new THREE.Vector2(x, y)));
  const hillGeo = (h) => new THREE.ExtrudeGeometry(hillShape, { depth: h, bevelEnabled: false }).rotateX(-Math.PI / 2);
  mesh(hillGeo(3.2), lam('#5f9a4e'), 0, 0, 0, mark);
  mesh(hillGeo(0.3), lam('#6fae58'), 0, 3.15, 0, mark);
  mesh(new THREE.BoxGeometry(14, 0.08, 9), lam('#d8d2c4'), 2, 0.04, 3.5, mark, false);
  // —— 忠恕道院大樓 ——
  const MB = new THREE.Group(); MB.position.set(2, 0, 1.5); mark.add(MB);
  const FL = 8, FH = 1.05, W = 9, D = 6, H = FL * FH;
  const front = canvasTex(512, 512, (c) => {
    c.fillStyle = '#d9cbb3'; c.fillRect(0, 0, 512, 512);
    c.strokeStyle = 'rgba(120, 100, 80, 0.12)'; for (let y = 0; y < 512; y += 8) { c.beginPath(); c.moveTo(0, y); c.lineTo(512, y); c.stroke(); }
    const cols = 7, rows = FL - 1, cw = 512 / cols, rh = (512 - 40) / rows;
    for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {

// 標籤避讓：依序擺放（全真島 → 課程島 → 外圈與下午島），會疊到前面標籤的就先藏起來
const placed = [];
// 標籤是疊在畫面最上層的 HTML，不會被 3D 物件擋住；
// 所以先算出瞭望氣球在畫面上佔的範圍，在氣球後面、又被它蓋到的標籤就先藏起來
const lookBox = new THREE.Box3(), boxPts = Array.from({ length: 8 }, () => new THREE.Vector3());
function balloonRect(w, h) {
  lookBox.setFromObject(lookout);
  let l = Infinity, r = -Infinity, tp = Infinity, b = -Infinity, near = Infinity;
  boxPts.forEach((v, i) => {
    v.set(i & 1 ? lookBox.max.x : lookBox.min.x, i & 2 ? lookBox.max.y : lookBox.min.y, i & 4 ? lookBox.max.z : lookBox.min.z);
    near = Math.min(near, v.distanceTo(camera.position));
    v.project(camera);
    const x = ((v.x + 1) / 2) * w, y = ((1 - v.y) / 2) * h;
    l = Math.min(l, x); r = Math.max(r, x); tp = Math.min(tp, y); b = Math.max(b, y);
  });
  // 外框比球皮大一圈，往內縮一點比較貼近實際的形狀
  const dx = (r - l) * 0.12, dy = (b - tp) * 0.04;
  return { l: l + dx, r: r - dx, t: tp + dy, b: b - dy, near };
}
function placeTags() {
  const w = innerWidth, h = innerHeight;
  placed.length = 0;
  const bal = balloonRect(w, h);
  for (const t of tags) {
    tmpV.set(t.isl.x, t.h, t.isl.z);
    const behind = t !== lookTag && tmpV.distanceTo(camera.position) > bal.near;
    tmpV.project(camera);
    let vis = tmpV.z < 1 && Math.abs(tmpV.x) < 1.1 && Math.abs(tmpV.y) < 1.1;
    const x = ((tmpV.x + 1) / 2) * w, y = ((1 - tmpV.y) / 2) * h;
    if (vis) {
      if (!t.w) { t.w = t.el.offsetWidth; t.hh = t.el.offsetHeight; }
      const r = { l: x - t.w / 2 - 2, r: x + t.w / 2 + 2, t: y - t.hh - 2, b: y + 2 };
      // 搜尋時符合的島一定要露出來，不參與避讓（但被氣球擋住時還是藏起來）
      if (behind && r.l < bal.r && r.r > bal.l && r.t < bal.b && r.b > bal.t) vis = false;
      else if (t.el.classList.contains('hit')) placed.push(r);
      else if (t.w && placed.some((o) => r.l < o.r && r.r > o.l && r.t < o.b && r.b > o.t)) vis = false;
      else if (t.w) placed.push(r);
    }
    t.el.style.visibility = vis ? 'visible' : 'hidden';
    if (vis) t.el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%)`;
  }
}

function syncCrowd(isl, n) {
  if (isl.crowd.length === n) return;
  clearWalkers(isl.crowd);
  for (let k = 0; k < n; k++) {

// 資訊卡和時光捲軸一次只展開一個
const dock = document.getElementById('dock');
const MOBILE_UI = matchMedia('(max-width: 720px)');
const brand = document.getElementById('brand');
let brandPeek = false;   // 資訊卡開著時，使用者自己把品牌卡展開
let brandFolded = false; // 沒開資訊卡時，使用者自己把品牌卡收起來（會記在這台裝置上）
try { brandFolded = localStorage.getItem('islands-brand-folded') === '1'; } catch (e) {}
let searching = false;   // 搜尋模式：鏡頭停在瞭望氣球旁邊，其他面板縮小
function setUI(next) {
  if (next.panel) panelMode = next.panel;
  if (next.panel === 'open' || panelMode === 'closed') brandPeek = false;
  if (next.brand != null) brandPeek = next.brand;
  // 點開島（資訊卡出現）時，左上角品牌卡自動收成小膠囊；資訊卡關掉就恢復
  const foldable = panelMode !== 'closed' || searching, mini = foldable ? !brandPeek || searching : brandFolded;
  brand.classList.toggle('foldable', foldable);
  brand.classList.toggle('brand-mini', mini);
  const bt = document.getElementById('brandToggle');
  bt.setAttribute('aria-expanded', String(!mini));
  bt.setAttribute('aria-label', mini ? '展開品牌卡' : '收合品牌卡');
  bt.title = mini ? '展開' : '收合';
  if (next.dock != null) dockOpen = next.dock;
  if (next.panel === 'open') dockOpen = false;
  if (next.dock === true && panelMode === 'open') panelMode = 'mini';
  panel.hidden = panelMode === 'closed';
  panel.classList.toggle('folded', panelMode === 'mini');
  const fold = document.getElementById('panelFold');
  fold.setAttribute('aria-expanded', String(panelMode === 'open'));
  fold.setAttribute('aria-label', panelMode === 'open' ? '收合資訊卡' : '展開資訊卡');
  fold.title = panelMode === 'open' ? '收合' : '展開';
  dock.dataset.open = String(dockOpen);
  document.getElementById('dockChip').setAttribute('aria-expanded', String(dockOpen));
  // 手機上資訊卡展開時，時光捲軸先讓位
  dock.hidden = MOBILE_UI.matches && panelMode === 'open';
  requestAnimationFrame(measureFree);
}
// 開著資訊卡時：暫時展開／收回；沒開資訊卡時：自己決定要不要收起來，並記住
function toggleBrand(open) {
  if (brand.classList.contains('foldable')) { setUI({ brand: open }); return; }
  brandFolded = !open;
  try { localStorage.setItem('islands-brand-folded', brandFolded ? '1' : '0'); } catch (e) {}
  setUI({});
}
document.getElementById('brandToggle').onclick = (e) => { e.stopPropagation(); toggleBrand(brand.classList.contains('brand-mini')); };
brand.addEventListener('click', (e) => { if (brand.classList.contains('brand-mini') && !e.target.closest('a')) toggleBrand(true); });
document.getElementById('panelFold').onclick = () => setUI({ panel: panelMode === 'open' ? 'mini' : 'open' });
document.getElementById('panelMini').onclick = () => setUI({ panel: 'open' });
document.getElementById('panelClose').onclick = () => setUI({ panel: 'closed' });
document.getElementById('dockChip').onclick = () => setUI({ dock: true });
document.getElementById('dockFold').onclick = () => setUI({ dock: false });
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || searching) return;
  if (dockOpen) setUI({ dock: false });
  else if (panelMode !== 'closed') setUI({ panel: 'closed' });
});
MOBILE_UI.addEventListener('change', () => setUI({}));

// 鏡頭的取景中心對準「沒被卡片擋住的那一塊」，島就不會躲在資訊卡後面
const view = { x: 0, y: 0, tx: 0, ty: 0 };
function measureFree() {
  const W = innerWidth, H = innerHeight;
  let right = W, top = 0, bottom = H;
  if (searching) {
    // 搜尋時資訊卡已經縮起來，改成避開搜尋面板
    if (!searchPop.hidden) {
      const r = searchPop.getBoundingClientRect();
      if (MOBILE_UI.matches) top = r.bottom + 4; else right = r.left - 8;
    }
    if (!dock.hidden) bottom = Math.min(bottom, dock.getBoundingClientRect().top - 8);
    view.tx = W / 2 - right / 2;
    view.ty = H / 2 - (top + bottom) / 2;
    return;
  }
  if (panelMode === 'open') {
    const r = panel.getBoundingClientRect();
    if (r.left > W * 0.4 && r.top < H * 0.5) right = r.left - 8;
    else bottom = Math.min(bottom, r.top - 8);
  } else if (panelMode === 'mini' && MOBILE_UI.matches) bottom = Math.min(bottom, panel.getBoundingClientRect().top - 8);
  if (!dock.hidden) bottom = Math.min(bottom, dock.getBoundingClientRect().top - 8);
  if (MOBILE_UI.matches) top = document.querySelector('.brand').getBoundingClientRect().bottom + 4;
  view.tx = W / 2 - right / 2;
  view.ty = H / 2 - (top + bottom) / 2;
  document.documentElement.style.setProperty('--dock-h', (dock.hidden ? 0 : dock.offsetHeight) + 'px');
}
new ResizeObserver(() => measureFree()).observe(panel);
new ResizeObserver(() => measureFree()).observe(dock);
new ResizeObserver(() => measureFree()).observe(brand);
function applyView(k) {
  const nx = view.x + (view.tx - view.x) * k, ny = view.y + (view.ty - view.y) * k;
  if (Math.abs(nx - view.x) < 0.05 && Math.abs(ny - view.y) < 0.05 && k < 1) return;
  view.x = nx; view.y = ny;
  camera.setViewOffset(innerWidth, innerHeight, view.x, view.y, innerWidth, innerHeight);
  // 微縮鏡頭的清楚帶也跟著移到島的位置
  hTilt.uniforms.r.value = vTilt.uniforms.r.value = 0.5 + view.y / innerHeight;
}

/* =========================================================
   鏡頭：點島飛過去
   ========================================================= */
let tween = null;
// arc：飛行路線中段往上拱多高（數字），或往哪個方向繞（向量），避免直線穿過建築物或氣球
// swirl：繞著目標轉進去——方位角、距離、高度分開內插，鏡頭一邊靠近一邊繞著島轉
function flyTo(target, pos, dur = 1.2, then = null, arc = 0, swirl = false) {
  tween = { t: 0, dur, ft: controls.target.clone(), fp: camera.position.clone(), tt: target, tp: pos, then, arc };
  if (swirl) {
    const a = tween.fp.clone().sub(tween.ft), b = pos.clone().sub(target);
    const az0 = Math.atan2(a.x, a.z);
    let dAz = Math.atan2(b.x, b.z) - az0;
    dAz = Math.atan2(Math.sin(dAz), Math.cos(dAz));
    tween.swirl = { az0, dAz, r0: Math.hypot(a.x, a.z), r1: Math.hypot(b.x, b.z), h0: a.y, h1: b.y };
  }
  controls.autoRotate = false;
  return tween;
}
// 到了島上之後，鏡頭繞著這座島慢慢轉；使用者一碰畫面就停
const ISLE_ORBIT = 0.5;
function orbitIsland() { controls.autoRotate = true; controls.autoRotateSpeed = ISLE_ORBIT; }
// sel 可以是島（'g3'）、某一位幹部（'m:12'）或廣場上的學員（'p:3'）；鏡頭已經在那座島上就不動
function select(key, sel = key) {
  const isl = islands[key];
  // 再點一次同一個人：重新來一次（何珈貞會再飛一次）
  if (sel === selected && panelMode !== 'closed') for (const f of figuresFor(sel)) if (f.userData.onFocus) f.userData.focusT = null;
  const stay = controls.target.distanceTo(new THREE.Vector3(isl.x, 1.5, isl.z)) < 1;
  selected = sel;
  setUI({ panel: 'open' });
  if (!stay) {
    const t = new THREE.Vector3(isl.x, 1.5, isl.z);
    const dist = isl.R * 3.4 + 12;
    const dirV = camera.position.clone().sub(controls.target).setY(0).normalize();
    if (dirV.lengthSq() < 0.01) dirV.set(0.6, 0, 0.8);
    // 俯角約 26 度：比較像站在旁邊看，不會有從高處往下壓的感覺
    const p = t.clone().add(dirV.multiplyScalar(dist * 0.88)).setY(dist * 0.43 + 2);
    if (innerWidth < innerHeight) p.sub(t).multiplyScalar(1.35).add(t);
    // 終點再繞島轉 35 度，飛過去時就是一邊靠近、一邊繞著島轉進來；轉的方向跟之後慢慢環繞的方向一樣
    p.sub(t).applyAxisAngle(new THREE.Vector3(0, 1, 0), -0.6).add(t);
    flyTo(t, p, 1.7, () => { if (islandOf2(selected) === key && panelMode !== 'closed' && !reduceMotion) orbitIsland(); }, 0, true);
  }

}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downXY = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downXY = [e.clientX, e.clientY]; if (tween) tween = null; controls.autoRotate = false; });
// 滑鼠移到幹部小人偶上，游標變成手指
let hoverQueued = false;
renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse' || e.buttons || hoverQueued) return;
  hoverQueued = true;
  requestAnimationFrame(() => {
    hoverQueued = false;
    ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    renderer.domElement.style.cursor = ray.intersectObjects(cadreHit.concat(plazaHit, raftHit, partyHit, lookoutHit, teacherHit, masterHit, bottleHit, visitorHit), false).length ? 'pointer' : '';

renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downXY || Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]) > 6) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  // 先打到任何物件，再往上找它屬於哪座島
  if (ray.intersectObjects(raftHit, false).length) { openSignup(); return; }
  // 中一島的涼亭＝凝聚晚會報名處：報名期間點了開報名表，截止後就打開中一島的介紹
  if (ray.intersectObjects(partyHit, false).length) { if (zyIsl.formOpen) window.open(PARTY_FORM, '_blank', 'noopener'); else select('zhongyi'); return; }
  const bh = ray.intersectObjects(bottleHit, false)[0];
  if (bh) { const i = bh.object.userData.bottle; select('bottle', i >= 0 ? 'b:' + i : 'bottle'); return; }
  if (!searching && ray.intersectObjects(lookoutHit, false).length) { openSearch(); return; }
  const hit = ray.intersectObjects(Object.values(islands).map((i) => i.group), true)[0];
  // 點到海面：收起資訊卡和時光捲軸，把畫面還給群島
  if (!hit) { setUI({ panel: 'closed', dock: false }); return; }
  let o = hit.object;
  for (let f = o; f; f = f.parent) {
    const u = f.userData || {};
    if (u.slot != null) { select(u.at || SLOTS[u.slot].key, 'm:' + u.slot); return; }
    if (u.person != null && u.person >= 0) { select(homeOf(realPeople[u.person]), 'p:' + u.person); return; }

    if (u.master != null) { select('temple', 'd:' + u.master); return; }
  }
  while (o && !Object.values(islands).some((i) => i.group === o)) o = o.parent;
  const isl = o && Object.values(islands).find((i) => i.group === o);
  if (isl) select(isl.key);
});

  MASTERS.forEach((m, i) => {
    const byName = norm(m.name).includes(n) || n.includes(norm(m.name));
    if (!byName && !anyMaster) return;
    if (!byName && (n.includes(norm('坤道')) && m.g !== '坤道' || n.includes(norm('乾道')) && m.g !== '乾道')) return;

  if (!f) return;

function toDate(v) {
  if (!v) return null;
  let m = String(v).match(/Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)/);
  if (m) return new Date(+m[1], +m[2], +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
  m = String(v).match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})(?:\s*(上午|下午)?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (!m) return null;
  let h = +(m[5] || 0);
  if (m[4] === '下午' && h < 12) h += 12;
  if (m[4] === '上午' && h === 12) h = 0;
  return new Date(+m[1], +m[2] - 1, +m[3], h, +(m[6] || 0), +(m[7] || 0));
}

  if (id.startsWith('p:')) return plazaPeople.concat(visitorPeople).filter((f) => f.userData.person === +id.slice(2));
  if (id.startsWith('t:')) return [TEACHERS[+id.slice(2)].fig];
  if (id.startsWith('d:')) return [MASTERS[+id.slice(2)].fig];
  return [];
}
// 被點到（或搜尋到）的人偶：轉身面向鏡頭，舉起右手揮一揮，揮完放下、繼續看著鏡頭
const waveTmp = new THREE.Vector3(), waveCam = new THREE.Vector3();
function poseFocus(f, t) {
  const u = f.userData;
  if (u.focusT == null) u.focusT = t;
  f.getWorldPosition(waveTmp);
  waveCam.set(camera.position.x, waveTmp.y, camera.position.z);
  f.lookAt(waveCam);
  let e = t - u.focusT;
  // 有自己的「被點到」特技的人偶（何珈貞起飛）：特技做完才接著揮手
  if (u.onFocus) { const left = u.onFocus(f, e, t); if (left == null) return; e = left; }
  f.position.y = u.baseY || 0;
  const [, right] = u.arms || [];
  if (!right) return;
  // 拋球、拉拉炮的人先把右手放回身側再揮手
  right.rotation.x = 0;
  // 前 0.3 秒舉手、接著左右揮 2 秒、最後 0.4 秒放下
  const up = reduceMotion ? 1 : Math.min(1, e / 0.3) * Math.min(1, Math.max(0, (2.7 - e) / 0.4));
  right.rotation.z = ARM_REST + up * (1.25 + (reduceMotion ? 0 : 0.35 * Math.sin(e * 11)));
}
function unfocus(f) {
  const u = f.userData;
  u.focusT = null;
  if (u.restRotY != null) f.rotation.y = u.restRotY;
  if (u.arms) u.arms[1].rotation.z = u.armRestZ ?? ARM_REST;
  if (u.armRestX != null && u.arms) u.arms[1].rotation.x = u.armRestX;
}
function updateHighlight(t) {
  const want = panelMode === 'closed' ? [] : figuresFor(selected);
  for (const f of hiFigs) if (!want.includes(f)) unfocus(f);
  hiFigs = want;
  want.forEach((f, i) => {
    poseFocus(f, t);
    let ring = ringPool[i];
    if (!ring) {
      const mat = new THREE.MeshBasicMaterial({ color: HI_COLOR, transparent: true, depthWrite: false });
      ring = new THREE.Group();
      const halo = new THREE.Mesh(ringGeo, mat); halo.rotation.x = Math.PI / 2; halo.userData.ring = true;
      const gem = new THREE.Mesh(gemGeo, mat); gem.userData.ring = true;
      ring.add(halo, gem);
      ring.userData = { ring: true, halo, gem, mat };
      ringPool[i] = ring;
    }
    if (ring.parent !== f) f.add(ring);
    const r = ring.userData;
    r.halo.position.y = 0.03;
    r.halo.scale.setScalar(1 + 0.12 * Math.sin(t * 4));
    r.gem.position.y = 1.35 + 0.08 * Math.sin(t * 3);
    r.gem.rotation.y = t * 2;
    r.mat.opacity = 0.65 + 0.3 * Math.sin(t * 4);
  });
  for (let i = want.length; i < ringPool.length; i++) if (ringPool[i].parent) ringPool[i].parent.remove(ringPool[i]);
}

const clock = new THREE.Clock();
// 夜晚的海是柔和的灰藍紫，不是黑壓壓的深藍
const WATER_DAY = new THREE.Color(C.water), WATER_NIGHT = new THREE.Color('#5a6190');
const SUN_DAY = new THREE.Color('#fff1d6'), SUN_NIGHT = new THREE.Color('#9fb3ff');
// 霞光：日出粉橘、夕陽金橘，天色暗下來時轉成黃昏的紫
const WARM_AM = new THREE.Color('#ffc4a6'), WARM_PM = new THREE.Color('#ffb066'), DUSK = new THREE.Color('#b083c4'), SUN_WARM = new THREE.Color('#ff9d52');
// 海不直接混橘色（會變灰），改往粉紫、藍紫偏
const SEA_AM = new THREE.Color('#b9b2ea'), SEA_PM = new THREE.Color('#86aee0'), SEA_DUSK = new THREE.Color('#7b6db4');
const HEMI_DAY = new THREE.Color('#fff6e6');
const warmC = new THREE.Color(), seaC = new THREE.Color();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
/* ---------- 靜態合併：島上不會動的東西（建築、樹、橋、欄杆、地面⋯）合併成少數幾塊一起畫 ----------
   開場後先觀察 10 秒，位置、顯示狀態都沒變過的才合併；人偶、會點的東西、會跟著日期變的花都不碰。
   原本要畫四千多次的場景，合併後少掉一大半，手機（例如 iPhone）會順很多 */
const NO_MERGE_KEYS = ['ring', 'arms', 'slot', 'person', 'teacher', 'master', 'bottle', 'noMerge', 'detail'];
function staticMerge() {
  const hits = new Set([cadreHit, plazaHit, raftHit, partyHit, lookoutHit, teacherHit, masterHit, bottleHit, visitorHit].flat());
  const visChain = (o) => { for (let x = o; x; x = x.parent) if (!x.visible) return false; return true; };
  const cand = [];
  scene.traverse((o) => {
    if (!o.isMesh || o.isInstancedMesh || o.isSkinnedMesh || hits.has(o)) return;
    const m = o.material;
    if (Array.isArray(m) || m.transparent || m.map || !o.geometry.attributes.position) return;
    for (let x = o; x; x = x.parent) if (x.userData && NO_MERGE_KEYS.some((k) => x.userData[k] != null && x.userData[k] !== false)) return;
    cand.push({ o, mw: o.matrixWorld.clone(), vis: visChain(o), parent: o.parent, moved: false });
  });
  let n = 0;
  const timer = setInterval(() => {
    for (const c of cand) if (!c.moved && (c.o.parent !== c.parent || !c.o.matrixWorld.equals(c.mw) || visChain(c.o) !== c.vis)) c.moved = true;
    if (++n < 20) return;
    clearInterval(timer);
    const mutable = new Set([...glowMats.map((g) => g.mat), ...nightFacades]);
    const matKey = (m) => (mutable.has(m) || (m.emissive && m.emissive.getHex() !== 0) ? m.uuid
      : [m.type, m.color && m.color.getHex(), m.side, m.flatShading, m.fog].join('|'));
    const buckets = new Map();
    for (const c of cand) {
      if (c.moved || !c.vis || c.o.matrixWorld.determinant() < 0) continue;
      const home = islOf(c.o)?.group || scene;
      const key = home.id + '|' + matKey(c.o.material) + '|' + c.o.castShadow + '|' + c.o.receiveShadow;
      if (!buckets.has(key)) buckets.set(key, { home, list: [] });
      buckets.get(key).list.push(c.o);
    }
    let before = 0, after = 0;
    for (const { home, list } of buckets.values()) {
      if (list.length < 2) continue;
      home.updateMatrixWorld(true);
      const inv = home.matrixWorld.clone().invert();
      const geos = list.map((o) => {
        let g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
        for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
        if (!g.attributes.normal) g.computeVertexNormals();
        g.morphAttributes = {};
        return g.applyMatrix4(inv.clone().multiply(o.matrixWorld));
      });
      const merged = mergeGeometries(geos, false);
      geos.forEach((g) => g.dispose());
      if (!merged) continue;
      const mm = new THREE.Mesh(merged, list[0].material);
      mm.castShadow = list[0].castShadow; mm.receiveShadow = list[0].receiveShadow;
      mm.userData.merged = true;
      home.add(mm);
      for (const o of list) o.parent.remove(o);
      before += list.length; after++;
    }
    renderer.shadowMap.needsUpdate = true;
    console.info(`全真群島：靜態合併 ${before} 個物件 → ${after} 塊`);
  }, 500);
}
setTimeout(staticMerge, 1500);
/* ---------- 依實際順暢度自動調畫質：開場 14 秒後（靜態合併完）量 4 秒，每秒不到 40 格就降一級，最多兩級；
   只動畫質（解析度、移軸景深），人偶、動作、可以點的東西都不變；電腦和順的手機維持原樣 ---------- */
const Q_STEPS = [
  () => { const pr = Math.min(devicePixelRatio, MOBILE ? 1.15 : 1.4); renderer.setPixelRatio(pr); composer.setPixelRatio(pr); },
  () => { renderer.setPixelRatio(1); composer.setPixelRatio(1); hTilt.enabled = vTilt.enabled = false; },
];
let qLevel = 0, fpsFrom = 0, fpsFrames = 0;
function watchFps(t, rawDt) {
  if (qLevel >= Q_STEPS.length || t < 14) return;
  if (document.hidden || rawDt > 0.5) { fpsFrom = 0; return; }   // 切到背景、卡一下就重新量，不算數
  if (!fpsFrom) { fpsFrom = t; fpsFrames = 0; return; }
  fpsFrames++;
  if (t - fpsFrom < 4) return;
  const fps = fpsFrames / (t - fpsFrom);
  fpsFrom = 0;
  if (fps < 40) { Q_STEPS[qLevel++](); console.info(`全真群島：每秒 ${fps.toFixed(0)} 格，畫質降到第 ${qLevel} 級`); }
}
// 手機上影子每 3 幀更新一次（影子要把整個場景再畫一遍，最吃效能）
renderer.shadowMap.autoUpdate = false;
let frameN = 0;
// 平移的範圍：最外圍那座島再往外留一點海
const PAN_LIMIT = Math.max(...Object.values(islands).map((i) => Math.hypot(i.x, i.z))) + 30;
function tick() {
  const rawDt = clock.getDelta(), dt = Math.min(rawDt, 0.05), t = clock.elapsedTime;

  // 晝夜 0.6 秒線性切換，和網站主題一致
  const stepN = dt / 0.6;
  nightT = nightT < nightTarget ? Math.min(nightTarget, nightT + stepN) : Math.max(nightTarget, nightT - stepN);
  warmT = warmT < warmTarget ? Math.min(warmTarget, warmT + stepN) : Math.max(warmTarget, warmT - stepN);
  if (skyAM) { warmC.copy(WARM_AM); seaC.copy(SEA_AM); } else { warmC.copy(WARM_PM).lerp(DUSK, nightT); seaC.copy(SEA_PM).lerp(SEA_DUSK, nightT); }
  scene.background.copy(DAY_BG).lerp(NIGHT_BG, nightT).lerp(warmC, warmT * 0.8);
  scene.fog.color.copy(scene.background);
  water.material.color.copy(WATER_DAY).lerp(WATER_NIGHT, nightT).lerp(seaC, warmT * 0.65);
  hemi.intensity = 1.6 - 0.95 * nightT - 0.2 * warmT;
  hemi.color.copy(HEMI_DAY).lerp(warmC, warmT * 0.55);
  sun.intensity = 2.4 - 1.75 * nightT;
  sun.color.copy(SUN_DAY).lerp(SUN_NIGHT, nightT).lerp(SUN_WARM, warmT * 0.9);
  // 日出、夕陽時太陽壓低，影子拉長；早上從右邊照過來，傍晚從左邊
  sun.position.set(60 + ((skyAM ? 110 : -130) - 60) * warmT, 110 - 70 * warmT, 50);
  for (const m of nightFacades) m.emissiveIntensity = nightT * 1.1;
  for (const g of glowMats) g.mat.emissiveIntensity = g.base + (g.night - g.base) * nightT;
  for (const l of lampLights) l.intensity = nightT * 6;

  updateViewFrustum();
  watchFps(t, rawDt);
  if (++frameN % (MOBILE ? 3 : 1) === 0) renderer.shadowMap.needsUpdate = true;
  if (!reduceMotion) for (const a of animators) a(t);
  audioTick();
  updateHighlight(t);

  nextTrain -= dt;
  if (nextTrain <= 0) { spawnTrain(); nextTrain = 6 + Math.random() * 14; }
  for (let i = trains.length - 1; i >= 0; i--) {
    const tr = trains[i], d = tr.userData.dir;
    tr.position.x += d * tr.userData.speed * dt;
    if (d * tr.position.x > VL / 2 + tr.userData.len) { viaduct.remove(tr); trains.splice(i, 1); stopTrainSound(tr); }
    else tr.visible = Math.abs(tr.position.x) < VL / 2 + 2;
  }

  for (const p of walkers) {
    const u = p.userData;
    const full = u.grow || 1;
    if (p.scale.x < full) p.scale.setScalar(Math.min(full, p.scale.x + dt * 3));
    if (reduceMotion || u.focusT != null || (u.hold && u.hold > t) || offscreen(p)) continue;   // 不在畫面裡先不動；被點到（或正在拍肩、擦汗）的人偶站好，不走動
    p.position.y = Math.abs(Math.sin(t * 3 * u.speed + u.phase)) * 0.08;
    p.position.x = u.home.x + Math.sin(t * 0.3 * u.speed + u.phase) * u.roam;
    p.rotation.y = Math.cos(t * 0.3 * u.speed + u.phase) > 0 ? Math.PI / 2 : -Math.PI / 2;
  }

  if (tween) {
    tween.t += Math.min(rawDt, 0.25) / tween.dur;
    const k = ease(Math.min(1, tween.t));
    controls.target.lerpVectors(tween.ft, tween.tt, k);
    if (tween.swirl) {
      const w = tween.swirl, az = w.az0 + w.dAz * k, r = w.r0 + (w.r1 - w.r0) * k;
      camera.position.set(controls.target.x + Math.sin(az) * r, controls.target.y + w.h0 + (w.h1 - w.h0) * k, controls.target.z + Math.cos(az) * r);
    } else camera.position.lerpVectors(tween.fp, tween.tp, k);
    if (tween.arc) {
      if (tween.arc.isVector3) camera.position.addScaledVector(tween.arc, Math.sin(k * Math.PI));
      else camera.position.y += Math.sin(k * Math.PI) * tween.arc;
    }
    if (tween.t >= 1) { const then = tween.then; tween = null; if (then) then(); }
  }
  applyView(1 - Math.exp(-rawDt * 6));
  controls.update();
  // 平移不能拖出群島範圍：視線中心離群島中心太遠就拉回來（鏡頭跟著一起移）
  const off = Math.hypot(controls.target.x, controls.target.z);
  if (off > PAN_LIMIT) {
    const k = PAN_LIMIT / off;
    const dx = controls.target.x * (k - 1), dz = controls.target.z * (k - 1);
    controls.target.x += dx; controls.target.z += dz;
    camera.position.x += dx; camera.position.z += dz;
  }
  composer.render();
  placeTags();
  requestAnimationFrame(tick);
}
tick();

// 網址帶 #島代號（例如 islands/#c5）就直接打開那座島；小遊戲結尾的「回到全真群島」用這個
// 講師專屬連結：#t-拼音（例如 #t-wu-mingqing）直接飛到那位講師身邊，他會轉身揮手
const TEACHER_SLUG = { 鄭名翔: 'zheng-mingxiang', 鄔明清: 'wu-mingqing', 楊峰誌: 'yang-fengzhi', 林鈺蓉: 'lin-yurong', 李寶莉: 'li-baoli',
  朱宸慧: 'zhu-chenhui', 何珈貞: 'he-jiazhen', 林信宏: 'lin-xinhong', 何思諺: 'he-siyan', 蘇毓婷: 'su-yuting' };
function openFromHash() {
  const key = decodeURIComponent(location.hash.slice(1));
  if (islands[key]) { select(key); return; }
  if (key.startsWith('t-')) {
    const name = Object.keys(TEACHER_SLUG).find((n) => TEACHER_SLUG[n] === key.slice(2));
    // 同一位講師在好幾座島上課時，優先帶到瑜伽島（每堂課的第一堂）
    const t = TEACHERS.filter((x) => x.name === name).sort((a, b) => (b.key === 'yoga') - (a.key === 'yoga'))[0];
    if (t) { select(t.key, 't:' + t.id); focusFigure('t:' + t.id); }
  }
}
openFromHash();
addEventListener('hashchange', openFromHash);
</script>
</body>
