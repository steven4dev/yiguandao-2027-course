  @media (max-width: 720px) {
    .brand h1 { font-size: 22px; }

    .panel { top: auto; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto;
      bottom: calc(150px + env(safe-area-inset-bottom, 0px)); max-height: 42%; }

  @media (prefers-reduced-motion: reduce) { body, .card { transition: none; } }

<script type="module">
import * as THREE from 'three';

/* =========================================================

   ========================================================= */
// 2027 年度課程（取自 2027.ics）
const COURSES = [
  { key: 'c1', date: '2027-03-27', name: '好好玩', sub: '重新找回生活的樂趣', mark: 'carousel', prog: [['上午', '開班／幹部介紹'], ['觀點分享', '天定 鄭名翔 講師'], ['下午活動', '迎新聯誼（活動組）']] },
  { key: 'c2', date: '2027-04-24', name: '好好賺', sub: '不一定要有錢，先學會理財', mark: 'piggy', prog: [['古典瑜伽', '全真 鄔明清 講師'], ['觀點分享', '全真 楊峰誌 助理'], ['下午活動', '藝術氣球（全真 林鈺蓉 講師）']] },
  { key: 'c3', date: '2027-05-29', name: '戶外聯誼', sub: '一起出去走走、認識新朋友', mark: 'camp', prog: [['全天', '戶外聯誼活動']] },
  { key: 'c4', date: '2027-06-26', name: '好好愛', sub: '喜歡別人之前，先搞懂自己', mark: 'heart', prog: [['古典瑜伽', '全真 鄔明清 講師'], ['觀點分享', '天曉 李寶莉 講師'], ['下午活動', '生命靈數（全真 朱宸慧 講師）']] },
  { key: 'c5', date: '2027-08-28', name: '新道親法會', sub: '志工陪伴體驗', mark: 'lotus', prog: [['全天', '新道親法會－志工陪伴體驗']] },
  { key: 'c6', date: '2027-10-02', name: '人生重開機', sub: '人生卡關的時候，你會怎麼辦', mark: 'windmill', prog: [['古典瑜伽', '全真 鄔明清 講師'], ['觀點分享', '全真 何珈貞 講師'], ['下午活動', 'V·翻轉後的人生（天曉 林信宏 講師）']] },
  { key: 'c7', date: '2027-10-30', name: '戶外聯誼', sub: '秋天的第二次出遊', mark: 'camp2', prog: [['全天', '戶外聯誼活動']] },
  { key: 'c8', date: '2027-11-27', name: '出去走走', sub: '世界這麼大，別只活在自己的日常', mark: 'balloon', prog: [['古典瑜伽', '全真 鄔明清 講師'], ['觀點分享', '全真 何思諺 講師'], ['下午活動', '蔬食料理王（啟化 蘇毓婷 講師）']] },
  { key: 'c9', date: '2027-12-25', name: '活成自己喜歡的樣子', sub: '人生不是交作業', mark: 'tree', prog: [['古典瑜伽', '全真 鄔明清 講師'], ['觀點分享', '全真 鄔明清 講師'], ['下午活動', '結班聯誼']] },
];

// 2027 年度幹部（跟 signup/index.html 的 CADRE_GROUPS、首頁「同行夥伴」一致，人事異動時要一起改）
// 姓名只用來比對報名表，比對完就丟掉，畫面上只顯示各組人數
const CADRE_GROUPS = [
  { group: '班務團隊', members: ['周逸翔', '何珈貞', '羅健洲'] },
  { group: '人事組', members: ['賴美芸', '林鈺蓉', '楊舒涵'] },
  { group: '公關禮節組', members: ['林詩涵', '陳幸梅', '陳曉璇', '林淑真'] },
  { group: '學術組', members: ['楊雅雲', '王冠博', '鄭燕玲'] },
  { group: '輔導組', members: ['陳彥名'] },
  { group: '總務組', members: ['張立人', '林淑梅', '許麗娟', '張馨予', '張如靈', '張懿文', '王志賢', '李書承'] },
  { group: '影音組', members: ['王冠博', '卓子翔', '陳熙宗'] },
  { group: '活動組', members: ['周能安', '許瀚升', '張哲瑋', '王欣渝', '林禹青'] },
];
const CADRE_LOOK = {
  班務團隊: ['hall', '#c0503f', '市政廳'], 人事組: ['post', '#3f8a6a', '郵局'], 公關禮節組: ['arch', '#d9774a', '迎賓牌樓'], 學術組: ['library', '#5b6fa8', '圖書館'],
  輔導組: ['lighthouse', '#e0a03a', '燈塔'], 總務組: ['barn', '#8f5f3c', '倉庫'], 影音組: ['tower', '#7a5aa6', '電視塔'], 活動組: ['bigtop', '#d2566a', '大帳篷'],
};
const CADRE = CADRE_GROUPS.map(({ group, members }, i) => {
  const [mark, color, what] = CADRE_LOOK[group];
  return { key: 'g' + (i + 1), group, size: members.length, mark, color, what };
});
// 同一人身兼多組時，每一組都算
const CADRE_OF = new Map();
CADRE_GROUPS.forEach(({ group, members }) => members.forEach((n) => CADRE_OF.set(n, [...(CADRE_OF.get(n) || []), group])));

// 報名資料備份（signup/data.json 2026/10/24 版本，只保留畫面需要的欄位，不含姓名）
const SNAPSHOT = {
  updated: '2026-10-25T01:06:27.952Z',
  people: [
    { g: '坤道', city: '桃園市', unit: '天選區', isCadre: true, cadre: ['公關禮節組'], date: '2026-10-24' },
    { g: '乾道', city: '桃園市', unit: '至善區', isCadre: false, cadre: [], date: '2026-10-24' },
    { g: '乾道', city: '新北市', unit: '天選區', isCadre: true, cadre: ['班務團隊'], date: '2026-10-24' },
    { g: '坤道', city: '新北市', unit: '天選區', isCadre: true, cadre: ['班務團隊'], date: '2026-10-24' },
  ],
};
const GAMES = { start: null, finish: null, share: null };

// 示範資料：60 位學員＋全部幹部，報名日期分散到開班前（固定種子，每次一樣）
function demoPeople() {
  let s = 20270327;
  const rnd = () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
  const start = new Date('2026-10-24').getTime(), span = new Date('2027-03-20').getTime() - start;
  const day = (r) => new Date(start + Math.pow(r, 1.6) * span).toISOString().slice(0, 10);
  const out = [];
  for (let i = 0; i < 60; i++) out.push({ g: rnd() < 0.55 ? '坤道' : '乾道', city: ['桃園市', '桃園市', '新北市', '臺北市'][Math.floor(rnd() * 4)],
    unit: ['天選區', '至善區', '至善區', '其他單位'][Math.floor(rnd() * 4)], isCadre: false, cadre: [], date: day(rnd()) });
  CADRE.forEach((c) => { for (let i = 0; i < c.size; i++) out.push({ g: rnd() < 0.5 ? '坤道' : '乾道', city: '桃園市', unit: '天選區', isCadre: true, cadre: [c.group], date: day(rnd() * 0.5) }); });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

let realPeople = SNAPSHOT.people, dataStamp = SNAPSHOT.updated, demo = false;
const peopleNow = () => (demo ? DEMO : realPeople);
const DEMO = demoPeople();

/* =========================================================
   場景
   ========================================================= */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
const MOBILE = Math.min(innerWidth, innerHeight) < 600;
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const DAY_BG = new THREE.Color('#efe6d2'), NIGHT_BG = new THREE.Color('#1c2740');
scene.background = DAY_BG.clone();
scene.fog = new THREE.Fog(DAY_BG.clone(), 260, 520);

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 1, 900);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;
controls.minDistance = 16;
controls.maxDistance = 360;
controls.maxPolarAngle = Math.PI * 0.45;
controls.screenSpacePanning = false;

const HOME = { target: new THREE.Vector3(0, 2, 6), pos: new THREE.Vector3(118, 112, 168) };
if (innerWidth < innerHeight) HOME.pos.multiplyScalar(1.55);
camera.position.copy(HOME.pos);
controls.target.copy(HOME.target);

const hemi = new THREE.HemisphereLight('#fff6e6', '#b9a27f', 1.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff1d6', 2.4);
sun.position.set(60, 110, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(MOBILE ? 2048 : 4096, MOBILE ? 2048 : 4096);
Object.assign(sun.shadow.camera, { left: -110, right: 110, top: 110, bottom: -110, near: 1, far: 320 });
sun.shadow.bias = -0.0006;

const nightFacades = [];
function facade(widthU, floors, { round = false, door = false, floorH = 1 } = {}) {
  const PX = 56, W = Math.round(widthU * PX), H = Math.round(floors * floorH * PX), wins = [];
  for (let f = 0; f < floors; f++) {
    const top = (floors - f - 1) * floorH * PX, step = 1.3, n = Math.max(1, Math.floor((widthU - 0.6) / step));
    const start = (widthU - n * step) / 2 + (step - 0.9) / 2;
    for (let i = 0; i < n; i++) {
      const x = (start + i * step) * PX, isEdge = i === 0 || i === n - 1;
      if (door && f === 0 && Math.abs(x / PX + 0.45 - widthU / 2) < 1.4) continue;
      if (round && isEdge && f > 0) wins.push({ kind: 'round', cx: x + 0.45 * PX, cy: top + floorH * PX * 0.45, r: 0.28 * PX });
      else wins.push({ kind: 'rect', x, y: top + floorH * PX * 0.2, w: 0.9 * PX, h: floorH * PX * 0.52 });
    }
  }
  if (door) wins.push({ kind: 'door', x: (widthU / 2 - 1.2) * PX, y: (floors - 1) * floorH * PX + floorH * PX * 0.18, w: 2.4 * PX, h: floorH * PX * 0.82 });
  const map = canvasTex(W, H, (g) => {
    g.fillStyle = C.wall; g.fillRect(0, 0, W, H);
    g.globalAlpha = 0.08;
    for (let i = 0; i < 700; i++) { g.fillStyle = i % 2 ? '#000' : '#fff'; g.fillRect(Math.random() * W, Math.random() * H, 3, 2); }
    g.globalAlpha = 1;
    for (let f = 0; f < floors; f++) { g.fillStyle = C.wallDark; g.fillRect(0, (floors - f) * floorH * PX - 5, W, 5); }
    for (const w of wins) {
      if (w.kind === 'round') {
        g.fillStyle = C.frame; g.beginPath(); g.arc(w.cx, w.cy, w.r + 5, 0, 7); g.fill();
        g.fillStyle = C.glass; g.beginPath(); g.arc(w.cx, w.cy, w.r, 0, 7); g.fill();
        g.strokeStyle = C.frame; g.lineWidth = 3; g.beginPath();
        g.moveTo(w.cx - w.r, w.cy); g.lineTo(w.cx + w.r, w.cy); g.moveTo(w.cx, w.cy - w.r); g.lineTo(w.cx, w.cy + w.r); g.stroke();
      } else {
        g.fillStyle = C.frame; g.fillRect(w.x - 4, w.y - 4, w.w + 8, w.h + 8);
        g.fillStyle = w.kind === 'door' ? '#2c2622' : C.glass; g.fillRect(w.x, w.y, w.w, w.h);
        g.strokeStyle = C.frame; g.lineWidth = 3;
        const cols = w.kind === 'door' ? 4 : 3;
        for (let c = 1; c < cols; c++) { g.beginPath(); g.moveTo(w.x + (w.w * c) / cols, w.y); g.lineTo(w.x + (w.w * c) / cols, w.y + w.h); g.stroke(); }
        g.beginPath(); g.moveTo(w.x, w.y + w.h * 0.35); g.lineTo(w.x + w.w, w.y + w.h * 0.35); g.stroke();
      }
    }
  });
  const emissiveMap = canvasTex(W, H, (g) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    for (const w of wins) {
      if (Math.random() < 0.18 && w.kind !== 'door') continue;
      g.fillStyle = w.kind === 'door' ? '#ffd38a' : '#ffc874';
      if (w.kind === 'round') { g.beginPath(); g.arc(w.cx, w.cy, w.r, 0, 7); g.fill(); } else g.fillRect(w.x, w.y, w.w, w.h);
    }
  });
  const m = new THREE.MeshLambertMaterial({ map, emissiveMap, emissive: '#ffffff', emissiveIntensity: 0 });
  nightFacades.push(m);
  return m;
}

function curvedRoof(w, d, h, ridgeHalf, lift) {
  const M = 10, R = 8, per = 4 * M, pos = [], uv = [], idx = [];
  for (let r = 0; r <= R; r++) {
    const t = r / R, hx = w / 2 + (ridgeHalf - w / 2) * t, hz = (d / 2) * (1 - t), y = h * Math.pow(t, 1.7);
    const corners = [[-hx, hz], [hx, hz], [hx, -hz], [-hx, -hz]];
    for (let k = 0; k <= per; k++) {
      const kk = k % per, s = Math.floor(kk / M), u = (kk % M) / M, a = corners[s], b = corners[(s + 1) % 4];
      const lt = lift * Math.pow(1 - t, 2) * Math.pow(Math.abs(2 * u - 1), 4);
      pos.push(a[0] + (b[0] - a[0]) * u, y + lt, a[1] + (b[1] - a[1]) * u);
      uv.push((k / per) * ((2 * (w + d)) / 0.45), t * 3);

  }
  const row = per + 1;
  for (let r = 0; r < R; r++) for (let k = 0; k < per; k++) { const a = r * row + k, b = a + 1, c = a + row, e = c + 1; idx.push(a, b, c, b, e, c); }

  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));

  geo.computeVertexNormals();

}

function gourd(x, y, z, s, parent) {

function roof(w, d, h, ridgeHalf, lift, x, y, z, parent, mat = tileMat) {
  const g = new THREE.Group();

  mesh(curvedRoof(w, d, h, ridgeHalf, lift), mat, 0, 0, 0, g);
  for (const [sx, sz] of [[-1, 1], [1, 1], [1, -1], [-1, -1]]) {

const woodMat = lam(C.wood);
function bridge(a, b) {
  const dx = b.x - a.x, dz = b.z - a.z, ang = Math.atan2(dx, dz);
  const da = hexEdge(a.R, ang) - 0.3, db = hexEdge(b.R, ang + Math.PI) - 0.3;
  const sx = a.x + Math.sin(ang) * da, sz = a.z + Math.cos(ang) * da, ex = b.x - Math.sin(ang) * db, ez = b.z - Math.cos(ang) * db;
  const len = Math.hypot(ex - sx, ez - sz), g = new THREE.Group();
  g.position.set((sx + ex) / 2, 0, (sz + ez) / 2);
  g.rotation.y = ang;
  scene.add(g);
  const N = 10;
  for (let i = 0; i < N; i++) {
    const t0 = i / N, t1 = (i + 1) / N, y0 = Math.sin(t0 * Math.PI) * 1.2, y1 = Math.sin(t1 * Math.PI) * 1.2;
    const seg = mesh(new THREE.BoxGeometry(2.2, 0.16, len / N + 0.05), woodMat, 0, (y0 + y1) / 2, (t0 + t1) / 2 * len - len / 2, g);
    seg.rotation.x = -Math.atan2(y1 - y0, len / N);
    if (i % 2 === 0) for (const s of [-1, 1]) mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.6, 6), trunkMat, s * 1.05, y0 + 0.3, t0 * len - len / 2, g);
  }
  for (const s of [-1, 1]) for (let i = 0; i < N; i++) {
    const t0 = i / N, t1 = (i + 1) / N, y0 = Math.sin(t0 * Math.PI) * 1.2 + 0.6, y1 = Math.sin(t1 * Math.PI) * 1.2 + 0.6;
    const r = mesh(new THREE.BoxGeometry(0.06, 0.06, len / N + 0.05), trunkMat, s * 1.05, (y0 + y1) / 2, (t0 + t1) / 2 * len - len / 2, g, false);
    r.rotation.x = -Math.atan2(y1 - y0, len / N);
  }
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

  if (!downXY || Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]) > 6) return;

  let o = hit.object;
  while (o && !Object.values(islands).some((i) => i.group === o)) o = o.parent;
  const isl = o && Object.values(islands).find((i) => i.group === o);
  if (isl) select(isl.key);
});

const isTest = (name) => /測試|test/i.test(name);
const ymd = (t) => `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;

// gviz 的時間格式是「Date(2026,9,24,14,11,57)」，月份從 0 起算；也接受「2026/10/24 下午 2:11:57」
function toDate(v) {
  if (!v) return null;
  let m = String(v).match(/Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)/);
  if (m) return new Date(+m[1], +m[2], +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
  m = String(v).match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})(?:\s*(上午|下午)?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (!m) return null;
  let h = +(m[5] || 0);
  if (m[4] === '下午' && h < 12) h += 12;
  if (m[4] === '上午' && h === 12) h = 0;
  return new Date(+m[1], +m[2] - 1, +m[3], h, +(m[6] || 0), +(m[7] || 0));
}

// 居住地區是自由填寫，這裡只需要縣市
const CITIES = ['臺北市', '新北市', '桃園市', '臺中市', '臺南市', '高雄市', '基隆市', '新竹市', '嘉義市', '新竹縣', '苗栗縣', '彰化縣', '南投縣', '雲林縣', '嘉義縣', '屏東縣', '宜蘭縣', '花蓮縣', '臺東縣', '澎湖縣', '金門縣', '連江縣'];
const CITY_HINTS = { 新北市: ['板橋', '三重', '中和', '永和', '新莊', '新店', '樹林', '鶯歌', '三峽', '淡水', '汐止', '土城', '蘆洲', '五股', '泰山', '林口'],
  桃園市: ['中壢', '平鎮', '八德', '楊梅', '蘆竹', '大溪', '龍潭', '龜山', '大園', '觀音', '新屋', '青埔', '南崁', '內壢', '埔心', '藝文特區', '長庚', '迴龍'],
  臺北市: ['中正', '大同', '中山', '松山', '大安', '萬華', '信義', '士林', '北投', '內湖', '南港', '文山'] };
function cityOf(raw) {
  const s = raw.replace(/台/g, '臺').replace(/\s+/g, '');
  if (!s) return '未填寫';
  for (const c of CITIES) if (s.startsWith(c) || s.startsWith(c.slice(0, 2))) return c;
  for (const [c, list] of Object.entries(CITY_HINTS)) if (list.some((d) => s.startsWith(d) || s.includes(d))) return c;
  return '其他';
}

// 同一人（姓名＋生日）只算一次，報名日期用第一次填表那天
function summarize(table) {
  const head = table.cols.map((c) => String(c.label || '').trim());
  const col = (key) => head.findIndex((h) => h.includes(key));
  const c = { time: col('時間戳記'), name: col('姓名'), gender: col('性別'), birth: col('出生'), area: col('居住'), unit: col('所屬單位'), intro: col('介紹人') };
  if (c.time < 0 || c.name < 0) throw new Error('欄位不符');
  const byKey = new Map();
  table.rows.forEach((r) => {
    const cell = (i) => (i >= 0 && r.c[i] ? r.c[i] : null);
    const get = (i) => { const x = cell(i); return x && x.v != null ? String(x.v).trim() : ''; };
    const getDate = (i) => { const x = cell(i); return x ? (x.v != null ? String(x.v) : '') || x.f || '' : ''; };
    const name = get(c.name), time = toDate(getDate(c.time));
    if (!name || !time || isTest(name)) return;
    const key = name + '|' + getDate(c.birth);
    const prev = byKey.get(key);
    const first = prev && prev.first < time ? prev.first : time;
    const latest = !prev || prev.time <= time;
    const groups = CADRE_OF.get(name) || [];
    const row = latest ? { time, gender: get(c.gender), area: get(c.area), unit: get(c.unit), intro: get(c.intro) } : prev;
    byKey.set(key, { ...row, first, groups, selfCadre: SELF_CADRE.test(row.intro) });
  });
  return [...byKey.values()].map((p) => ({
    g: p.gender, city: cityOf(p.area), unit: p.unit || '未填寫',
    isCadre: p.selfCadre || p.groups.length > 0, cadre: p.groups, date: ymd(p.first),
  })).sort((a, b) => a.date.localeCompare(b.date));
}

let liveOk = false, lastLive = null, busy = false;
const stampText = () => new Date(dataStamp).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
function setStatus() {
  const st = $('status'), tx = $('statusText');
  if (demo) { st.dataset.state = 'demo'; tx.textContent = '示範模式：60 位學員＋全部幹部'; return; }
  st.dataset.state = liveOk ? 'live' : 'backup';
  tx.textContent = liveOk ? `已連線即時報名資料・${stampText()} 更新` : `即時資料連線失敗，顯示 ${stampText()} 的備份`;
}
async function loadPeople() {
  try {
    const r = await fetch(`${SHEET_URL}&t=${Date.now()}`, { cache: 'no-store' });
    const text = await r.text();
    const json = JSON.parse(text.replace(/^[\s\S]*?setResponse\(/, '').replace(/\);?\s*$/, ''));
    const people = summarize(json.table);
    if (!people.length) throw new Error('沒有資料');
    realPeople = people;
    dataStamp = new Date().toISOString();
    liveOk = true;
    lastLive = new Date();
    return;
  } catch (e) {
    // 已經連上過就保留上次的即時資料，只是狀態改成備份
    if (lastLive) { liveOk = false; return; }
  }
  try {
    const r = await fetch('../signup/data.json', { cache: 'no-store' });
    if (!r.ok) throw new Error();
    const d = await r.json();
    realPeople = d.people.map((p) => ({ g: p.gender, city: p.city, unit: p.unit, isCadre: !!p.isCadre, cadre: p.cadreGroups || [], date: p.last }));
    dataStamp = d.updated;
  } catch (e) {}
  liveOk = false;
}
async function loadData() {
  if (busy) return;
  busy = true;
  try {
    await loadPeople();
    try {
      const r = await fetch('../game/stats.json', { cache: 'no-store' });
      if (r.ok) { const s = await r.json(); if (s.updated) Object.assign(GAMES, { start: s.start, finish: s.finish, share: s.share }); }
    } catch (e) {}
    gameSpeed = 1 + Math.min(4, (GAMES.finish || 0) / 50);
    setStatus();
    lastView = '';
    applyDate();
  } finally {
    busy = false;
  }
}
$('status').addEventListener('click', () => { if (!demo) loadData(); });
if (innerWidth <= 720) panel.classList.add('collapsed-mobile');
applyDate();
setStatus();
loadData();
setInterval(() => { if (!document.hidden && !demo) loadData(); }, 5 * 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !demo) loadData(); });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  sizeTilt();
});

/* =========================================================
   動畫
   ========================================================= */
const clock = new THREE.Clock();
const WATER_DAY = new THREE.Color(C.water), WATER_NIGHT = new THREE.Color('#2c3d5c');
const SUN_DAY = new THREE.Color('#fff1d6'), SUN_NIGHT = new THREE.Color('#9fb3ff');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
let playAcc = 0;
function tick() {
  const rawDt = clock.getDelta(), dt = Math.min(rawDt, 0.05), t = clock.elapsedTime;

  // 晝夜 0.6 秒線性切換，和網站主題一致
  const stepN = dt / 0.6;
  nightT = nightT < nightTarget ? Math.min(nightTarget, nightT + stepN) : Math.max(nightTarget, nightT - stepN);
  scene.background.copy(DAY_BG).lerp(NIGHT_BG, nightT);
  scene.fog.color.copy(scene.background);
  water.material.color.copy(WATER_DAY).lerp(WATER_NIGHT, nightT);
  hemi.intensity = 1.6 - 0.95 * nightT;
  sun.intensity = 2.4 - 1.75 * nightT;
  sun.color.copy(SUN_DAY).lerp(SUN_NIGHT, nightT);
  for (const m of nightFacades) m.emissiveIntensity = nightT * 1.1;
  for (const g of glowMats) g.mat.emissiveIntensity = g.base + (g.night - g.base) * nightT;
  for (const l of lampLights) l.intensity = nightT * 6;

  if (playing) {
    playAcc += dt * 18;
    if (playAcc >= 1) {
      const step = Math.floor(playAcc); playAcc -= step;
      dayInput.value = Math.min(+dayInput.max, +dayInput.value + step);
      applyDate();
      if (+dayInput.value >= +dayInput.max) $('play').click();
    }
  }

  if (!reduceMotion) for (const a of animators) a(t);

  nextTrain -= dt;
  if (nextTrain <= 0) { spawnTrain(); nextTrain = 6 + Math.random() * 14; }
  for (let i = trains.length - 1; i >= 0; i--) {
    const tr = trains[i], d = tr.userData.dir;
    tr.position.x += d * tr.userData.speed * dt;
    if (d * tr.position.x > VL / 2 + tr.userData.len) { viaduct.remove(tr); trains.splice(i, 1); }
    else tr.visible = Math.abs(tr.position.x) < VL / 2 + 2;
  }

  for (const p of walkers) {
    const u = p.userData;
    if (p.scale.x < 1) p.scale.setScalar(Math.min(1, p.scale.x + dt * 3));
    if (reduceMotion) continue;
    p.position.y = Math.abs(Math.sin(t * 3 * u.speed + u.phase)) * 0.08;
    p.position.x = u.home.x + Math.sin(t * 0.3 * u.speed + u.phase) * u.roam;
    p.rotation.y = Math.cos(t * 0.3 * u.speed + u.phase) > 0 ? Math.PI / 2 : -Math.PI / 2;
  }

  if (tween) {
    tween.t += Math.min(rawDt, 0.25) / tween.dur;
    const k = ease(Math.min(1, tween.t));
    controls.target.lerpVectors(tween.ft, tween.tt, k);
    camera.position.lerpVectors(tween.fp, tween.tp, k);
    if (tween.t >= 1) tween = null;
  }
  controls.update();
  composer.render();
  placeTags();
  requestAnimationFrame(tick);
}
tick();
</script>
