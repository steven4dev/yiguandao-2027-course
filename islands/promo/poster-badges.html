<!doctype html><html><head><meta charset="utf-8">
<!-- 徽章牆分享預覽圖（1200×630）。右邊的方格是真的徽章 emoji／顏色（取自 islands/index.html 的 BADGES）；亮的幾格、暗的「？」就是鉤子：你亮了幾格？ -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Noto+Sans+TC:wght@500;700;900&display=block">
<style>
*{box-sizing:border-box}
body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:"Noto Sans TC","Noto Color Emoji",sans-serif;color:#1f2a3a;
 background:linear-gradient(160deg,#d3eef6 0%,#e3f4f3 45%,#f6efdc 100%);position:relative}
.txt{position:absolute;left:70px;top:62px;width:590px}
.kick{font-weight:700;font-size:26px;color:#d9770a;letter-spacing:.04em}
h1{margin:6px 0 0;font-family:"Noto Serif TC",serif;font-weight:900;font-size:124px;line-height:1.08;letter-spacing:.04em}
.pill{display:inline-block;margin-top:14px;padding:10px 30px 12px;border-radius:18px;background:#d9770a;color:#fff;font-weight:900;font-size:46px;letter-spacing:.04em;box-shadow:0 8px 20px rgba(217,119,10,.3)}
.desc{margin-top:22px;font-size:29px;font-weight:700;line-height:1.55}
.desc b{color:#d9770a}
.btns{margin-top:26px;display:flex;gap:16px}
.btn{padding:13px 26px;border-radius:999px;color:#fff;font-weight:900;font-size:28px;white-space:nowrap}
/* 徽章牆 */
.wall{position:absolute;right:46px;top:54px;width:470px;padding:18px 18px 16px;background:rgba(255,255,255,.78);border:4px solid #fff;border-radius:26px;box-shadow:0 18px 40px rgba(50,30,15,.18);transform:rotate(2deg)}
.wall .hd{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:24px;color:#3f2c22;margin-bottom:10px}
.wall .hd em{font-style:normal;color:#d9770a;font-size:30px}
.bar{height:12px;border-radius:99px;background:#e6dccb;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:21%;background:linear-gradient(90deg,#e0a83a,#d9770a);border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.t{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-size:34px;position:relative}
.t.on{background:#fff;border:3px solid var(--c);box-shadow:0 4px 10px rgba(50,30,15,.14)}
.t.off{background:#e3dccd;color:#b3a894;font-weight:900;font-size:26px;font-family:"Noto Serif TC",serif;box-shadow:inset 0 2px 5px rgba(0,0,0,.1)}
.t.new::after{content:"";position:absolute;top:-5px;right:-5px;width:15px;height:15px;border-radius:50%;background:#c0503f;box-shadow:0 0 0 3px #fff}
.t.glow{box-shadow:0 0 0 4px rgba(224,168,58,.35),0 6px 16px rgba(217,119,10,.4)}
/* 飄浮小卡 */
.chip{position:absolute;background:#fff;border:3px solid #e8a33a;border-radius:16px;padding:9px 16px;font-weight:900;font-size:22px;color:#3f2c22;box-shadow:0 8px 18px rgba(50,30,15,.16);white-space:nowrap}
.chip small{display:block;font-weight:500;font-size:14px;color:#7a6455;margin-top:1px}
.k1{right:36px;top:470px;transform:rotate(-3deg);border-color:#06b84f}
.k2{right:330px;top:530px;transform:rotate(3deg);border-color:#d6336c}
.k3{right:20px;top:548px;transform:rotate(2deg);border-color:#2f80c9;display:none}
</style></head><body>
<div class="wall">
  <div class="hd"><span>🏅 我的群島徽章</span><span><em>10</em> / 48</span></div>
  <div class="bar"><i></i></div>
  <div class="grid" id="g"></div>
</div>
<div class="chip k1">☁️ 搭筋斗雲繞一圈<small>這也是一枚徽章</small></div>
<div class="chip k2">🔒 藏著 2 格隱藏徽章<small>你找得到嗎？</small></div>
<div class="txt">
  <div class="kick">全真群島・徽章牆上線 🎉</div>
  <h1>徽章牆</h1>
  <div class="pill">你亮了幾格？</div>
  <div class="desc">48 格暗格等你一格一格點亮，<br>綁上 LINE，<b>換手機也不歸零！</b></div>
  <div class="btns"><span class="btn" style="background:#d9770a">🏅 點亮我的</span><span class="btn" style="background:#06b84f">💚 綁 LINE 存起來</span></div>
</div>
<script>
// 30 格示意：亮的用真實徽章的 emoji 與主色，其餘暗格；其中一格有「新徽章」紅點、一格發光
const on={0:['👣','#6b8f4e'],1:['👆','#7a6aa8'],2:['👋','#c27a4a'],3:['🎈','#c0503f'],6:['🍾','#2f80c9'],9:['🍎','#c8312b'],13:['🌅','#e0954a'],15:['🙏','#7a5aa6'],20:['🛶','#c0503f'],23:['🎮','#6a4fa8']};
let h='';for(let i=0;i<30;i++){const o=on[i];
 h+=o?`<div class="t on${i===9?' new glow':''}" style="--c:${o[1]}">${o[0]}</div>`:`<div class="t off">？</div>`}
document.getElementById('g').innerHTML=h;
document.fonts.ready.then(()=>{document.title='ready'})
</script>
</body></html>
