<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d151d">
<title>拂塵試煉｜拂塵淨心島</title>
<meta name="description" content="拂塵淨心島的體感小遊戲：手機就是拂塵柄，看清符印、倒數、大揮一拂，把六塵精淨化成蓮花。">
<style>
:root{
  --ink:#f6ecd8; --muted:#b9ab95; --gold:#e8bd5a; --gold-soft:rgba(232,189,90,.18); --good:#7fe0a6; --bad:#ff8a7a;
  --panel:rgba(20,16,12,.82); --line:rgba(232,189,90,.35); --btn:#e8bd5a; --btn-ink:#22190f; --bg:#0d151d;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#0d151d; } }
:root[data-theme="light"]{ --bg:#0d151d; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;pointer-events:none;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.hud .lamps{font-size:1.3rem;letter-spacing:2px}
.hud .lamps .off{filter:grayscale(1);opacity:.35}
.hud .mid{font-size:.9rem;color:var(--gold);text-align:center}
.hud .score{font-size:1rem;text-align:right}
.hud .score small{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.center{position:fixed;left:16px;right:16px;top:79%;transform:translateY(-50%);text-align:center;pointer-events:none;text-shadow:0 0 18px rgba(0,0,0,.8)}
.center .big{font-size:clamp(4rem,26vw,9rem);font-weight:900;line-height:1;color:#fff;text-shadow:0 0 30px rgba(255,214,120,.9)}
.center .mid{font-size:clamp(1.4rem,7vw,2.2rem);font-weight:900;display:inline-block;background:rgba(8,10,14,.62);border:1px solid var(--line);border-radius:999px;padding:4px 18px}
.center .sub{font-size:.95rem;color:var(--ink);margin:8px auto 0;display:table;background:rgba(8,10,14,.62);border-radius:999px;padding:3px 14px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:8px 16px calc(env(safe-area-inset-bottom) + 12px);display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.bottom button{pointer-events:auto}
.tag{font-size:.8rem;color:var(--muted);text-shadow:0 1px 4px #000}
button{font:inherit;cursor:pointer;border-radius:14px;border:1px solid var(--line);background:rgba(30,24,18,.75);color:var(--ink);padding:10px 16px}
button.primary{background:var(--btn);color:var(--btn-ink);border-color:transparent;font-weight:900}
button.big{width:100%;font-size:1.1rem;padding:14px}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(6,9,13,.55);overflow-y:auto}
.screen[hidden]{display:none}
.panel{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 18px;box-shadow:0 10px 40px rgba(0,0,0,.5);margin:auto}
.panel h1{margin:0 0 2px;font-size:1.6rem;color:var(--gold);letter-spacing:2px}
.panel h2{margin:0 0 8px;font-size:1.2rem;color:var(--gold)}
.panel p{margin:8px 0;line-height:1.65}
.panel .note{font-size:.85rem;color:var(--muted)}
.panel ul{margin:8px 0;padding-left:1.2em;line-height:1.7}
.panel .row{display:grid;gap:8px;margin-top:14px}
.prog{height:12px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;margin:12px 0}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .1s linear}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:10px 0;font-size:.95rem}
.stats b{color:var(--gold)}
.quote{margin:12px 0;padding:12px 14px;border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:8px;line-height:1.7}
.quote small{display:block;color:var(--muted);font-size:.75rem;margin-top:4px}
.ver{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 4px);font-size:.65rem;color:rgba(255,255,255,.35);pointer-events:none}
.mir{display:inline-block;transform:scaleX(-1)}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud" id="hud" hidden>
  <div class="lamps" id="lamps"></div>
  <div class="mid" id="wave"></div>
  <div class="score"><span id="score">0</span><small id="combo"></small></div>
</div>
<div class="center" id="center"></div>
<div class="bottom" id="bottomBar" hidden>
  <span class="tag" id="modeTag"></span>
  <button id="btnQuit">離開</button>
</div>

<!-- 開場 -->
<section class="screen" id="scrTitle">
  <div class="panel">
    <h1>🪶 拂塵試煉</h1>
    <p class="note" style="margin-top:0">拂塵淨心島・體感小遊戲（測試版）</p>
    <p>「時時勤拂拭，勿使惹塵埃。」六塵精從霧裡飄出來了！手機就是您的拂塵柄：<b>看清符印</b>、等倒數、聽到「<b>揮！</b>」就大揮一拂，把它們淨化成蓮花。</p>
    <ul>
      <li>🤚 手機直立握著，螢幕大致朝向自己；<b>整隻手臂揮出去</b>，手腕怎麼翻都沒關係。</li>
      <li>👀 揮的時候不用看螢幕，聽到「叮」再回來看拂塵的招式。</li>
      <li>🔊 請打開聲音（iPhone 關掉靜音鍵）。</li>
    </ul>
    <p><b>⚠️ 安全第一</b>：握緊手機、最好戴掛繩，周圍 1.5 公尺內不要有人和易碎物品。</p>
    <div class="row">
      <button class="primary big" id="btnStart">開始試煉</button>
      <button id="btnTouch">沒有動作感測？用手指畫</button>
    </div>
    <p class="note" id="titleMsg"></p>
  </div>
</section>

<!-- 舉拂定心 -->
<section class="screen" id="scrCalib" hidden>
  <div class="panel">
    <h2>🧘 舉拂定心</h2>
    <p>把手機<b>直立</b>拿在胸前，<b>螢幕朝著自己</b>，靜止不動約 2 秒。</p>
    <div class="prog"><i id="calibBar"></i></div>
    <p class="note" id="calibMsg">準備好就按「開始」。</p>
    <div class="row"><button class="primary big" id="btnCalib">開始</button><button id="btnCalibReuse" hidden>沿用上次的校正</button></div>
  </div>
</section>

<!-- 結算 -->
<section class="screen" id="scrResult" hidden>
  <div class="panel">
    <h2 id="resTitle">✨ 試煉圓滿</h2>
    <p id="resLine"></p>
    <div class="stats" id="resStats"></div>
    <div class="quote" id="resQuote"></div>
    <div class="row">
      <button class="primary big" id="btnAgain">再試煉一次</button>
      <button id="btnLab" onclick="location.href='../fuchen-lab/'">回揮符實驗室</button>
    </div>
  </div>
</section>
<div class="ver" id="ver"></div>

<script>
'use strict';
const VERSION = 'v261109.05';
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const $ = s => document.querySelector(s);
$('#ver').textContent = '拂塵試煉 ' + VERSION;
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
// 和揮符實驗室共用同一份校正（同一支手機做過就不用再做）
const settings = { sens:'auto', mirX:false, mirY:false };

/* ================= 辨識核心：和揮符實驗室 v261109.03 完全相同 ================= */
const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross3 = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const len3 = a => Math.hypot(a[0],a[1],a[2]);
const sub3 = (a,b) => [a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const scl3 = (a,s) => [a[0]*s,a[1]*s,a[2]*s];
const nrm3 = a => { const l = len3(a) || 1; return [a[0]/l,a[1]/l,a[2]/l]; };
function angDiff(a,b){ let d = ((a-b) % 360 + 540) % 360 - 180; return Math.abs(d); }
const DIR8 = [[0,'➡️','右'],[45,'↗️','右上'],[90,'⬆️','上'],[135,'↖️','左上'],[180,'⬅️','左'],[225,'↙️','左下'],[270,'⬇️','下'],[315,'↘️','右下']];
function dirLabel(deg){ let best = DIR8[0], bd = 999; for(const d of DIR8){ const e = angDiff(deg,d[0]); if(e < bd){ bd = e; best = d; } } return best; }


function arc(cx,cy,r,a0,a1,n){ const p=[]; for(let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*D2R; p.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]); } return p; }
function circleVariants(){
  return [
    arc(0,0,1,90,-270,48),   // 從上方、順時針
    arc(0,0,1,90,450,48),    // 從上方、逆時針
    arc(0,0,1,-90,-450,48),  // 從下方、順時針
    arc(0,0,1,-90,270,48),   // 從下方、逆時針
    arc(0,0,1,180,-180,48),  // 從左邊、順時針
    arc(0,0,1,0,360,48)      // 從右邊、逆時針
  ];
}
function alphaVariants(){
  // 節點三次曲線 x=t²-1, y=t(t²-1)：左邊一個圈、右邊兩條尾巴交叉，像手寫的 α
  const f = []; for(let i=0;i<=60;i++){ const t = 1.25 - 2.5*i/60; f.push([t*t-1, t*(t*t-1)]); }
  return [f, f.slice().reverse()];
}
function sCurve(){ return arc(0,0.5,0.5,20,270,24).concat(arc(0,-0.5,0.5,90,-160,24).slice(1)); }


const TEMPLATE_DEFS = {
  left:   { name:'左揮', v:[[[0,0],[-1,0]]] },
  right:  { name:'右揮', v:[[[0,0],[1,0]]] },
  down:   { name:'劈',   v:[[[0,0],[0,-1]]] },
  up:     { name:'上挑', v:[[[0,0],[0,1]]] },
  dr:     { name:'↘ 斜', v:[[[-1,1],[1,-1]]] },
  dl:     { name:'↙ 斜', v:[[[1,1],[-1,-1]]] },
  v:      { name:'V 字', v:[[[-1,1],[0,-1],[1,1]]] },
  circle: { name:'圓',   v:circleVariants() },
  z:      { name:'Z 字', v:[[[-1,1],[1,1],[-1,-1],[1,-1]]] },
  n:      { name:'N 字', v:[[[-1,-1],[-1,1],[1,-1],[1,1]]] },
  alpha:  { name:'阿法', v:alphaVariants() },
  ralpha: { name:'反向阿法', v:alphaVariants().map(p => p.map(q => [-q[0], q[1]])) },  // 阿法左右相反：圈在右邊、尾巴在左邊
  s:      { name:'S 字', v:[sCurve()] },
  // 左右相反的版本
  rs:     { name:'反向 S', v:[sCurve().map(q => [-q[0], q[1]])] },
  rz:     { name:'反向 Z', v:[[[1,1],[-1,1],[1,-1],[-1,-1]]] },
  rn:     { name:'反向 N', v:[[[1,-1],[1,1],[-1,-1],[-1,1]]] }
};
const NPTS = 64;
function pathLen(p){ let L=0; for(let i=1;i<p.length;i++) L += Math.hypot(p[i][0]-p[i-1][0], p[i][1]-p[i-1][1]); return L; }
function resample(pts, n){
  const L = pathLen(pts) / (n-1); if(!(L > 0)) return Array.from({length:n}, () => [pts[0][0], pts[0][1]]);
  const src = pts.map(p => [p[0],p[1]]), out = [[src[0][0], src[0][1]]]; let D = 0;
  for(let i=1;i<src.length;i++){
    const d = Math.hypot(src[i][0]-src[i-1][0], src[i][1]-src[i-1][1]);
    if(D + d >= L && d > 0){
      const t = (L - D)/d, q = [src[i-1][0] + t*(src[i][0]-src[i-1][0]), src[i-1][1] + t*(src[i][1]-src[i-1][1])];
      out.push(q); src.splice(i, 0, q); D = 0;
    } else D += d;
  }
  while(out.length < n) out.push([src[src.length-1][0], src[src.length-1][1]]);
  return out.slice(0, n);
}
// 縮放、重心移到原點。長寬比只「拉近一半」（比例開根號）：手臂大揮常把 N、Z 畫得很瘦長，
// 完全保留會認不出來；完全拉成正方形又會把直線拉變形
function normalize(pts){
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const p of pts){ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); }
  const w = x1-x0, h = y1-y0, s = Math.max(w, h) || 1; let cx=0, cy=0;
  const r = Math.min(w, h)/s, k = r > 1e-6 ? Math.sqrt(r)/r : 1;      // 短邊放大 k 倍：比例變成 √r
  const sx = w < h ? k/s : 1/s, sy = h < w ? k/s : 1/s;
  const q = pts.map(p => [p[0]*sx, p[1]*sy]); for(const p of q){ cx+=p[0]; cy+=p[1]; } cx/=q.length; cy/=q.length;
  return q.map(p => [p[0]-cx, p[1]-cy]);
}
const prep = pts => normalize(resample(pts, NPTS));
const TEMPLATES = Object.entries(TEMPLATE_DEFS).map(([k,d]) => ({ key:k, name:d.name, variants:d.v.map(prep) }));
function avgDist(a,b){ let s=0; for(let i=0;i<a.length;i++) s += Math.hypot(a[i][0]-b[i][0], a[i][1]-b[i][1]); return s/a.length; }
const distToScore = d => Math.max(0, Math.min(100, Math.round((1 - d/0.5)*100)));
function recognize(pts){
  const q = prep(pts);
  const res = TEMPLATES.map(t => {
    let best = Infinity, bi = 0;
    t.variants.forEach((v,i) => { const d = avgDist(q, v); if(d < best){ best = d; bi = i; } });
    return { key:t.key, name:t.name, d:best, score:distToScore(best), variant:bi };
  }).sort((a,b) => a.d - b.d);
  return { norm:q, ranking:res };
}


const SENS = { light:{ start:70, end:30 }, mid:{ start:110, end:45 }, heavy:{ start:170, end:65 } };
// 目前的揮動門檻：「自動」用四方拂塵量到的揮速
function th(){ if(settings.sens === 'auto') return (calib && calib.autoTh) || SENS.mid; return SENS[settings.sens] || SENS.mid; }

const calib = Object.assign({ bias:[0,0,0], gSign:1, done:false }, store.get('fuchenLab.calib', {}));
// 軸向修正前存的校正（偏移量、四方拂塵）都用錯的軸，全部作廢、請重新校正
if(calib.axisVer !== 2){ for(const k of ['bias','gSign','done','P','MT','M','dirInfo','dirRaw','autoTh','dirSkipped']) delete calib[k]; Object.assign(calib, { bias:[0,0,0], gSign:1, done:false, axisVer:2 }); }

const accAvail = () => ring.some(s => s.lax != null);
function currentUp(){
  const now = performance.now(), arr = ring.filter(s => now - s.t < 300);
  if(!arr.length) return [0,1,0];
  const g = [0,0,0]; for(const s of arr){ g[0]+=s.ax; g[1]+=s.ay; g[2]+=s.az; }
  if(len3(g)/arr.length < 3) return [0,1,0];
  return nrm3(scl3(g, calib.gSign));
}

/* 把陀螺儀轉動換到「玩家面前的世界座標」再累加（空中滑鼠的做法）：
   - 左右＝繞著「上方」轉（像揮劍橫掃，手機直立時是繞著手機長邊轉）
   - 上下＝繞著玩家的「右手方向」轉（像劈下、上挑）
   - 手機直立時，像雨刷一樣左右擺（繞著前方轉）也算左右
   這樣不管手機是直立、斜拿還是平拿往前指，方向都對得上。
   v261107.01 只追蹤「手機頂端指向哪裡」：直立的手機橫掃時頂端幾乎不動，才會被誤判成往上。 */
function makeIntegrator(up){
  let R = [1,0,0, 0,1,0, 0,0,1];        // 現在的手機座標 → 開始揮的那一刻的手機座標
  const U = nrm3(up);
  const hz = v => sub3(v, scl3(U, dot(v, U)));             // 去掉垂直分量
  // 玩家此刻面向的方向：以螢幕背面（-Z）的水平方向為主；手機越接近平拿（螢幕朝天），越改用手機頂端（+Y）
  // （頂端只在平拿時才參考：手機往側邊歪時，頂端的水平分量會把方向帶偏）
  // 每一步都用「當下」的面向來分左右、上下：身體轉了，劈和挑的軸也跟著轉
  let lastF = null;
  const facing = R => {
    const a = hz([-R[2], -R[5], -R[8]]), b = hz([R[1], R[4], R[7]]), wb = Math.max(0, Math.min(1, (0.6 - len3(a))/0.6));
    let F = [a[0] + b[0]*wb, a[1] + b[1]*wb, a[2] + b[2]*wb];
    if(len3(F) < 0.15) return lastF || nrm3(len3(a) > len3(b) ? a : b);
    return lastF = nrm3(F);
  };
  const P = calib.P || null;                              // 四方校正學到的 2×3 個人揮法轉換
  const pts = [{ x:0, y:0, lx:P ? 0 : null, ly:P ? 0 : null, sp:0, act:0, a:null, t:0 }]; let T = 0, X = 0, Y = 0, LX = 0, LY = 0;
  pts.meta = { U, F: facing([1,0,0, 0,1,0, 0,0,1]) };    // 開始那一刻的「上方」和「面向」，算移動軌跡用
  return {
    pts,
    step(s){
      const w = [(s.wx - calib.bias[0])*D2R, (s.wy - calib.bias[1])*D2R, (s.wz - calib.bias[2])*D2R];
      const wl = len3(w), th = wl * s.dt;
      // 角速度換到開始那一刻的座標（用這一步開始前的姿態）
      const ww = [R[0]*w[0]+R[1]*w[1]+R[2]*w[2], R[3]*w[0]+R[4]*w[1]+R[5]*w[2], R[6]*w[0]+R[7]*w[1]+R[8]*w[2]];
      const tip = [R[1], R[4], R[7]], F = facing(R), RT = cross3(F, U);
      const upright = Math.max(0, dot(tip, U));             // 手機頂端朝上的程度，雨刷式左右擺才算數
      X += (-dot(ww, U) + upright * dot(ww, F)) * s.dt;
      Y += dot(ww, RT) * s.dt;
      // 個人揮法：直接用手機座標的轉動（含正手、反手的翻面），照四方拂塵學到的對應換成左右、上下
      if(P){ LX += (P[0]*w[0] + P[1]*w[1] + P[2]*w[2]) * s.dt; LY += (P[3]*w[0] + P[4]*w[1] + P[5]*w[2]) * s.dt; }
      if(th > 1e-9){
        const k = scl3(w, 1/wl), c = Math.cos(th), sn = Math.sin(th), v = 1 - c;
        const M = [c+k[0]*k[0]*v, k[0]*k[1]*v-k[2]*sn, k[0]*k[2]*v+k[1]*sn,
                   k[1]*k[0]*v+k[2]*sn, c+k[1]*k[1]*v, k[1]*k[2]*v-k[0]*sn,
                   k[2]*k[0]*v-k[1]*sn, k[2]*k[1]*v+k[0]*sn, c+k[2]*k[2]*v];
        const N = new Array(9);
        for(let i=0;i<3;i++) for(let j=0;j<3;j++) N[i*3+j] = R[i*3]*M[j] + R[i*3+1]*M[3+j] + R[i*3+2]*M[6+j];
        R = N;
      }
      T += s.dt;

// 大揮之後手會往回收（回彈）：最後一次明顯減速之後，如果是一段比較慢、比較短、方向大致相反的移動，就把它剪掉

  const total = pathLen(xy); let cut = n;
  for(let k=n-3;k>=3;k--){
    if(!(sm[k] <= sm[k-1] && sm[k] <= sm[k+1] && sm[k] < vmax*0.3)) continue;          // 速度的低點
    const tail = xy.slice(k), tl = pathLen(tail); if(tl < total*0.08) continue;
    if(Math.max(...sm.slice(k)) > vmax*0.5) continue;                                   // 收手比較慢
    // 前一筆：從上一次明顯減速（或起點）到這裡
    let j = k - 2; while(j > 1 && !(sm[j] <= sm[j-1] && sm[j] <= sm[j+1] && sm[j] < vmax*0.3)) j--;

}

}

  const wsd = Math.max(sd('wx'), sd('wy'), sd('wz')), g = [mean('ax'), mean('ay'), mean('az')], gl = len3(g);
  if(wsd > 6){ $('#calibMsg').textContent = '手有點晃，請靠著身體、穩住再試一次。'; sfx.miss(); return; }
  if(gl > 3 && Math.abs(g[1])/gl < 0.6){ $('#calibMsg').textContent = '手機好像沒有直立。請讓手機頂端朝上、螢幕朝著自己再試一次。'; sfx.miss(); return; }
  const newCal = { bias:[mean('wx'), mean('wy'), mean('wz')], gSign: gl > 3 ? (g[1] >= 0 ? 1 : -1) : 1, done:true, at:Date.now(), axisVer:2 };
  for(const k of ['MT','P','M','dirInfo','dirRaw','autoTh']) delete calib[k];   // 新校正：熱身時重新學揮法
  Object.assign(calib, newCal); store.set('fuchenLab.calib', calib);
  sfx.ding(); vib(60); $('#calibBar').style.width = '100%'; $('#calibMsg').textContent = '定心完成 ✨'; await sleep(500);
  $('#scrCalib').hidden = true; runGame();
}
/* ---------------- 按鈕 ---------------- */
$('#btnStart').addEventListener('click', startGyro);
$('#btnTouch').addEventListener('click', () => { audioInit(); inputMode = 'touch'; keepAwake(); $('#scrTitle').hidden = true; runGame(); });
$('#btnCalib').addEventListener('click', runCalib);
$('#btnCalibReuse').addEventListener('click', () => { $('#scrCalib').hidden = true; runGame(); });
$('#btnAgain').addEventListener('click', () => { $('#scrResult').hidden = true; audioInit(); runGame(); });
$('#btnQuit').addEventListener('click', () => { cancelFlag = true; try{ speechSynthesis.cancel(); }catch(e){} });
fu = new Fuchen(); resize(); requestAnimationFrame(frame);
// 電腦測試用：?touch 直接進觸控模式
if(/[?&]touch\b/.test(location.search)){ inputMode = 'touch'; $('#scrTitle').hidden = true; runGame(); }
